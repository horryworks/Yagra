# Yagra — NATS server config for exposing the core⇄poller bus to REMOTE pollers.
#
# ── Why this file exists (and why TLS is mandatory here) ────────────────────────────
# The single-host MVP runs NATS plaintext on the internal Docker network — nothing is
# exposed, so no TLS/auth is needed. The moment you accept a poller from a REMOTE site
# over the WAN, that changes: bus job messages carry PLAINTEXT device credentials —
# SNMP communities, SNMPv3 auth/priv, API tokens (ADR-020, working-set model). Anyone
# who can read the bus can read every monitored device's credentials. So a bus that
# crosses a trust boundary MUST be TLS-encrypted AND authenticated (security.md:
# "TLS everywhere ... remote pollers over NAT/FW"). This config provides both.
#
# It is NOT loaded by default. docker-compose.deploy.yml keeps the plaintext internal
# bus unless you explicitly opt in (see its "accept remote-site pollers" block).
#
# ── Env-var expansion (nats:2-alpine / nats-server 2.x) ─────────────────────────────
# nats-server resolves `$VARIABLE` tokens against the process environment. Rules:
#   * write the reference UNQUOTED — `password: $YAGRA_NATS_CORE_PASSWORD`.
#     Quoting it (`"$FOO"`) makes it a literal string, NOT an expansion.
#   * if the variable is neither defined in this file nor present in the environment,
#     nats-server EXITS with a config error (fail-closed) — it never starts with an
#     empty/anonymous password. Set both passwords in the container env (compose does).
# No secrets live in this file: only `$VAR` references. Passwords come from
# YAGRA_NATS_CORE_PASSWORD / YAGRA_NATS_POLLER_PASSWORD (set them in `.env`).
#
# ── TLS certificate: generate a self-signed server cert + hand the CA to pollers ────
# The SAN MUST include the exact host/IP each poller dials in YAGRA_BUS_URL, or the
# poller's cert verification fails. One-liner (writes into the bind-mounted ./certs):
#
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout certs/server-key.pem -out certs/server-cert.pem \
#     -subj "/CN=yagra-nats" \
#     -addext "subjectAltName=DNS:nats,DNS:core.example.com,IP:192.168.1.2"
#
# The cert is self-signed, so it is its own CA. Hand `server-cert.pem` (the PUBLIC cert
# only — NEVER the key) to each remote poller and point YAGRA_BUS_CA_FILE at it (see
# docker-compose.poller.yml). The poller pins it via add_root_certificates.
#
# ── Per-poller credential scoping via Auth Callout (ADR-030) ────────────────────────
# The shared static `poller` account below grants `yagra.poller.assign.>` (ALL pollers'
# assignment subjects), so any authenticated poller could read any pool's working-set —
# i.e. any device credential on the bus. To close that, enable the `auth_callout` block
# in `authorization {}`: NATS then delegates every poller connection to core, which mints
# a signed user JWT scoped to only that poller's own subjects (`yagra.poller.assign.{id}`
# + its pool's jobs/discovery). The poller presents user=<its id>, name=<its pool>, and
# the shared bootstrap password; core validates the password and scopes on the id/pool.
#
# Setup (operator, one-time):
#   1. Generate an account nkey pair:  `nk -gen account -pubout`  (prints the seed `SA...`
#      then the public key `A...`), OR read core's startup log line "auth-callout enabled
#      ... issuer=A..." after mounting the seed.
#   2. Give core the SEED as a mounted file (never an env var): set
#      YAGRA_NATS_CALLOUT_SEED_FILE=/etc/yagra/callout-account.seed and mount it.
#   3. Give this server the PUBLIC key: set YAGRA_NATS_CALLOUT_ISSUER=A... in the nats env
#      and uncomment the `auth_callout` block below.
#   4. Roll all pollers to a build that presents id/pool (they already do from vX.Y.Z).
# The static `poller` account is kept as the N-1 / no-callout fallback. Once callout is on,
# a connecting poller is authorized by core's scoped JWT, not by the static permissions.

# Bus listener (published to the host by docker-compose.deploy.yml when enabled).
port: 4222

# Server TLS — every client connection is encrypted. Note: enabling server-wide TLS
# means the co-located core/poller must ALSO connect with tls:// (no plaintext port
# survives); docker-compose.deploy.yml documents that switch.
tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file:  "/etc/nats/certs/server-key.pem"
  # Clients authenticate with user/password over the TLS channel (below), so mutual-TLS
  # client certs aren't required. For mTLS you'd add `ca_file` + `verify: true` here.
}

# Token (user/password) authorization. Passwords are injected from the environment.
authorization {
  users [
    # core — full access (publishes jobs/assignments/discovery, consumes results,
    # heartbeats, sync-requests; uses JetStream). No permissions block = allow all.
    { user: core, password: $YAGRA_NATS_CORE_PASSWORD }

    # poller — least privilege. May publish ONLY its results + control-plane signals,
    # and subscribe ONLY to its jobs and working-set assignments. It can NOT read other
    # pollers' results, admin subjects, or JetStream API subjects.
    # NOTE: with `auth_callout` enabled (below), a connecting poller presents user=<its id>
    # (NOT the literal `poller`), so it does NOT match this static account — core's callout
    # authorizes it instead with a per-poller-scoped JWT. This static account remains the
    # fallback when callout is off, and is what `auth_callout.auth_users`/`core` bypasses.
    {
      user: poller
      password: $YAGRA_NATS_POLLER_PASSWORD
      permissions {
        publish {
          allow [
            "yagra.results"                # poll results → core
            "yagra.results.backfill"       # store-and-forward replay after a partition heals (Phase 3)
            "yagra.events"                 # passive syslog/trap events → core
            "yagra.discovery.results"      # discovery-sweep results → core
            "yagra.poller.heartbeat"       # liveness/telemetry → core registry (10s)
            "yagra.poller.sync_request"    # "resend my working set" → core
          ]
        }
        subscribe {
          allow [
            "yagra.jobs.>"                 # pool-scoped jobs (poll_now, legacy per-job push)
            "yagra.discovery.jobs"         # discovery sweeps (legacy, all-pools)
            "yagra.discovery.jobs.>"       # discovery sweeps (pool-scoped)
            "yagra.poller.assign.>"        # working-set snapshots/deltas (ADR-020; shared-acct caveat above)
            "_INBOX.>"                     # NATS client reply/mux inbox
          ]
        }
      }
    }
  ]

  # ── Auth Callout (ADR-030) — per-poller credential scoping ────────────────────────
  # Uncomment to delegate poller authorization to core. `issuer` is the account PUBLIC key
  # (A...) whose SEED core holds (YAGRA_NATS_CALLOUT_SEED_FILE); core signs each poller a
  # JWT scoped to only its own subjects. `auth_users: [ core ]` bypasses callout for core
  # itself (it authenticates with the static `core` account above). `account` is where
  # minted poller users are placed — must match core's YAGRA_NATS_CALLOUT_ACCOUNT ($G).
  # Requires YAGRA_NATS_CALLOUT_ISSUER in the nats env (fail-closed if referenced-and-unset).
  #
  # auth_callout {
  #   issuer: $YAGRA_NATS_CALLOUT_ISSUER
  #   auth_users: [ core ]
  #   account: "$G"
  # }
}
