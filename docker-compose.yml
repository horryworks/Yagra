# Yagra — single-node MVP composition.
#
# MVP runs all components co-located in a few containers; scaling out (distributed
# pollers, HA stores) is a config change, not a rewrite (see CLAUDE.md "Architecture").
# This is a skeleton: image build contexts and env wiring are stubs to be filled in
# as the crates land. Pin image tags before any real deployment.

name: yagra

services:
  # ── Yagra-core — orchestration, scheduling, northbound API ──
  core:
    build:
      context: .
      dockerfile: docker/yagra-core.Dockerfile
    image: ghcr.io/horryworks/yagra-core:dev
    depends_on: [postgres, redis, nats, victoriametrics]
    environment:
      YAGRA_DATABASE_URL: postgres://yagra:yagra@postgres:5432/yagra
      YAGRA_REDIS_URL: redis://redis:6379
      YAGRA_BUS_URL: nats://nats:4222
      YAGRA_TSDB_URL: http://victoriametrics:8428
      # Host self-metrics (Settings ▸ System Health ▸ Host resources): filesystems core reports
      # capacity for. `root` = the container rootfs; `metrics` = the VictoriaMetrics data volume
      # (mounted read-only below) so the metrics-storage disk trend is visible. Database growth is
      # tracked separately via pg_database_size (the pgdata dir is 0700 and can't be stat'd).
      YAGRA_DISK_WATCH_PATHS: "/=root,/hostfs/vm=metrics"
      # First-boot admin: if YAGRA_ADMIN_PASSWORD is unset, core generates a one-time random
      # admin password and prints it once in its logs (`docker compose logs core`). Uncomment
      # to choose your own:
      # YAGRA_ADMIN_PASSWORD: "choose-a-strong-password"
      # Viewing requires login by default. Uncomment to open reads:
      # YAGRA_PUBLIC_DASHBOARD: "true"
      # Distributed tracing (OpenTelemetry): unset = logs only (zero overhead). Uncomment to
      # export spans over OTLP/HTTP to the `jaeger` service below (run it with
      # `docker compose --profile tracing up`). At scale, also sample — see the poller note.
      # YAGRA_OTEL_ENDPOINT: "http://jaeger:4318"
    ports:
      - "8080:8080"   # northbound API
    volumes:
      # Read-only view of the metrics data volume so core can statvfs its backing disk for the
      # Host-resources "metrics" trend. Read-only: core only measures capacity, never writes here.
      - vmdata:/hostfs/vm:ro
    # cap_add: [NET_RAW]  # only if core itself runs ICMP; normally the poller does
    restart: unless-stopped

  # ── Yagra-poller — stateless, horizontally scalable ──
  poller:
    build:
      context: .
      dockerfile: docker/yagra-poller.Dockerfile
    image: ghcr.io/horryworks/yagra-poller:dev
    depends_on: [nats]
    environment:
      YAGRA_BUS_URL: nats://nats:4222
      # Passive-event listeners (syslog / SNMP traps, v1/v2c). The container binds
      # unprivileged ports; compose maps the standard host ports below. Unset = disabled.
      YAGRA_SYSLOG_BIND: 0.0.0.0:1514
      YAGRA_TRAP_BIND: 0.0.0.0:1162
      # Optional: drop traps whose community doesn't match (never logged).
      # YAGRA_TRAP_COMMUNITY: "public"
      # Rate limits (events/sec): per source IP and across all sources.
      # YAGRA_EVENT_RATE_PER_SOURCE: "50"
      # YAGRA_EVENT_RATE_GLOBAL: "500"
      # Distributed tracing (OpenTelemetry): match core's setting to trace a poll end to end
      # (core dispatch → poller poll → core ingest). At scale sample instead of tracing every
      # poll: OTEL_TRACES_SAMPLER=parentbased_traceidratio + OTEL_TRACES_SAMPLER_ARG=0.01.
      # YAGRA_OTEL_ENDPOINT: "http://jaeger:4318"
    ports:
      - "514:1514/udp"   # syslog intake
      - "162:1162/udp"   # SNMP trap intake
    # NOTE: with Docker bridge networking, verify device source IPs survive the port
    # mapping (conntrack DNAT usually preserves them; the userland proxy may not).
    # Event→node correlation keys on the source IP — if it's rewritten, run the poller
    # with `network_mode: host` instead of the port mappings above.
    cap_add:
      - NET_RAW        # required for raw-socket ICMP (surge-ping)
    # deploy: { replicas: 1 }  # scale out here when distributing polling
    restart: unless-stopped

  # ── Yagra-web (WebUI) ──
  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    image: ghcr.io/horryworks/yagra-web:dev
    depends_on: [core]
    ports:
      - "3000:8080"   # container listens on 8080 (rootless nginx-unprivileged)
    restart: unless-stopped

  # ── Stores ──
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yagra
      POSTGRES_PASSWORD: yagra
      POSTGRES_DB: yagra
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Message bus for core⇄poller distribution (Yagra-bus client).
  # NATS (ADR-007, resolved) is the chosen core⇄poller bus; JetStream for durable jobs.
  nats:
    image: nats:2-alpine
    command: ["-js"]   # JetStream for durable job delivery
    restart: unless-stopped

  # TSDB — VictoriaMetrics (ADR resolved) is the metrics body store.
  # Retention is 12 months (single tier); see requirements §8 "確定したパラメータ".
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command: ["--retentionPeriod=12"]
    volumes:
      - vmdata:/victoria-metrics-data
    restart: unless-stopped

  # ── OpenTelemetry trace collector (optional; self-observability) ──
  # Off by default: only starts with `docker compose --profile tracing up`. Jaeger all-in-one
  # receives OTLP (HTTP :4318) from core/poller and renders traces at http://localhost:16686.
  # To use it, also uncomment `YAGRA_OTEL_ENDPOINT: http://jaeger:4318` on core AND poller above.
  # Swap for an otel-collector → your backend (Tempo, Honeycomb, …) in a real deployment.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP/HTTP receiver (what YAGRA_OTEL_ENDPOINT points at)
    restart: unless-stopped

volumes:
  pgdata:
  vmdata:
