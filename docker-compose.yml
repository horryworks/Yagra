# Yagra — single-node MVP composition.
#
# MVP runs all components co-located in a few containers; scaling out (distributed
# pollers, HA stores) is a config change, not a rewrite (see CLAUDE.md "Architecture").
# This is a skeleton: image build contexts and env wiring are stubs to be filled in
# as the crates land. Pin image tags before any real deployment.

name: yagra

services:
  # ── TLS volume init — decide the certificate volume's ownership before anyone else can ──
  # See the long note in docker-compose.deploy.yml. Short version: core (uid 10001) writes the
  # WebUI certificate into `tlsdata` and nginx (uid 101) reads it, and whoever mounts the empty
  # volume first decides its ownership — so a root one-shot settles it before either can.
  tls-init:
    image: busybox:stable
    command:
      - sh
      - -c
      - "mkdir -p /tls && chown 10001:10001 /tls && chmod 0750 /tls"
    volumes:
      - tlsdata:/tls
    restart: "no"

  # ── Yagra-core — orchestration, scheduling, northbound API ──
  core:
    build:
      context: .
      dockerfile: docker/yagra-rust.Dockerfile
      target: core
    image: ghcr.io/horryworks/yagra-core:dev
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      nats: { condition: service_started }
      victoriametrics: { condition: service_started }
      victorialogs: { condition: service_started }
      clickhouse: { condition: service_started }
      tls-init: { condition: service_completed_successfully }
    environment:
      YAGRA_DATABASE_URL: postgres://yagra:yagra@postgres:5432/yagra
      YAGRA_REDIS_URL: redis://redis:6379
      YAGRA_BUS_URL: nats://nats:4222
      YAGRA_TSDB_URL: http://victoriametrics:8428
      # Event log store (ADR-024): passive events (syslog/trap/webhook) are searched from and
      # written to VictoriaLogs; PostgreSQL then keeps only alert-linked rows. Unset this to keep
      # events entirely in PostgreSQL (backward-compatible).
      YAGRA_LOGS_URL: http://victorialogs:9428
      # Flow store (ADR-031, the 5th store — traffic-flow tier). ClickHouse holds edge-aggregated
      # NetFlow/IPFIX flow records (1-month TTL, loss-tolerant). Unset this to disable flow
      # monitoring entirely — the flow API then returns 503 and existing features are unaffected.
      YAGRA_CLICKHOUSE_URL: http://clickhouse:8123
      # Flow retention in days (ClickHouse TTL). Default 30.
      # YAGRA_FLOW_RETENTION_DAYS: "30"
      # How long a poller pool must have nodes but no live poller before Yagra notifies (ADR-009's
      # self-monitoring blind spot). A poller announces its own departure, so an ordinary rolling
      # restart raises the condition instantly — this debounce is what stops that paging anyone.
      # `0` disables the notification; the gauges (yagra_pools_without_live_poller) still publish.
      # YAGRA_POOL_COVERAGE_ALERT_AFTER_SECS: "300"
      # Optional offline IP→ASN enrichment for flow AS (ADR-031 Increment 3, default-OFF). Non-BGP
      # exporters send AS=0; when this points at an iptoasn.com TSV, core fills those zeros and shows
      # AS names. The dataset comes from the `ipasn-updater` sidecar below via the named `ipasndata`
      # volume — core hot-reloads the file every YAGRA_IPASN_RELOAD_SECS, so a refresh needs no
      # restart. Uncomment both lines here plus the volume mount and the sidecar.
      #
      # NB use the named volume, NOT a host bind-mount like `./data/ipasn`. A host path is written
      # by the container as root, and the deploy job's `git clean -ffdx` then can't remove it —
      # which fails the checkout outright. The named volume sidesteps that and survives redeploys.
      # YAGRA_IPASN_DB: /data/ipasn/ip2asn.tsv
      # YAGRA_IPASN_RELOAD_SECS: "21600"
      # Host self-metrics (Settings ▸ System Health ▸ Host resources): filesystems core reports
      # capacity for. `root` = the container rootfs; `metrics` = the VictoriaMetrics data volume
      # (mounted read-only below) so the metrics-storage disk trend is visible. Database growth is
      # tracked separately via pg_database_size (the pgdata dir is 0700 and can't be stat'd).
      YAGRA_DISK_WATCH_PATHS: "/=root,/hostfs/vm=metrics"
      # First-boot admin: if YAGRA_ADMIN_PASSWORD is unset, core generates a one-time random
      # admin password and prints it once in its logs (`docker compose logs core`). Uncomment
      # to choose your own:
      # YAGRA_ADMIN_PASSWORD: "choose-a-strong-password"
      # Viewing requires login by default. Uncomment to open reads:
      # YAGRA_PUBLIC_DASHBOARD: "true"
      # MCP server (ADR-028): off by default. Uncomment to expose the read-only AI/MCP tool surface
      # at /mcp on the API port (auth always required). See README ▸ "Connecting an AI client".
      # YAGRA_ENABLE_MCP: "true"
      # Distributed tracing (OpenTelemetry): unset = logs only (zero overhead). Uncomment to
      # export spans over OTLP/HTTP to the `jaeger` service below (run it with
      # `docker compose --profile tracing up`). At scale, also sample — see the poller note.
      # YAGRA_OTEL_ENDPOINT: "http://jaeger:4318"
      # Where core materializes the WebUI's TLS certificate (ADR-044), written before it binds its
      # listener so `web`'s depends_on-healthy is a real guarantee that the file exists.
      #
      # ⚠️ This stack has no kek-init, so the KEK is EPHEMERAL — regenerated every restart. A
      # self-signed certificate is therefore regenerated too (harmless, new browser warning). An
      # *imported* one cannot be decrypted after a restart: core leaves the materialized file alone,
      # logs an error and raises an event rather than replacing your certificate with a self-signed
      # one. Use docker-compose.deploy.yml, which mounts a persistent KEK, for anything real.
      YAGRA_TLS_DIR: /var/lib/yagra/tls
      # Core's own log, on disk as well as on stdout (ADR-045) — hourly files, 48 of them, pruned
      # automatically. Read back by the support bundle at Settings ▸ System Health, which is how a
      # deployment nobody can open a shell on still hands over a panic from a run that has ended.
      YAGRA_LOG_DIR: /var/log/yagra
    ports:
      - "8080:8080"   # northbound API
    volumes:
      # Read-only view of the metrics data volume so core can statvfs its backing disk for the
      # Host-resources "metrics" trend. Read-only: core only measures capacity, never writes here.
      - vmdata:/hostfs/vm:ro
      # WebUI TLS certificate (ADR-044) — read-write here, read-only in `web`.
      - tlsdata:/var/lib/yagra/tls
      # Core's rotated log files (ADR-045) — a named volume so they outlive the container.
      - logdata:/var/log/yagra
      # Offline IP→ASN dataset (ADR-031 Increment 3) — read-only, from the named `ipasndata` volume
      # the `ipasn-updater` sidecar writes. Uncomment with YAGRA_IPASN_DB above.
      # - ipasndata:/data/ipasn:ro
    # cap_add: [NET_RAW]  # only if core itself runs ICMP; normally the poller does
    restart: unless-stopped

  # ── Yagra-poller — stateless, horizontally scalable ──
  poller:
    build:
      context: .
      dockerfile: docker/yagra-rust.Dockerfile
      target: poller
    image: ghcr.io/horryworks/yagra-poller:dev
    depends_on: [nats]
    environment:
      YAGRA_BUS_URL: nats://nats:4222
      # Passive-event listeners (syslog / SNMP traps, v1/v2c). The container binds
      # unprivileged ports; compose maps the standard host ports below. Unset = disabled.
      YAGRA_SYSLOG_BIND: 0.0.0.0:1514
      YAGRA_TRAP_BIND: 0.0.0.0:1162
      # Optional: drop traps whose community doesn't match (never logged).
      # YAGRA_TRAP_COMMUNITY: "public"
      # Rate limits (events/sec): per source IP and across all sources. These are the built-in
      # defaults spelled out — raised from 50/500 once S8 measured the edge (scalability audit).
      # YAGRA_EVENT_RATE_PER_SOURCE: "200"
      # YAGRA_EVENT_RATE_GLOBAL: "5000"
      # Flow collector (ADR-031): receive NetFlow v5/v9 / IPFIX exports, edge-aggregate to top-N per
      # bucket, and publish to core (which writes ClickHouse). Unset = disabled. Point your devices'
      # flow export at this poller's :2055. Tunables: bucket width / top-N / flow rate caps.
      YAGRA_FLOW_BIND: 0.0.0.0:2055
      # sFlow v5 (ADR-031 Increment 2): packet-sampling export on its own port. Off by default —
      # uncomment (and publish :6343 below) to receive sFlow. Counts are sampling-rate-scaled
      # estimates; shares the flow buckets/top-N/rate caps with NetFlow.
      # YAGRA_SFLOW_BIND: 0.0.0.0:6343
      # YAGRA_FLOW_BUCKET_SECS: "60"       # aggregation window (bucket) in seconds
      # YAGRA_FLOW_TOP_N: "500"            # top flows kept per exporter per bucket
      # YAGRA_FLOW_RATE_PER_SOURCE: "1000" # flow datagrams/sec per source IP
      # YAGRA_FLOW_RATE_GLOBAL: "20000"    # flow datagrams/sec across all sources
      # Distributed tracing (OpenTelemetry): match core's setting to trace a poll end to end
      # (core dispatch → poller poll → core ingest). At scale sample instead of tracing every
      # poll: OTEL_TRACES_SAMPLER=parentbased_traceidratio + OTEL_TRACES_SAMPLER_ARG=0.01.
      # YAGRA_OTEL_ENDPOINT: "http://jaeger:4318"
      # Store-and-forward (Phase 3): buffers results locally during a core↔poller partition and
      # replays them on reconnect. ON by default; the buffer is bounded (drop-oldest) and spills to
      # the volume below so it survives a poller restart. Tune the caps or set =off to disable.
      # YAGRA_STORE_FORWARD: "off"
      # YAGRA_STORE_FORWARD_MEM_MAX: "20000"      # results held in memory before spilling to disk
      # YAGRA_STORE_FORWARD_DISK_MAX_MB: "512"    # max on-disk spill (oldest dropped past this)
      # YAGRA_STORE_FORWARD_MAX_AGE_SECS: "86400" # drop buffered results older than this at replay
      # YAGRA_STORE_FORWARD_DISK_FREE_FLOOR_MB: "1024"  # stop spilling if the fs free space is below
    ports:
      - "514:1514/udp"   # syslog intake
      - "162:1162/udp"   # SNMP trap intake
      - "2055:2055/udp"  # NetFlow v5/v9 / IPFIX flow intake (ADR-031)
      # - "6343:6343/udp"  # sFlow intake (ADR-031 Increment 2) — enable with YAGRA_SFLOW_BIND above
    # NOTE: with Docker bridge networking, verify device source IPs survive the port
    # mapping (conntrack DNAT usually preserves them; the userland proxy may not).
    # Event→node correlation keys on the source IP — if it's rewritten, run the poller
    # with `network_mode: host` instead of the port mappings above.
    cap_add:
      - NET_RAW        # required for raw-socket ICMP (surge-ping)
    volumes:
      # Store-and-forward spill (Phase 3) — persists the buffer across poller restarts.
      - pollerbuf:/var/lib/yagra/buffer
    # deploy: { replicas: 1 }  # scale out here when distributing polling
    restart: unless-stopped

  # ── Yagra-web (WebUI) — HTTPS by default (ADR-044) ──
  # https://localhost:8443/ once the stack is up. The certificate is the self-signed one core
  # generates on first start, so the browser will warn; import a real one at Settings ▸ TLS.
  #
  # 8443 rather than 443 here on purpose: this is the developer stack, a laptop usually has 443
  # taken already, and rootless Docker cannot publish a port below 1024 at all — a first-run
  # failure on `docker compose up --build` would be a poor trade for matching the deploy file.
  # docker-compose.deploy.yml uses 443.
  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    image: ghcr.io/horryworks/yagra-web:dev
    # Wait for core to actually serve (its image HEALTHCHECK probes /healthz), not just to start —
    # nginx proxies /api to it, so starting before core is ready would 502 the first requests. Since
    # ADR-044 core also writes the certificate before it binds, so healthy ⇒ server.pem exists.
    depends_on:
      core:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    environment:
      YAGRA_WEB_TLS: ${YAGRA_WEB_TLS:-on}
    # nginx is uid 101; the certificate volume is owned by core's uid 10001, mode 0750. See the
    # note in docker-compose.deploy.yml — `user: "10001:10001"` would break the image.
    group_add:
      # core's uid AND gid, both pinned to 10001 in docker/yagra-rust.Dockerfile. The gid is the half
      # that matters here: the bundle is written 0640 owned by that group, so joining any other group
      # lets nginx traverse the directory and still fail to read the file.
      - "10001"
    volumes:
      - tlsdata:/etc/nginx/certs:ro
    ports:
      - "${YAGRA_WEB_PORT:-8443}:8080"   # container port is 8080 in both TLS and plaintext modes
    restart: unless-stopped

  # ── Stores ──
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yagra
      POSTGRES_PASSWORD: yagra
      POSTGRES_DB: yagra
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Message bus for core⇄poller distribution (Yagra-bus client).
  # NATS (ADR-007, resolved) is the chosen core⇄poller bus; JetStream for durable jobs.
  nats:
    image: nats:2-alpine
    command: ["-js"]   # JetStream for durable job delivery
    restart: unless-stopped

  # TSDB — VictoriaMetrics (ADR resolved) is the metrics body store.
  # Retention is 12 months (single tier). This flag is the ONLY way to change it: VictoriaMetrics
  # has no runtime API for retention, so Yagra reports this value (read back from /flags) but
  # cannot set it — see ADR-040. Edit here, then `up -d victoriametrics` to recreate just this one.
  victoriametrics:
    # Pinned, not `:latest` — this holds the metrics history, and ADR-017 makes "an upgrade must
    # never lose or corrupt data" a top-tier policy. A floating tag lets an unrelated `docker
    # compose pull` swap the storage engine underneath it, which is the same class of trap as the
    # `rust:<x>-slim` GLIBC pin documented in CLAUDE.md. Bump this deliberately, with a backup.
    image: victoriametrics/victoria-metrics:v1.148.0
    command: ["--retentionPeriod=12"]
    volumes:
      - vmdata:/victoria-metrics-data
    restart: unless-stopped

  # Event log store — VictoriaLogs (ADR-024, the 4th data class). Holds the full passive-event
  # firehose (syslog/trap/webhook) for full-text search; sibling to VictoriaMetrics (same ops
  # model). Retention is 30 days (search/forensics window); the 90-day must-preserve subset is
  # the alert-linked rows in PostgreSQL. As with victoriametrics above, this flag is the only way
  # to change it — VictoriaLogs has no runtime retention API, so Yagra reports the value it reads
  # back from /flags but cannot set it (ADR-040). Internal only (port 9428, no host mapping).
  victorialogs:
    # Pinned for the same reason as victoriametrics above.
    image: victoriametrics/victoria-logs:v1.52.0
    command: ["-retentionPeriod=30d", "-storageDataPath=/victoria-logs-data"]
    volumes:
      - vldata:/victoria-logs-data
    restart: unless-stopped

  # Flow store — ClickHouse (ADR-031, the 5th store). Column-oriented store for edge-aggregated
  # NetFlow/IPFIX flow records: high-cardinality tuples the TSDB can't hold, kept with a 1-month
  # TTL (loss-tolerant tier). core creates the schema/rollup MV on startup and writes over HTTP
  # (:8123). Internal only (no host mapping). ClickHouse is I/O + page-cache heavy — split it onto
  # a dedicated VM/node pool at scale (change YAGRA_CLICKHOUSE_URL only).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      # Single-node MVP: the default user, no password, reachable from the internal network.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
    restart: unless-stopped

  # ── IP→ASN dataset updater (ADR-031 Increment 3; optional, off by default) ──
  # Keeps the offline flow-enrichment table fresh entirely inside Docker — no host cron, no host
  # path. Fetches the public-domain iptoasn.com TSV into the shared `ipasndata` volume with an
  # atomic write; core mounts the same volume read-only and hot-reloads it (YAGRA_IPASN_RELOAD_SECS)
  # with no restart. This container is the ONLY component that reaches the internet for enrichment —
  # core never does. `docker-compose.deploy.yml` runs it unconditionally; here it is opt-in.
  #
  # To enable: uncomment this service, the `ipasndata` volume at the bottom, and the two
  # YAGRA_IPASN_* env lines plus the `ipasndata:/data/ipasn:ro` mount on core. $$ escapes keep the
  # shell vars for the container, not compose.
  # ipasn-updater:
  #   image: alpine:3.20
  #   restart: unless-stopped
  #   environment:
  #     YAGRA_IPASN_REFRESH_SECS: ${YAGRA_IPASN_REFRESH_SECS:-604800}
  #     YAGRA_IPASN_URL: ${YAGRA_IPASN_URL:-https://iptoasn.com/data/ip2asn-combined.tsv.gz}
  #   volumes:
  #     - ipasndata:/data/ipasn
  #   command:
  #     - sh
  #     - -c
  #     - |
  #       apk add --no-cache curl >/dev/null 2>&1 || true
  #       while true; do
  #         echo "ipasn-updater: fetching $$YAGRA_IPASN_URL"
  #         if curl -fsSL "$$YAGRA_IPASN_URL" | gunzip > /data/ipasn/ip2asn.tsv.tmp && [ -s /data/ipasn/ip2asn.tsv.tmp ]; then
  #           mv /data/ipasn/ip2asn.tsv.tmp /data/ipasn/ip2asn.tsv
  #           echo "ipasn-updater: wrote $$(wc -l < /data/ipasn/ip2asn.tsv) rows"
  #         else
  #           echo "ipasn-updater: fetch failed — keeping previous"; rm -f /data/ipasn/ip2asn.tsv.tmp
  #         fi
  #         sleep "$$YAGRA_IPASN_REFRESH_SECS"
  #       done

  # ── OpenTelemetry trace collector (optional; self-observability) ──
  # Off by default: only starts with `docker compose --profile tracing up`. Jaeger all-in-one
  # receives OTLP (HTTP :4318) from core/poller and renders traces at http://localhost:16686.
  # To use it, also uncomment `YAGRA_OTEL_ENDPOINT: http://jaeger:4318` on core AND poller above.
  # Swap for an otel-collector → your backend (Tempo, Honeycomb, …) in a real deployment.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP/HTTP receiver (what YAGRA_OTEL_ENDPOINT points at)
    restart: unless-stopped

volumes:
  pgdata:
  vmdata:
  vldata:
  chdata:      # ClickHouse flow store (ADR-031)
  pollerbuf:   # store-and-forward result buffer (Phase 3)
  tlsdata:     # WebUI TLS certificate (ADR-044) — core writes it, web reads it; see tls-init
  logdata:     # core's rotated log files (ADR-045), read back by the support bundle
  # ipasndata: # offline IP→ASN dataset (ADR-031) — uncomment with the ipasn-updater service above
