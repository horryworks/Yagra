# Yagra — single-node MVP composition.
#
# MVP runs all components co-located in a few containers; scaling out (distributed
# pollers, HA stores) is a config change, not a rewrite (see CLAUDE.md "Architecture").
# This is a skeleton: image build contexts and env wiring are stubs to be filled in
# as the crates land. Pin image tags before any real deployment.

name: yagra

services:
  # ── Yagra-core — orchestration, scheduling, northbound API ──
  core:
    build:
      context: .
      dockerfile: docker/yagra-core.Dockerfile
    image: ghcr.io/horryworks/yagra-core:dev
    depends_on: [postgres, redis, nats, victoriametrics, victorialogs, clickhouse]
    environment:
      YAGRA_DATABASE_URL: postgres://yagra:yagra@postgres:5432/yagra
      YAGRA_REDIS_URL: redis://redis:6379
      YAGRA_BUS_URL: nats://nats:4222
      YAGRA_TSDB_URL: http://victoriametrics:8428
      # Event log store (ADR-024): passive events (syslog/trap/webhook) are searched from and
      # written to VictoriaLogs; PostgreSQL then keeps only alert-linked rows. Unset this to keep
      # events entirely in PostgreSQL (backward-compatible).
      YAGRA_LOGS_URL: http://victorialogs:9428
      # Flow store (ADR-031, the 4th store — traffic-flow tier). ClickHouse holds edge-aggregated
      # NetFlow/IPFIX flow records (1-month TTL, loss-tolerant). Unset this to disable flow
      # monitoring entirely — the flow API then returns 503 and existing features are unaffected.
      YAGRA_CLICKHOUSE_URL: http://clickhouse:8123
      # Flow retention in days (ClickHouse TTL). Default 30.
      # YAGRA_FLOW_RETENTION_DAYS: "30"
      # Host self-metrics (Settings ▸ System Health ▸ Host resources): filesystems core reports
      # capacity for. `root` = the container rootfs; `metrics` = the VictoriaMetrics data volume
      # (mounted read-only below) so the metrics-storage disk trend is visible. Database growth is
      # tracked separately via pg_database_size (the pgdata dir is 0700 and can't be stat'd).
      YAGRA_DISK_WATCH_PATHS: "/=root,/hostfs/vm=metrics"
      # First-boot admin: if YAGRA_ADMIN_PASSWORD is unset, core generates a one-time random
      # admin password and prints it once in its logs (`docker compose logs core`). Uncomment
      # to choose your own:
      # YAGRA_ADMIN_PASSWORD: "choose-a-strong-password"
      # Viewing requires login by default. Uncomment to open reads:
      # YAGRA_PUBLIC_DASHBOARD: "true"
      # Distributed tracing (OpenTelemetry): unset = logs only (zero overhead). Uncomment to
      # export spans over OTLP/HTTP to the `jaeger` service below (run it with
      # `docker compose --profile tracing up`). At scale, also sample — see the poller note.
      # YAGRA_OTEL_ENDPOINT: "http://jaeger:4318"
    ports:
      - "8080:8080"   # northbound API
    volumes:
      # Read-only view of the metrics data volume so core can statvfs its backing disk for the
      # Host-resources "metrics" trend. Read-only: core only measures capacity, never writes here.
      - vmdata:/hostfs/vm:ro
    # cap_add: [NET_RAW]  # only if core itself runs ICMP; normally the poller does
    restart: unless-stopped

  # ── Yagra-poller — stateless, horizontally scalable ──
  poller:
    build:
      context: .
      dockerfile: docker/yagra-poller.Dockerfile
    image: ghcr.io/horryworks/yagra-poller:dev
    depends_on: [nats]
    environment:
      YAGRA_BUS_URL: nats://nats:4222
      # Passive-event listeners (syslog / SNMP traps, v1/v2c). The container binds
      # unprivileged ports; compose maps the standard host ports below. Unset = disabled.
      YAGRA_SYSLOG_BIND: 0.0.0.0:1514
      YAGRA_TRAP_BIND: 0.0.0.0:1162
      # Optional: drop traps whose community doesn't match (never logged).
      # YAGRA_TRAP_COMMUNITY: "public"
      # Rate limits (events/sec): per source IP and across all sources.
      # YAGRA_EVENT_RATE_PER_SOURCE: "50"
      # YAGRA_EVENT_RATE_GLOBAL: "500"
      # Flow collector (ADR-031): receive NetFlow v5/v9 / IPFIX exports, edge-aggregate to top-N per
      # bucket, and publish to core (which writes ClickHouse). Unset = disabled. Point your devices'
      # flow export at this poller's :2055. Tunables: bucket width / top-N / flow rate caps.
      YAGRA_FLOW_BIND: 0.0.0.0:2055
      # sFlow v5 (ADR-031 Increment 2): packet-sampling export on its own port. Off by default —
      # uncomment (and publish :6343 below) to receive sFlow. Counts are sampling-rate-scaled
      # estimates; shares the flow buckets/top-N/rate caps with NetFlow.
      # YAGRA_SFLOW_BIND: 0.0.0.0:6343
      # YAGRA_FLOW_BUCKET_SECS: "60"       # aggregation window (bucket) in seconds
      # YAGRA_FLOW_TOP_N: "500"            # top flows kept per exporter per bucket
      # YAGRA_FLOW_RATE_PER_SOURCE: "1000" # flow datagrams/sec per source IP
      # YAGRA_FLOW_RATE_GLOBAL: "20000"    # flow datagrams/sec across all sources
      # Distributed tracing (OpenTelemetry): match core's setting to trace a poll end to end
      # (core dispatch → poller poll → core ingest). At scale sample instead of tracing every
      # poll: OTEL_TRACES_SAMPLER=parentbased_traceidratio + OTEL_TRACES_SAMPLER_ARG=0.01.
      # YAGRA_OTEL_ENDPOINT: "http://jaeger:4318"
      # Store-and-forward (Phase 3): buffers results locally during a core↔poller partition and
      # replays them on reconnect. ON by default; the buffer is bounded (drop-oldest) and spills to
      # the volume below so it survives a poller restart. Tune the caps or set =off to disable.
      # YAGRA_STORE_FORWARD: "off"
      # YAGRA_STORE_FORWARD_MEM_MAX: "20000"      # results held in memory before spilling to disk
      # YAGRA_STORE_FORWARD_DISK_MAX_MB: "512"    # max on-disk spill (oldest dropped past this)
      # YAGRA_STORE_FORWARD_MAX_AGE_SECS: "86400" # drop buffered results older than this at replay
      # YAGRA_STORE_FORWARD_DISK_FREE_FLOOR_MB: "1024"  # stop spilling if the fs free space is below
    ports:
      - "514:1514/udp"   # syslog intake
      - "162:1162/udp"   # SNMP trap intake
      - "2055:2055/udp"  # NetFlow v5/v9 / IPFIX flow intake (ADR-031)
      # - "6343:6343/udp"  # sFlow intake (ADR-031 Increment 2) — enable with YAGRA_SFLOW_BIND above
    # NOTE: with Docker bridge networking, verify device source IPs survive the port
    # mapping (conntrack DNAT usually preserves them; the userland proxy may not).
    # Event→node correlation keys on the source IP — if it's rewritten, run the poller
    # with `network_mode: host` instead of the port mappings above.
    cap_add:
      - NET_RAW        # required for raw-socket ICMP (surge-ping)
    volumes:
      # Store-and-forward spill (Phase 3) — persists the buffer across poller restarts.
      - pollerbuf:/var/lib/yagra/buffer
    # deploy: { replicas: 1 }  # scale out here when distributing polling
    restart: unless-stopped

  # ── Yagra-web (WebUI) ──
  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    image: ghcr.io/horryworks/yagra-web:dev
    # Wait for core to actually serve (its image HEALTHCHECK probes /healthz), not just to start —
    # nginx proxies /api to it, so starting before core is ready would 502 the first requests.
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "3000:8080"   # container listens on 8080 (rootless nginx-unprivileged)
    restart: unless-stopped

  # ── Stores ──
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yagra
      POSTGRES_PASSWORD: yagra
      POSTGRES_DB: yagra
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Message bus for core⇄poller distribution (Yagra-bus client).
  # NATS (ADR-007, resolved) is the chosen core⇄poller bus; JetStream for durable jobs.
  nats:
    image: nats:2-alpine
    command: ["-js"]   # JetStream for durable job delivery
    restart: unless-stopped

  # TSDB — VictoriaMetrics (ADR resolved) is the metrics body store.
  # Retention is 12 months (single tier); see requirements §8 "確定したパラメータ".
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command: ["--retentionPeriod=12"]
    volumes:
      - vmdata:/victoria-metrics-data
    restart: unless-stopped

  # Event log store — VictoriaLogs (ADR-024, the 4th data class). Holds the full passive-event
  # firehose (syslog/trap/webhook) for full-text search; sibling to VictoriaMetrics (same ops
  # model). Retention is 30 days (search/forensics window); the 90-day must-preserve subset is
  # the alert-linked rows in PostgreSQL. Internal only (port 9428, no host mapping).
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    command: ["-retentionPeriod=30d", "-storageDataPath=/victoria-logs-data"]
    volumes:
      - vldata:/victoria-logs-data
    restart: unless-stopped

  # Flow store — ClickHouse (ADR-031, the 4th store). Column-oriented store for edge-aggregated
  # NetFlow/IPFIX flow records: high-cardinality tuples the TSDB can't hold, kept with a 1-month
  # TTL (loss-tolerant tier). core creates the schema/rollup MV on startup and writes over HTTP
  # (:8123). Internal only (no host mapping). ClickHouse is I/O + page-cache heavy — split it onto
  # a dedicated VM/node pool at scale (change YAGRA_CLICKHOUSE_URL only).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      # Single-node MVP: the default user, no password, reachable from the internal network.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
    restart: unless-stopped

  # ── OpenTelemetry trace collector (optional; self-observability) ──
  # Off by default: only starts with `docker compose --profile tracing up`. Jaeger all-in-one
  # receives OTLP (HTTP :4318) from core/poller and renders traces at http://localhost:16686.
  # To use it, also uncomment `YAGRA_OTEL_ENDPOINT: http://jaeger:4318` on core AND poller above.
  # Swap for an otel-collector → your backend (Tempo, Honeycomb, …) in a real deployment.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP/HTTP receiver (what YAGRA_OTEL_ENDPOINT points at)
    restart: unless-stopped

volumes:
  pgdata:
  vmdata:
  vldata:
  chdata:      # ClickHouse flow store (ADR-031)
  pollerbuf:   # store-and-forward result buffer (Phase 3)
