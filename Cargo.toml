# Yagra — Cargo workspace root.
# This is the canonical version source-of-truth for the Rust side
# (see `### Version Files` in CLAUDE.md). `web/package.json` mirrors it for the frontend.
#
# Crate names are the functional `Yagra-*` names (world-view codenames fully retired):
#   crates/yagra-core      = Core/API                       [bin: yagra-core]
#   crates/yagra-poller    = Poller worker                  [bin: yagra-poller]
#   crates/yagra-discovery = Discovery & classification      [lib]
#   crates/yagra-alert     = Alert engine                    [lib]
#   crates/yagra-ingest    = Passive-event parsing (syslog/trap) [lib]
#   crates/yagra-bus       = Task queue / bus                [lib]
#   crates/yagra-transport = ICMP/SNMP/HTTP abstraction      [lib]
#   crates/yagra-topology  = Topology & dependency graph     [lib]
#   crates/yagra-common    = shared types/models             [lib]
#   crates/yagra-secrets   = secret/credential crypto        [lib]
# Yagra-web (WebUI) lives under `web/` (React+TS), not a Rust crate.

[workspace]
resolver = "2"
members = [
    "crates/yagra-common",
    "crates/yagra-hoststats",
    "crates/yagra-telemetry",
    "crates/yagra-secrets",
    "crates/yagra-transport",
    "crates/yagra-bus",
    "crates/yagra-topology",
    "crates/yagra-discovery",
    "crates/yagra-alert",
    "crates/yagra-ingest",
    "crates/yagra-poller",
    "crates/yagra-core",
]

[workspace.package]
version = "0.1.10"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["horryworks <horryworks@gmail.com>"]
repository = "https://github.com/horryworks/Yagra"

# Shared dependency versions. Crates opt in with `foo = { workspace = true }`.
# Declared here as the recommended stack (see CLAUDE.md "Tech Stack"); unused
# entries are harmless — they are only pulled when a member references them.
[workspace.dependencies]
# Async runtime / web
tokio = { version = "1", features = ["full"] }
# Runtime utilities — CancellationToken for coordinated graceful shutdown (ADR-017 rolling upgrade).
tokio-util = "0.7"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
# DB / storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "uuid", "json", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp"] }
# HTTP client. VictoriaMetrics import/query is in-cluster plaintext; URL monitoring
# (yagra-transport) needs TLS, so rustls is enabled (no native-tls/NASM). `tls_info` exposes
# the peer certificate so the URL probe can read the cert's notAfter for expiry.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# X.509 parsing for TLS-certificate expiry (URL monitoring) — pure Rust, no NASM.
x509-parser = "0.16"
# Message bus (core⇄poller over NATS, ADR-007)
async-nats = "0.49"
# Raw-socket ICMP for the poller (needs CAP_NET_RAW at runtime, ADR build-prereqs)
surge-ping = "0.8"
# SNMP v2c (pure-Rust async; ADR-021 PoC — validate before any net-snmp FFI fallback)
csnmp = "0.5"
# SNMP v3 / USM (pure-Rust crypto + tokio async; resolves the ADR-021 v3 question)
snmp2 = { version = "0.5", default-features = false, features = ["v3", "crypto-rust", "tokio"] }
# Async stream combinators (bus consumers)
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
# Polling jitter (anti-stampede, monitoring-conventions)
rand = "0.8"
# Machine hostname for poller identity default (ADR-009) — tiny, cross-platform, no unsafe of ours.
hostname = "0.4"
# Low-level socket options for the parallel edge UDP listeners (S9): SO_REUSEPORT so the kernel
# load-balances datagrams across N independent receive queues, and an enlarged SO_RCVBUF to absorb
# bursts. The Unix-only options are cfg-gated; the non-unix dev box falls back to a single socket.
# `set_reuse_port` lives behind socket2's `all` feature, so it must be enabled for the Linux build.
socket2 = { version = "0.5", features = ["all"] }
# Host self-metrics (self-observability): CPU/load/memory of the core & poller hosts. Cross-platform
# so `cargo run` still works on the Windows dev box. Only yagra-hoststats (pulled by core + poller)
# depends on it, keeping the heavy collector out of the shared/bus/alert crates.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# statvfs(2) for exact per-path filesystem capacity on the Linux container target (yagra-hoststats,
# unix-only) — reliable for bind-mounted data volumes where sysinfo's disk listing is flaky.
libc = "0.2"
# Email notifications (SMTP, async/rustls — no native TLS, no NASM)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# Serialization / types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Device-classification rules (sysDescr matching) — linear-time engine, no catastrophic
# backtracking, so operator-supplied patterns can't ReDoS the classifier (security.md).
regex = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Errors
thiserror = "2"
anyhow = "1"
# Async trait objects (bus/transport abstractions)
async-trait = "0.1"
# Observability (self-monitoring: structured logs + tracing + Prometheus)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry distributed tracing (yagra-telemetry). The OTLP exporter goes over
# HTTP/protobuf via the in-tree reqwest+rustls stack (no tonic/gRPC, no native-TLS/NASM);
# `rt-tokio` runs the batch span processor on the shared runtime. Version-locked triple:
# opentelemetry 0.27 ↔ opentelemetry_sdk 0.27 ↔ opentelemetry-otlp 0.27 ↔ tracing-opentelemetry 0.28.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
tracing-opentelemetry = "0.28"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
# Crypto (envelope encryption of monitoring credentials — pure Rust, no NASM)
aes-gcm = "0.10"
# Webhook ingest-token hashing (already in the tree via the crypto stack)
sha2 = "0.10"
# Password hashing for local auth (Argon2, pure Rust)
argon2 = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Local vendored patch: snmp2 0.5.0's crypto-rust path fails to compile (E0034,
# ambiguous `update`) when any crate in the graph enables `hmac/reset` — sqlx-postgres
# does. See vendor/snmp2/PATCH_NOTE.md; drop once upstream fixes it.
[patch.crates-io]
snmp2 = { path = "vendor/snmp2" }
