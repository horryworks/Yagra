# Yagra — Cargo workspace root.
# This is the canonical version source-of-truth for the Rust side
# (see `### Version Files` in CLAUDE.md). `web/package.json` mirrors it for the frontend.
#
# Crate names are the functional `Yagra-*` names (world-view codenames fully retired):
#   crates/yagra-core      = Core/API                       [bin: yagra-core]
#   crates/yagra-poller    = Poller worker                  [bin: yagra-poller]
#   crates/yagra-discovery = Discovery & classification      [lib]
#   crates/yagra-alert     = Alert engine                    [lib]
#   crates/yagra-ingest    = Passive-event parsing (syslog/trap) [lib]
#   crates/yagra-forward   = Forwarding filters + renderers  [lib]
#   crates/yagra-bus       = Task queue / bus                [lib]
#   crates/yagra-transport = ICMP/SNMP/HTTP abstraction      [lib]
#   crates/yagra-topology  = Topology & dependency graph     [lib]
#   crates/yagra-common    = shared types/models             [lib]
#   crates/yagra-secrets   = secret/credential crypto        [lib]
# Yagra-web (WebUI) lives under `web/` (React+TS), not a Rust crate.

[workspace]
resolver = "2"
members = [
    "crates/yagra-common",
    "crates/yagra-hoststats",
    "crates/yagra-telemetry",
    "crates/yagra-secrets",
    "crates/yagra-transport",
    "crates/yagra-bus",
    "crates/yagra-authz",
    "crates/yagra-topology",
    "crates/yagra-discovery",
    "crates/yagra-alert",
    "crates/yagra-ingest",
    "crates/yagra-forward",
    "crates/yagra-poller",
    "crates/yagra-core",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
# No e-mail address here, deliberately. utoipa derives the OpenAPI document's
# `info.contact` from CARGO_PKG_AUTHORS, so an address in this field is published
# to every API client — and from there to the public API reference on the website.
# Contact goes through GitHub Issues; see SECURITY.md for vulnerability reports.
authors = ["horryworks"]
repository = "https://github.com/horryworks/Yagra"

# Shared dependency versions. Crates opt in with `foo = { workspace = true }`.
# Declared here as the recommended stack (see CLAUDE.md "Tech Stack"); unused
# entries are harmless — they are only pulled when a member references them.
[workspace.dependencies]
# Async runtime / web
tokio = { version = "1", features = ["full"] }
# Runtime utilities — CancellationToken for coordinated graceful shutdown (ADR-017 rolling upgrade).
tokio-util = "0.7"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
# DB / storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "uuid", "json", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp"] }
# HTTP client. VictoriaMetrics import/query is in-cluster plaintext; URL monitoring
# (yagra-transport) needs TLS, so rustls is enabled (no native-tls/NASM). `tls_info` exposes
# the peer certificate so the URL probe can read the cert's notAfter for expiry.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# X.509 parsing for TLS-certificate expiry (URL monitoring) — pure Rust, no NASM.
x509-parser = "0.16"
# Message bus (core⇄poller over NATS, ADR-007)
async-nats = "0.49"
# Raw-socket ICMP for the poller (needs CAP_NET_RAW at runtime, ADR build-prereqs)
surge-ping = "0.8"
# SNMP v2c (pure-Rust async; ADR-021 PoC — validate before any net-snmp FFI fallback)
csnmp = "0.5"
# SNMP v3 / USM (pure-Rust crypto + tokio async; resolves the ADR-021 v3 question)
snmp2 = { version = "0.5", default-features = false, features = ["v3", "crypto-rust", "tokio"] }
# DNS stub resolver for DNS name-resolution monitoring (ADR-033). Pure Rust, tokio-native, no
# FFI/NASM. `system-config` reads /etc/resolv.conf when a check names no explicit resolver;
# DNSSEC/TLS/QUIC features are deliberately left off so neither `ring` nor `aws-lc-rs` is pulled in.
# The probe sets `preserve_intermediates` so the CNAME chain survives in the answer, and
# `cache_size = 0` so we measure DNS rather than our own cache.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# Async stream combinators (bus consumers)
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
# Polling jitter (anti-stampede, monitoring-conventions)
rand = "0.8"
# Machine hostname for poller identity default (ADR-009) — tiny, cross-platform, no unsafe of ours.
hostname = "0.4"
# Semantic-version comparison for the upgrade compatibility window (ADR-050 decision 7). Hand-rolled
# comparison is exactly wrong at the edges a monitoring system reaches eventually — a text compare
# orders 0.2.10 before 0.2.9 — and this is the value that decides whether the UI offers a rollback.
semver = "1"
# Low-level socket options for the parallel edge UDP listeners (S9): SO_REUSEPORT so the kernel
# load-balances datagrams across N independent receive queues, and an enlarged SO_RCVBUF to absorb
# bursts. The Unix-only options are cfg-gated; the non-unix dev box falls back to a single socket.
# `set_reuse_port` lives behind socket2's `all` feature, so it must be enabled for the Linux build.
socket2 = { version = "0.5", features = ["all"] }
# The poller's own interface addresses, reported in its heartbeat so core can root the derived
# dependency graph at the poller's segment (ADR-043). A `UdpSocket::connect` probe would name only
# the interface facing the bus, which on a multi-homed remote poller is the WAN side rather than the
# monitored one. Tiny, no transitive dependencies beyond the platform's own bindings.
if-addrs = "0.13"
# Host self-metrics (self-observability): CPU/load/memory of the core & poller hosts. Cross-platform
# so `cargo run` still works on the Windows dev box. Only yagra-hoststats (pulled by core + poller)
# depends on it, keeping the heavy collector out of the shared/bus/alert crates.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# statvfs(2) for exact per-path filesystem capacity on the Linux container target (yagra-hoststats,
# unix-only) — reliable for bind-mounted data volumes where sysinfo's disk listing is flaky.
libc = "0.2"
# Email notifications (SMTP, async/rustls — no native TLS, no NASM)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# Syslog over TLS for forwarding (RFC 5425, ADR-034 Increment 2). rustls is already in the tree via
# reqwest/sqlx/lettre; these entries name it directly so the forwarder can build its own ClientConfig
# (per-destination trust anchors). `ring` is pinned as the crypto provider **explicitly at the call
# site**: both `ring` and `aws_lc_rs` end up enabled through the dependency graph, and with both on
# rustls refuses to pick a process default — `ClientConfig::builder()` would panic at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# System trust anchors for TLS destinations (the container's CA bundle).
rustls-native-certs = "0.8"
# NB PEM → DER (operator-supplied CA certificate, Google service-account private key) used to go
# through `rustls-pemfile`, dropped for RUSTSEC-2025-0134 (crate unmaintained, repo archived Aug
# 2025). Its final release was already a thin wrapper over the same parser that ships inside
# rustls-pki-types, so the call sites now use `rustls::pki_types::pem::PemObject` directly — same
# code, one fewer unmaintained hop, and no new dependency (rustls re-exports `pki_types`).
# RS256 signing of the Google service-account assertion for BigQuery forwarding destinations
# (ADR-034 Increment 3). Deliberately `ring` and not the `rsa` crate: ring is already in this tree as
# the rustls crypto provider (so this adds no build cost), its RSA signing is constant-time, and it
# sidesteps RUSTSEC-2023-0071 — the advisory deny.toml ignores precisely because Yagra performs no
# RSA private-key operations. `jsonwebtoken` is not used either; the assertion is 40 lines of JSON
# plus one signature, and the crate would add a dependency for it.
ring = "0.17"
# Self-signed certificate generation for the WebUI's TLS edge (ADR-044). Core mints one on first
# start so a fresh deployment is HTTPS without anyone doing anything, renews it before it expires,
# and regenerates it on demand when an operator gives it the right hostnames.
#
# `default-features = false` with `ring` named explicitly is load-bearing, not tidiness: rcgen's
# default feature set can select `aws_lc_rs`, and this workspace goes out of its way in half a dozen
# places to keep the crypto provider on `ring` (see the rustls note above — with both enabled rustls
# installs no process default and panics). Verified with `cargo tree -e features` when this landed.
#
# Only *generation* is here. Parsing and validating an operator's imported certificate goes through
# x509-parser and rustls, which are already in the tree — rcgen is never asked to read anything.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# Serialization / types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Device-classification rules (sysDescr matching) — linear-time engine, no catastrophic
# backtracking, so operator-supplied patterns can't ReDoS the classifier (security.md).
regex = "1"
# Notification templates (ADR-039): the operator's subject/body override, rendered per channel.
# Jinja2-compatible, pure Rust, and sandboxed by construction — an `Environment` reaches nothing
# but the values handed to it. Chosen over a `{{field}}` substitution of our own because operators
# reliably want "this wording only when critical", and retrofitting conditionals means replacing
# the substituter rather than extending it. Tera/Handlebars would also do; minijinja is the
# lighter dependency.
#
# The feature list is the security boundary, so it is spelled out rather than defaulted:
#   builtins        the standard filter/test set — without it a template can barely format anything
#   serde + json    pass the context in as a struct; `tojson` is what makes a JSON body safe to
#                   build by hand (a node name containing a quote must not break the payload)
#   fuel            a hard cap on execution steps. Templates are operator-authored *executable
#                   text*, and the render happens on a synchronous call inside the notify worker,
#                   where a wall-clock timeout is not expressible. This is the loop bound.
#   debug           the template line/context in the error — the preview endpoint's whole job
# Deliberately OFF: `loader`/`multi_template` (no `{% include %}`/`{% extends %}` exists to reach
# for, so a template cannot name another file), `macros`, `deserialization`, `speedups`
# (pulls v_htmlescape), `stacker`.
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "json", "fuel", "debug", "std_collections"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Support bundle (ADR-045): one downloadable archive of logs + status for a deployment nobody can
# reach a shell on. `tar` + `flate2` rather than `zip` because both are pure Rust with no C
# toolchain in the way (flate2 defaults to the miniz_oxide backend), and because the archive holds
# nothing but text — a reviewer has to be able to read every byte before it leaves the site.
tar = "0.4"
flate2 = "1"
# Errors
thiserror = "2"
anyhow = "1"
# Async trait objects (bus/transport abstractions)
async-trait = "0.1"
# Observability (self-monitoring: structured logs + tracing + Prometheus)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Rolling on-disk log files (`YAGRA_LOG_DIR`, ADR-045). Without it a container's own logs live only
# in `docker logs`, which needs a shell on the host — the one thing a locked-down production
# deployment tends not to grant. The support bundle reads these files back, so a panic from the run
# *before* the current one still reaches a bundle taken after recovery.
tracing-appender = "0.2"
# OpenTelemetry distributed tracing (yagra-telemetry). The OTLP exporter goes over
# HTTP/protobuf via the in-tree reqwest+rustls stack (no tonic/gRPC, no native-TLS/NASM);
# `rt-tokio` runs the batch span processor on the shared runtime. Version-locked triple:
# opentelemetry 0.27 ↔ opentelemetry_sdk 0.27 ↔ opentelemetry-otlp 0.27 ↔ tracing-opentelemetry 0.28.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
tracing-opentelemetry = "0.28"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
# Crypto (envelope encryption of monitoring credentials — pure Rust, no NASM)
aes-gcm = "0.10"
# Webhook ingest-token hashing (already in the tree via the crypto stack)
sha2 = "0.10"
# HMAC-SHA256 for stateless signed session tokens (Core HA active/active, ADR-016 Increment 2a).
# Already in the tree transitively (sqlx-postgres enables it); promoted to a direct workspace dep.
# `Mac::verify_slice` is constant-time. Pure Rust, no NASM.
hmac = "0.12"
# Password hashing for local auth (Argon2, pure Rust)
argon2 = "0.5"
# NATS Auth Callout (ADR-030): ed25519 nkey signing so core can mint per-poller-scoped NATS user JWTs
# (poller-scoped credentials). Already in the tree transitively via async-nats; promoted to a direct
# workspace dep for yagra-authz. Pure Rust (ed25519-dalek), no NASM.
nkeys = "0.4"
# RFC 4648 base64url / base32 for the NATS JWT wire format (yagra-authz). Already transitively present.
data-encoding = "2"
# External IdP login (OIDC authorization-code + PKCE, ADR-010 Phase 3). Handles discovery, PKCE,
# code exchange, and ID-token signature/claim validation per spec. TLS rides the in-tree reqwest
# (rustls) — `default-features = false` + explicit `rustls-tls` keeps native-tls/openssl/NASM out.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
# LDAP/AD login (two-stage bind: service search, then re-bind as the found DN — ADR-041). Pure Rust,
# async, no NASM. `tls-rustls-ring` is the load-bearing choice: ldap3's `tls`/`tls-native` default is
# native-tls (OpenSSL), and its rustls path *requires* a crypto provider be named — picking `ring`
# matches the provider this workspace already pins everywhere else, so no second provider enters the
# graph and `ClientConfig::builder()` keeps working. `sync` is off: the blocking wrapper spins its own
# runtime and nothing here needs it. There is no plaintext transport in our config, and
# `LdapConnSettings::set_no_tls_verify` is never called (ADR-041 decision 2, the ADR-034 discipline) —
# a source-reading test pins that.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# MCP server (ADR-028 Phase 4, inward-facing AI tool surface). Official Rust SDK: the `server` +
# `macros` features give the `#[tool]`/`#[tool_router]`/`#[tool_handler]` declarative tool layer, and
# `transport-streamable-http-server` gives a `StreamableHttpService` that mounts into the existing
# axum `serve()` as a tower Service (rmcp's runtime is hyper1/http1/tower-service-0.3 — the same
# stack axum 0.7 links, so there is no axum-version coupling; axum is dev-only upstream). stdio
# transport is deferred (Docker deployment makes HTTP the practical transport). Pure Rust, no NASM.
rmcp = { version = "2.2", features = ["server", "macros", "transport-streamable-http-server"] }
# rmcp pulls schemars 1.x itself; this direct entry only enables the `uuid1` feature on that same
# single copy so MCP tool-param structs can derive `JsonSchema` for their `Uuid` fields (node ids).
# Features unify across the one schemars version — no second copy. Code uses `rmcp::schemars`.
schemars = { version = "1", features = ["uuid1", "chrono04"] }
# OpenAPI generation for the northbound REST surface (ADR-035). The generated document is the
# **source of truth** for the WebUI's types and client — `web/src/api/schema.d.ts` is generated from
# it, so a Rust DTO change propagates instead of being transcribed by hand.
#
# Derive-only, deliberately: the companion `utoipa-axum` crate (which pairs `.route()` with the
# `#[utoipa::path]` attribute in one call) is built against **axum 0.8** and pulls a second axum into
# the tree. Upgrading the web framework is a separate decision, so routes stay registered with plain
# axum 0.7 and `api/route_table.rs` is what pins the router and the document to each other.
#
# `axum_extras` teaches the `#[utoipa::path]` macro to read `Path`/`Query` extractors; `chrono` and
# `uuid` map those types to their JSON Schema `format`s instead of an opaque string.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
# Global allocator for the two long-running binaries (`#[global_allocator]` in each `main.rs`,
# behind a default-on `mimalloc` feature so there is still a way back).
#
# **It was A/B'd on the test server before being adopted — 2026-08-05, 50k synthetic nodes, two
# 20-minute windows on identical `release` builds differing only in this dependency:**
#
#   | | glibc malloc | mimalloc |
#   |---|---|---|
#   | core RSS, mean               | 396.6 MiB | **183.4 MiB** |
#   | core RSS, growth over window | **+162.2 MiB** | **+6.4 MiB** |
#   | poller RSS, growth           | +17.7 MiB | −0.4 MiB |
#   | core CPU, mean               | 12.45% | 11.81% |
#   | poll results ingested        | 63.64/s | 63.67/s |
#
# The throughput row is the control: both arms did the same work, so the memory column is not one
# arm simply running slower. glibc's per-thread arenas grow under this allocation pattern (short
# buffers churned across dozens of Tokio workers) and are not returned, which is what the +162 MiB
# is — core's footprint was climbing for as long as it was measured. That is the difference between
# a process you can size and one you cannot.
#
# `default-features = false` drops mimalloc's secure-mode/stats extras; we want the allocator, not
# its diagnostics. It builds its C sources with `cc`, which the bookworm rust image already has.
mimalloc = { version = "0.1", default-features = false }

# The profile `/release` publishes to GHCR. Optimize for the running binary, not the build: a
# release is cut a few times a month and then serves tens of thousands of nodes for weeks.
#
# The size/speed trade is narrower than "smaller is slower" suggests, but it is **not** absent —
# measured, not assumed (see the `lto` note below, where fat LTO cost core 1.1 MiB). `strip` is free
# on both axes. The settings that clearly trade are `opt-level = "s"/"z"` (rejected — throughput
# matters at 50k nodes) and `panic = "abort"`.
#
# ⚠️ **`panic = "abort"` is deliberately NOT set**, even though it would shrink the binary ~10% and
# skip landing-pad codegen. Under `unwind`, a panicking Tokio task dies alone and the runtime logs
# it; under `abort` it takes the whole process with it. One malformed SNMP PDU or one bad slice
# index in a report renderer would stop monitoring for the entire fleet. That is the wrong failure
# mode for an NMS regardless of what it saves.
#
# `lto = "fat"` — measured before adopting, because the risk was memory, not time. fat LTO at
# `codegen-units = 1` optimizes across crate boundaries (where a workspace of 14 crates has the most
# left on the table), but the link step is one process holding the whole program.
#
# **Measured 2026-08-05 on the build host (16 cores / 14 GB RAM), building the release images:**
#   peak single process   4.28 GB (rustc, linking yagra-core) — the ceiling was 70% of RAM, so it fits
#   peak system in use    5.83 GB of 14 GB
#   core image build      593 s cold  (thin LTO was 3.5–6.5 min)
#   binary, gzipped       core 11.9 → 13 MiB, poller 5.1 → 4.7 MiB
#
# ⚠️ **fat LTO made core's binary BIGGER, not smaller** — the opposite of the usual claim, and the
# reason these numbers are written down. On top of `codegen-units = 1` there is no cross-unit
# duplication left to collapse, so what fat LTO adds is cross-*crate* inlining, and inlining
# duplicates code. Poller went the other way. Do not repeat "LTO shrinks the binary" about this
# workspace; it was checked and it is not true here.
#
# ⚠️ **The runtime benefit is assumed, not measured.** What was measured is the cost: +1.1 MiB on
# core's per-release download and roughly double the build time. Keeping it is a judgement — the
# mechanism is well understood, the cost is small and bounded next to core's 66 MiB wkhtmltopdf
# layer, and a release is cut a few times a month. If someone wants the benefit measured, the rig is
# the 50k-node scale harness (`crates/yagra-core/examples/seed_nodes.rs`), and "thin" is a fallback
# that costs nothing to go back to.
#
# Only the *release* profile pays any of this. `ci-fast` below sets `lto = false`, so `/flashdeploy`
# and PR validation are untouched.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Fast-compile profile for development builds — what the test server runs between releases.
# Inherits `release` but trades runtime optimization for a much faster compile: `codegen-units = 1`
# + LTO is the single biggest cost in an image build (the core release build was 3.5–6.5 min under
# thin LTO and is 593 s cold since it went fat — see the note above `[profile.release]`).
# Splitting codegen back into 256 units and dropping LTO lets rustc parallelize across cores again,
# and `opt-level = 1` skips the expensive optimization passes while keeping the binary far faster
# than a debug build.
#
# Wiring (docker/yagra-rust.Dockerfile `ARG CARGO_PROFILE`): `ci-fast` is used by `/flashdeploy`
# (via scripts/flash-build.sh, which compiles the binaries and hands them to the image build) and by
# CI's PR validation builds. `--profile release` is used only on a `v*` tag, i.e. by the images
# `/release` publishes to GHCR. So iteration stays fast and shipped releases stay fully optimized.
# Local `cargo build --release` is unchanged.
#
# Which one a running container was built with is readable at `/etc/yagra-build-profile`.
#
# `incremental` is ON here and OFF in `release`, which is the reverse of cargo's own defaults for a
# release-shaped profile — deliberately. Incremental state is per-target-directory and worthless
# unless that directory survives between builds; `release` is built in-image against a BuildKit
# cache mount that CI shares with everything else, while `ci-fast` is built by flash-build.sh
# against a dedicated named volume that persists across runs and belongs to one caller. The flash
# loop is "change one line, ship it", where the whole cost is re-codegening yagra-core (94k lines,
# 256 codegen units) — exactly what incremental reuse is for. It costs disk in that volume and a
# little runtime performance, both of which are the right trade for a test-server binary.
[profile.ci-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true

# Local vendored patch: snmp2 0.5.0's crypto-rust path fails to compile (E0034,
# ambiguous `update`) when any crate in the graph enables `hmac/reset` — sqlx-postgres
# does. See vendor/snmp2/PATCH_NOTE.md; drop once upstream fixes it.
[patch.crates-io]
snmp2 = { path = "vendor/snmp2" }
