# Grype configuration for the weekly image scan (.github/workflows/security-audit.yml, ADR-215).
#
# Every ignore names the package AND its version, so the same CVE turning up anywhere else — or in
# a later version of the same image — still fails the run. Each carries why it is waited on and
# when it can go, the rule deny.toml follows.
ignore:
  # CVE-2026-111497 (Brotli decompression heap overflow) in the bundled oxidized/oxidized:0.37.0.
  # Upstream has published no image with the fixed libbrotli1; the only thing inside that decodes
  # Brotli is the hook's curl, and its one peer is core. Decided 2026-10-24/25 (ADR-211 decision 5,
  # exception 1): wait for an upstream release. Remove when the pinned oxidized image moves past it.
  - vulnerability: CVE-2026-111497
    package:
      name: libbrotli1
      version: 1.1.0-2+b7

  # ── oxidized/oxidized:0.37.0, everything Yagra cannot reach (ADR-215 increment 2, decision 5) ──
  # Generated 2026-10-27 from the first weekly scan, one rule per (vulnerability, package, version),
  # each package with why it is out of reach — checked against OSV's text and against what the
  # running container loads. Upstream has no newer image (0.37.0, 2026-05-20). Remove this whole
  # block when the pinned oxidized image moves: the versions stop matching on their own, and any
  # finding they no longer cover turns the scan red again, which is the point.
  # NOT here on purpose: libtasn1-6 (CVE-2025-13151). GnuTLS parses the Git host's certificate with
  # it, and whether a TLS handshake reaches asn1_expand_octet_string could not be settled, so it
  # stays red until the image moves.
  # bsdutils 1:2.41-5: not loaded by the running oxidized process nor linked by git-remote-https (/proc/<pid>/maps and ldd, 2026-10-27)
  - vulnerability: CVE-2026-53612
    package:
      name: bsdutils
      version: 1:2.41-5
  - vulnerability: CVE-2026-53613
    package:
      name: bsdutils
      version: 1:2.41-5
  - vulnerability: CVE-2026-53614
    package:
      name: bsdutils
      version: 1:2.41-5
  - vulnerability: CVE-2026-53615
    package:
      name: bsdutils
      version: 1:2.41-5
