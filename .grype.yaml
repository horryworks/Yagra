# Grype configuration for the weekly image scan (.github/workflows/security-audit.yml, ADR-215).
#
# Every ignore names the package AND its version, so the same CVE turning up anywhere else — or in
# a later version of the same image — still fails the run. Each carries why it is waited on and
# when it can go, the rule deny.toml follows.
#
# ── The 2026-11-23 scan, everything Yagra cannot reach (ADR-215 increment 3) ──
# Generated 2026-11-24 from that run, one rule per (vulnerability, package, version), each package
# with why it is out of reach — checked against each advisory's text and against what the running
# containers load on a lab deployment (ldd and /proc/<pid>/maps). Upstream had no fixed image for
# any of the seven except VictoriaMetrics v1.157.0, one day old. Nothing needs removing by hand:
# when a pinned image moves or a floating tag (postgres, redis, nats) is rebuilt, the versions stop
# matching, and any finding they no longer cover turns the scan red again, which is the point.
# ⚠️ A rule matches the package and version in ANY image, so a new image carrying libssl3 3.5.9-r0
# (for one) is not scanned for these five. Judge the rule again before adding such an image.
ignore:
  # libcrypto3 3.5.9-r0 (alpine:3.24.4, docker:29.10.0-cli, postgres:17-alpine, victoriametrics/victoria-metrics:v1.156.0): the five are OpenSSL's QUIC (88822, 95691), AES-GCM-SIV (88823, 95692) and CMS encryption to an EC recipient (107496); the advisory says TLS does not reach them. postgres runs with ssl=off, wget/ssl_client and curl speak HTTPS over TCP, and the VictoriaMetrics and nats binaries are static Go that never load it (ldd, 2026-11-24). Nothing uses QUIC, GCM-SIV or CMS
  - vulnerability: CVE-2026-107496
    package:
      name: libcrypto3
      version: 3.5.9-r0
  - vulnerability: CVE-2026-88822
    package:
      name: libcrypto3
      version: 3.5.9-r0
  - vulnerability: CVE-2026-88823
    package:
      name: libcrypto3
      version: 3.5.9-r0
  - vulnerability: CVE-2026-95691
    package:
      name: libcrypto3
      version: 3.5.9-r0
  - vulnerability: CVE-2026-95692
    package:
      name: libcrypto3
      version: 3.5.9-r0
  # libssl3 3.5.9-r0 (alpine:3.24.4, docker:29.10.0-cli, postgres:17-alpine, victoriametrics/victoria-metrics:v1.156.0): same five findings as libcrypto3 above
  - vulnerability: CVE-2026-107496
    package:
      name: libssl3
      version: 3.5.9-r0
  - vulnerability: CVE-2026-88822
    package:
      name: libssl3
      version: 3.5.9-r0
  - vulnerability: CVE-2026-88823
    package:
      name: libssl3
      version: 3.5.9-r0
  - vulnerability: CVE-2026-95691
    package:
      name: libssl3
      version: 3.5.9-r0
  - vulnerability: CVE-2026-95692
    package:
      name: libssl3
      version: 3.5.9-r0
  # zlib 1.3.2-r1 (alpine:3.24.4, docker:29.10.0-cli, nats:2-alpine, redis:7-alpine, victoriametrics/victoria-metrics:v1.156.0): CVE-2026-4738 is GDAL's copy of zlib contrib/infback9, which Alpine maps onto zlib; this libz.so has no inflateBack9 symbol (checked 2026-11-24)
  - vulnerability: CVE-2026-4738
    package:
      name: zlib
