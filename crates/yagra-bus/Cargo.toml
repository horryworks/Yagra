[package]
name = "yagra-bus"
description = "Yagra-bus — task queue / message bus client for core⇄poller distribution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
yagra-common = { path = "../yagra-common" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# Live NATS bus adapter (ADR-007). Gated so unit tests / lib-only consumers don't
# pull the TLS stack; the binaries (yagra-core/yagra-poller) enable it.
async-nats = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
nats = ["dep:async-nats", "dep:futures"]

[dev-dependencies]
serde_json = { workspace = true }
