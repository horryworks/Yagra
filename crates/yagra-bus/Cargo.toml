[package]
name = "yagra-bus"
description = "Yagra-bus — task queue / message bus client for core⇄poller distribution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
yagra-common = { path = "../yagra-common" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
# RFC 4648 base64 for the raw passive-event payload carried in `EventMsg.raw` (ADR-034).
# JSON has no byte-string type and `Vec<u8>` serializes as an array of numbers (~3-4× the
# bytes), so the wire form is base64 and the encode/decode contract lives in this crate.
data-encoding = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# `EventKind` is stored and served on the event log's read surface, so it carries its own JSON
# Schema for the OpenAPI document (ADR-035) — same reason yagra-forward has this. Derive-only.
utoipa = { workspace = true }
# Live NATS bus adapter (ADR-007). Gated so unit tests / lib-only consumers don't
# pull the TLS stack; the binaries (yagra-core/yagra-poller) enable it.
async-nats = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
nats = ["dep:async-nats", "dep:futures"]

[dev-dependencies]
serde_json = { workspace = true }
