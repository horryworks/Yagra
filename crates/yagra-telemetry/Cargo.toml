[package]
name = "yagra-telemetry"
description = "Yagra-telemetry — process-wide structured logging + OpenTelemetry trace export (self-observability)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Rolling on-disk log files, so the support bundle can carry a previous run's panic (ADR-045).
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
# Process-lifecycle: SIGTERM/Ctrl-C handling + CancellationToken for coordinated graceful shutdown.
tokio = { workspace = true }
tokio-util = { workspace = true }
