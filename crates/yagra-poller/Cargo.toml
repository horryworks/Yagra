[package]
name = "yagra-poller"
description = "Yagra-poller — stateless poller worker (ICMP/SNMP/API polling)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "yagra-poller"
path = "src/main.rs"

[dependencies]
yagra-common = { path = "../yagra-common" }
yagra-transport = { path = "../yagra-transport" }
yagra-bus = { path = "../yagra-bus", features = ["nats"] }
yagra-discovery = { path = "../yagra-discovery" }
yagra-ingest = { path = "../yagra-ingest" }
yagra-telemetry = { path = "../yagra-telemetry" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
uuid = { workspace = true }
# Local scheduler stream + working-set jitter + hostname identity default (ADR-009/020).
tokio-stream = { workspace = true }
rand = { workspace = true }
hostname = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# Trap PDU fixtures for the listener tests (vendored patch build).
snmp2 = { workspace = true }
