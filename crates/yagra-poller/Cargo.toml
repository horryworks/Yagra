[package]
name = "yagra-poller"
description = "Yagra-poller — stateless poller worker (ICMP/SNMP/API polling)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "yagra-poller"
path = "src/main.rs"

[dependencies]
yagra-common = { path = "../yagra-common" }
yagra-transport = { path = "../yagra-transport" }
yagra-bus = { path = "../yagra-bus", features = ["nats"] }
yagra-discovery = { path = "../yagra-discovery" }
yagra-ingest = { path = "../yagra-ingest" }
yagra-telemetry = { path = "../yagra-telemetry" }
yagra-hoststats = { path = "../yagra-hoststats" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
uuid = { workspace = true }
# NDJSON encode/decode for the store-and-forward disk spill (Phase 3).
serde_json = { workspace = true }
# Local scheduler stream + working-set jitter + hostname identity default (ADR-009/020).
tokio-stream = { workspace = true }
rand = { workspace = true }
hostname = { workspace = true }
# SO_REUSEPORT + SO_RCVBUF for the parallel edge UDP listeners (S9).
socket2 = { workspace = true }
# Own interface addresses for the heartbeat's `mgmt_addrs` (ADR-043 anchor resolution).
if-addrs = { workspace = true }
# Optional global allocator — see the workspace Cargo.toml entry for why this is a feature and not
# a dependency, and for the condition under which it stops being optional.
mimalloc = { workspace = true, optional = true }

[features]
# ON by default — the poller's resident set went from creeping upward to flat under the same load.
# The measurement is in the workspace Cargo.toml. It stays a feature rather than becoming
# unconditional so `--no-default-features` remains a one-flag way back to the system allocator.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
# `FakeTransport` for the worker tests. A dev-dependency on purpose: under resolver v2 the feature
# is not unified into a normal `cargo build`, so the shipped poller binary still links a
# `yagra-transport` with no test double in it.
yagra-transport = { path = "../yagra-transport", features = ["test-util"] }
async-trait = { workspace = true }
# Trap PDU fixtures for the listener tests (vendored patch build).
snmp2 = { workspace = true }
