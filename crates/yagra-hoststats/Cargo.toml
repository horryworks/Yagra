[package]
name = "yagra-hoststats"
description = "Yagra-hoststats — host self-metrics collector (CPU/load/memory/disk/network) for self-observability."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
yagra-common = { path = "../yagra-common" }
sysinfo = { workspace = true }

# Both are used only by the unix filesystem read (`statvfs_usage`); listed here so a build for
# another target does not report `tracing` as an unused dependency.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
tracing = { workspace = true }
