[package]
name = "yagra-alert"
description = "Yagra-alert — alert engine: state machine, hysteresis, dependency suppression."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
yagra-common = { path = "../yagra-common" }
serde = { workspace = true }
# `Alert` is returned by the northbound API, so it carries its own JSON Schema for the OpenAPI
# document (ADR-035) rather than being re-described in `yagra-core`. Derive-only.
utoipa = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
# `Subject` parses a node id back out of its flat string form (the wire/dedup representation).
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
