[package]
name = "yagra-transport"
description = "Yagra-transport — transport abstraction over ICMP / SNMP / HTTP device access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# `FakeTransport` — the canned, always-reachable test double. Off by default so it is not compiled
# into the shipped library; downstream crates enable it from **dev-dependencies** only, which
# resolver v2 keeps out of a normal (non-test) build of the dependent.
test-util = []

[dependencies]
yagra-common = { path = "../yagra-common" }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
surge-ping = { workspace = true }
csnmp = { workspace = true }
snmp2 = { workspace = true }
rand = { workspace = true }
# URL/HTTP(S) monitoring transport.
reqwest = { workspace = true }
x509-parser = { workspace = true }
# Cisco Meraki Dashboard API (JSON) transport.
serde_json = { workspace = true }
# DNS name-resolution monitoring transport (ADR-033).
hickory-resolver = { workspace = true }
