[package]
name = "yagra-common"
description = "Shared types and models across Yagra components."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The source-reading mechanism (`srcread`, ADR-091/099). Kept out of the shipped library the same
# way `yagra-transport`'s `test-util` keeps `FakeTransport` out: dependents enable it from
# **dev-dependencies** only, which resolver v2 does not unify into a normal build of the dependent.
test-util = []

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
# Runtime (not just derive): a URL monitor's JSON extraction rules resolve a path into a
# `serde_json::Value` (ADR-047 Inc.3). That logic lives beside its type here, next to
# `ExpectedStatus::matches` and `BodyMatch::satisfied_by`, rather than in the poller — it is a
# property of the rule, not of the polling loop. No new weight anywhere: every binary that depends
# on this crate already links serde_json.
serde_json = { workspace = true }
# Shared types cross the northbound API boundary (node state, severity, classification rules), so
# they carry their own JSON Schema for the OpenAPI document (ADR-035) rather than being re-described
# in `yagra-core`. Derive-only — nothing here knows about HTTP.
utoipa = { workspace = true }
