[package]
name = "yagra-core"
description = "Yagra-core — Core/API: orchestration, scheduling, northbound API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "yagra-core"
path = "src/main.rs"

[dependencies]
yagra-common = { path = "../yagra-common" }
yagra-bus = { path = "../yagra-bus", features = ["nats"] }
# Per-poller NATS credential scoping via Auth Callout (ADR-030): mints scoped user JWTs.
yagra-authz = { path = "../yagra-authz" }
yagra-topology = { path = "../yagra-topology" }
yagra-alert = { path = "../yagra-alert" }
yagra-discovery = { path = "../yagra-discovery" }
# Forwarding filters + wire renderers for the passive-data tee (ADR-034).
yagra-forward = { path = "../yagra-forward" }
# Flow-export parsing for the forwarder (ADR-034 Increment 2). A relayed NetFlow/IPFIX/sFlow
# datagram is filtered on its decoded records, so core needs the same parser the poller receives
# with — and the same bounded template cache. Reception itself still happens only on the poller.
yagra-ingest = { path = "../yagra-ingest" }
yagra-secrets = { path = "../yagra-secrets" }
yagra-transport = { path = "../yagra-transport" }
yagra-telemetry = { path = "../yagra-telemetry" }
yagra-hoststats = { path = "../yagra-hoststats" }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
# Compatibility-window arithmetic for the upgrade planner (ADR-050 decision 7).
semver = { workspace = true }
# Notification-template rendering (ADR-039). Core-only on purpose: the *variable set* is the
# contract and lives in `yagra-common`, but the engine stays here so it does not ride along into
# the poller image, which sends no notifications.
minijinja = { workspace = true }
sha2 = { workspace = true }
# Stateless signed session tokens for Core HA active/active (ADR-016 Increment 2a): HMAC-SHA256
# signing + base64url claim encoding. Both already in the tree; named directly for `token.rs`.
hmac = { workspace = true }
data-encoding = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# Support-bundle archive (ADR-045). Core-only: the poller produces no bundle — it reports counters
# over the bus and has no HTTP surface to download one from.
tar = { workspace = true }
flate2 = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tokio-stream = { workspace = true }
# Direct NATS client for the Auth Callout responder (`$SYS.REQ.USER.AUTH` request-reply, ADR-030).
# Already in the tree via yagra-bus's `nats` feature; named directly here for the client handle.
async-nats = { workspace = true }
lettre = { workspace = true }
openidconnect = { workspace = true }
# LDAP/AD login (ADR-041): `mod ldap`. Core-only — a poller never authenticates a person.
ldap3 = { workspace = true }
# MCP server (ADR-028 Phase 4): the inward-facing AI tool surface (`mod mcp`). Mounts a
# StreamableHttpService into the existing axum `serve()`; tools wrap the read seams on `ApiState`.
# The tool param schemas derive `JsonSchema` via rmcp's re-exported `schemars`; the direct `schemars`
# dep only turns on the `uuid1` feature (so `Uuid` fields derive a schema) — one schemars copy total.
rmcp = { workspace = true }
schemars = { workspace = true }
# OpenAPI document for the northbound REST surface (ADR-035). `api/openapi.rs` assembles it from the
# per-domain `#[derive(OpenApi)]` fragments; `web/src/api/schema.d.ts` is generated from the result,
# which is what removes the hand-transcribed TS mirror.
utoipa = { workspace = true }
# tokio-util (CancellationToken) for the MCP service config — already in the tree; named directly.
tokio-util = { workspace = true }
# Syslog-over-TLS forwarding destinations (RFC 5425, ADR-034 Increment 2).
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
# BigQuery forwarding destinations (ADR-034 Increment 3): RS256 signing of the Google
# service-account assertion. See the workspace entry for why this is `ring` and not `rsa`.
ring = { workspace = true }
# The WebUI's TLS certificate (ADR-044, `mod server_cert`). x509-parser reads an imported chain's
# subject/issuer/SANs/validity for the settings page and the expiry check; rcgen mints the
# self-signed bootstrap certificate. The key↔certificate proof needs neither — rustls's own
# `CertifiedKey::keys_match()` does it, which is the same comparison the server would make.
x509-parser = { workspace = true }
rcgen = { workspace = true }
# Optional global allocator — see the workspace Cargo.toml entry for why this is a feature and not
# a dependency, and for the condition under which it stops being optional.
mimalloc = { workspace = true, optional = true }

[features]
# ON by default — it halved core's resident set and stopped it growing, at equal throughput. The
# measurement is in the workspace Cargo.toml. It stays a feature rather than becoming unconditional
# so `--no-default-features` remains a one-flag way back to the system allocator, which is what any
# future comparison needs.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
# `srcread` for the checks that read a module's own text (ADR-091/099). A dev-dependency on purpose:
# under resolver v2 the feature is not unified into a normal `cargo build`, so the shipped core
# still links a `yagra-common` with no filesystem reader in it.
yagra-common = { path = "../yagra-common", features = ["test-util"] }
tower = { workspace = true }
