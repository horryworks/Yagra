[package]
name = "yagra-core"
description = "Yagra-core — Core/API: orchestration, scheduling, northbound API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "yagra-core"
path = "src/main.rs"

[dependencies]
yagra-common = { path = "../yagra-common" }
yagra-bus = { path = "../yagra-bus", features = ["nats"] }
yagra-topology = { path = "../yagra-topology" }
yagra-alert = { path = "../yagra-alert" }
yagra-discovery = { path = "../yagra-discovery" }
yagra-secrets = { path = "../yagra-secrets" }
yagra-transport = { path = "../yagra-transport" }
yagra-telemetry = { path = "../yagra-telemetry" }
yagra-hoststats = { path = "../yagra-hoststats" }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tokio-stream = { workspace = true }
lettre = { workspace = true }
openidconnect = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
serde_json = { workspace = true }
