# cargo-deny supply-chain policy — consumed by /verify (Dependency & Supply-Chain Audit).
# Run: cargo deny check advisories bans sources licenses
# Any ignore added here must carry a comment explaining why and when it can be removed.

[advisories]
version = 2
yanked = "warn"
# Only flag unmaintained crates we depend on directly (we can act on those);
# transitive ones (e.g. csnmp -> derivative, RUSTSEC-2024-0388) are upstream's call.
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": a timing side-channel in the `rsa` crate. No fixed
    # version exists upstream. Pulled transitively by `openidconnect` (RS256 ID-token verification,
    # ADR-010 OIDC login). The attack recovers a key via RSA *private-key* operations
    # (PKCS#1 v1.5 decryption); as an OIDC relying party Yagra only *verifies* ID-token signatures
    # with the IdP's *public* key and never performs RSA private-key decryption/signing, so this
    # code path is not reachable. Re-evaluate if `rsa` ships a fix or openidconnect drops it.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# Permissive licenses only; extend deliberately (copyleft needs a conscious decision).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    # Mozilla CA bundle data shipped by webpki-roots (rustls ecosystem) — permissive data license.
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicate versions bloat the poller image and widen the audit surface — surface, don't fail.
multiple-versions = "warn"
wildcards = "warn"
# Workspace members reference each other by path without a version — that's fine.
allow-wildcard-paths = true

[sources]
# Guard against dependency confusion: crates.io only. The snmp2 fork is a local path
# patch (vendor/snmp2), which is not subject to source checks.
unknown-registry = "deny"
unknown-git = "deny"
