  #       # 1. Back up first, using the procedure of record (ADR-040) rather than a second copy of
  #       #    it. The script ships inside the RUNNING core image, so the backup matches the version
  #       #    being replaced. NOTE: this is a rollback aid, not a disaster-recovery backup — it
  #       #    lands beside the database it protects.
  #       say running backup "backing up before touching anything"
