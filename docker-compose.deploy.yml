# Yagra — deploy-only composition.
#
# Unlike docker-compose.yml (which BUILDS images locally), this file only PULLS pre-built images
# and runs them. Nothing in CI invokes it: deploying is an explicit act, run over SSH from a
# workstation.
#
#   docker compose -p yagra -f docker-compose.deploy.yml pull
#   docker compose -p yagra -f docker-compose.deploy.yml up -d
#
# Two variables select the image:
#
#   YAGRA_IMAGE_TAG    v<version> (a release), :latest (the latest stable release), or a git SHA.
#                      Defaults to `latest`.
#   YAGRA_IMAGE_REPO   where to pull from. Defaults to `ghcr.io/horryworks`, the published
#                      releases. Development builds are NOT published there — `/flashdeploy`
#                      builds them and pushes them to a private registry on the test server, and
#                      sets this to `localhost:5000`. Rollback is the same command with an older
#                      tag, from either source.
#
# Project name is fixed ("yagra") so the named volumes (pgdata/vmdata/…) persist across redeploys
# regardless of the invoking directory — this is what keeps PostgreSQL/VictoriaMetrics data intact
# through upgrades (ADR-017). Pass `-p yagra` on every invocation anyway: Compose otherwise derives
# the project name from the directory and would fork a second, empty stack.

name: yagra

services:
  # ── KEK init — generate a persistent key-encryption key on first run ──
  # Without a mounted KEK, core falls back to an EPHEMERAL key regenerated on every restart,
  # which makes stored credentials (SNMP communities, API tokens) undecryptable after a
  # redeploy. This one-shot service writes a 32-byte KEK into a named volume once (and never
  # overwrites it), so credentials survive restarts/upgrades (ADR-017 / ADR-018).
  kek-init:
    image: busybox:stable
    command:
      - sh
      - -c
      - "test -f /kek/key || { head -c 32 /dev/urandom > /kek/key && chmod 0444 /kek/key; }"
    volumes:
      - kekdata:/kek
    restart: "no"

  # ── TLS volume init — decide the certificate volume's ownership before anyone else can ──
  # The WebUI is HTTPS by default (ADR-044). Core writes the certificate of record from PostgreSQL
  # into `tlsdata`; the web container reads it read-only. That means two containers with different
  # uids share one volume, and **whoever mounts an empty named volume first decides its ownership** —
  # Docker seeds it from the mounting image's path, ownership included. If `web` gets there first
  # (`up -d web` on its own, a `--no-deps` restart, or anything after `docker volume rm`), the
  # directory ends up owned by nginx's uid 101 and core can never write into it. `depends_on` does
  # not cover those orderings and `:ro` does not prevent the seeding.
  #
  # So a root one-shot settles it, exactly as `kek-init` above settles the KEK. 0750 owned by core's
  # uid, with `web` joining the group via `group_add` below: core writes, nginx reads, nothing else
  # on the host can. 10001 is core's runtime uid **and gid** — both pinned in
  # docker/yagra-rust.Dockerfile, which also creates this directory in the image so the ownership is
  # right in the ordinary case too. This service is the guarantee for the orderings that skip it.
  #
  # ⚠️ The gid being pinned is not incidental. Left to `useradd` alone the system picks one (999 on
  # bookworm), the bundle is then written 0640 owned by *that* group, and nginx — added to group
  # 10001 — traverses the directory and gets "Permission denied" on the file. The WebUI never comes
  # up, with every other signal green. That is what happened on the first real deployment of ADR-044.
  tls-init:
    image: busybox:stable
    command:
      - sh
      - -c
      - "mkdir -p /tls && chown 10001:10001 /tls && chmod 0750 /tls"
    volumes:
      - tlsdata:/tls
    restart: "no"

  # Two containers share `logdata`, and they run as different users — so somebody has to arrange the
  # directory before either starts (ADR-045 Inc.3). Same one-shot pattern, and the same reason, as
  # tls-init above: the image that creates a path only gets a vote when Docker seeds an *empty*
  # volume, so neither image can fix an ordering it lost or a volume that already exists. This runs
  # on every `up`, which is what makes it work on a deployment whose logdata predates the feature.
  #
  # The modes are minimal and each bit is doing something:
  #   /logs         0751  core (10001) owns and writes it; `o=x` lets the poller *traverse* to its
  #                       own subdirectory without being able to list or write core's log.
  #   /logs/pollers 0755  owned by the poller (10002) so it can write regardless of which gid Debian
  #                       handed it — the poller stage pins only the uid, and the gid came out 999.
  #                       `o=rx` is what lets core read the files back for the support bundle.
  log-init:
    image: busybox:stable
    command:
      - sh
      - -c
      - "mkdir -p /logs/pollers && chown 10001:10001 /logs && chmod 0751 /logs && chown 10002 /logs/pollers && chmod 0755 /logs/pollers"
    volumes:
      - logdata:/logs
    restart: "no"

  # ── Bus TLS volume init — same one-shot pattern, third volume (ADR-065) ──
  # The bus certificate is shared by two containers running as different users: `bus-cert-init`
  # below writes it as core's uid 10001, and `nats` reads it as uid 1000 through `group_add`. So
  # somebody has to arrange the directory before either starts, for exactly the reasons `tls-init`
  # above spells out — Docker seeds an empty named volume from the image that mounts it FIRST, and
  # neither of those images can fix an ordering it lost or a volume that already exists.
  #
  #   /etc/nats        0755  core owns it; nats needs to traverse and read the configuration file,
  #                          which is public (it holds `$VAR` references, never a secret).
  #   /etc/nats/certs  0750  the private key lives here, 0640 — `o=` is what keeps it off any other
  #                          container that ever mounts this volume.
  # ⚠️ `certs/` is 0755, not 0750, and the difference is what lets the **poller** dial the bus.
  # The poller runs as uid 10002 (core is 10001) and needs `server-cert.pem` as its trust anchor —
  # the same certificate the WebUI hands out to remote sites, so it is public by construction. At
  # 0750 the directory could not be traversed and the poller failed every connection with
  # `TLS error: Permission denied (os error 13)`, measured on 192.168.1.211 the first time the TLS
  # bus was ever run (2026-08-25).
  # 🚨 The obvious fix — `group_add: ["10001"]` on the poller, mirroring what `nats` does — is
  # WRONG here. nats needs it because nats needs the private *key*; giving the poller group 10001
  # would hand it `server-key.pem` (0640) as well, which is the one file on this volume it must
  # never see. Opening the directory and leaving the key's own mode to protect it keeps the
  # boundary where it belongs: public certificate readable, private key not.
  bus-init:
    image: busybox:stable
    command:
      - sh
      - -c
      - "mkdir -p /etc/nats/certs && chown -R 10001:10001 /etc/nats && chmod 0755 /etc/nats && chmod 0755 /etc/nats/certs"
    volumes:
      - buscerts:/etc/nats
    restart: "no"

  # ── Bus certificate + NATS configuration (ADR-065) ──
  # Mints the self-signed certificate the bus serves, materializes it, and copies the NATS server
  # configuration out of the core image onto the same volume. Runs from the core image so the
  # certificate rules live in one place (`crates/yagra-core/src/bus_cert.rs`), and runs as a
  # ONE-SHOT before nats because core cannot do it: core needs the bus to start, and the bus needs
  # the certificate. Idempotent — with a valid certificate stored it only rewrites the files.
  #
  # ⚠️ This container applies database migrations, and it is usually the first thing to. That is
  # forced by the same cycle: the table it reads is created by a migration, migrations are applied
  # by core, core waits for the bus, the bus waits for this. Same binary, same embedded set, and
  # sqlx takes an advisory lock, so core applying them a moment later is a no-op. The practical
  # consequence: on a fresh deployment a migration failure surfaces here rather than in core.
  bus-cert-init:
    image: ${YAGRA_IMAGE_REPO:-ghcr.io/horryworks}/yagra-core:${YAGRA_IMAGE_TAG:-latest}
    pull_policy: always
    command: ["bus-cert"]
    depends_on:
      postgres: { condition: service_started }
      kek-init: { condition: service_completed_successfully }
      bus-init: { condition: service_completed_successfully }
    environment:
      YAGRA_DATABASE_URL: postgres://yagra:${POSTGRES_PASSWORD:-yagra}@postgres:5432/yagra
      # The same KEK every other secret is sealed with — the bus private key is not a special case.
      YAGRA_KEK_FILE: /kek/key
      YAGRA_BUS_TLS_DIR: /etc/nats
      # Extra subject alternative names, ADDED to the internal defaults (`nats`, loopback). A remote
      # poller's TLS handshake fails unless the exact address it dials is in this list. The WebUI
      # switch reissues the certificate with the address the operator types, so this is only for a
      # deployment that has to set it from a shell.
      YAGRA_BUS_TLS_SANS: ${YAGRA_BUS_TLS_SANS:-}
      # The NATS account minted Auth Callout users join (ADR-065 Inc.7). This container writes it
      # into `callout.conf`; `core` below reads the same variable when it signs. They are given the
      # identical expression on purpose — the two live on opposite sides of the broker, and a
      # disagreement refuses every remote poller with nothing in either log to say why.
      # ⚠️ `$$G` is the literal `$G`. A single `$` here would be substituted by Compose (as an
      # undefined variable, i.e. to nothing) before either process ever saw it.
      YAGRA_NATS_CALLOUT_ACCOUNT: ${YAGRA_NATS_CALLOUT_ACCOUNT:-$$G}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - kekdata:/kek:ro
      - buscerts:/etc/nats
    restart: "no"

  # ── Yagra-core (crates/core) — orchestration, scheduling, northbound API ──
  core:
    image: ${YAGRA_IMAGE_REPO:-ghcr.io/horryworks}/yagra-core:${YAGRA_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      nats: { condition: service_started }
      victoriametrics: { condition: service_started }
      victorialogs: { condition: service_started }
      clickhouse: { condition: service_started }
      kek-init: { condition: service_completed_successfully }
      tls-init: { condition: service_completed_successfully }
      log-init: { condition: service_completed_successfully }
    environment:
      YAGRA_DATABASE_URL: postgres://yagra:${POSTGRES_PASSWORD:-yagra}@postgres:5432/yagra
      YAGRA_REDIS_URL: redis://redis:6379
      # Plaintext on the internal network by default. Settings ▸ Pollers ▸ Remote pollers rewrites
      # this to `tls://core:<password>@nats:4222` in `.env` when remote acceptance is turned on —
      # server-wide TLS leaves no plaintext port, so the co-located clients move with the bus
      # (ADR-065). Core reports which of the two it is using on Settings ▸ Pollers.
      YAGRA_BUS_URL: ${YAGRA_CORE_BUS_URL:-nats://nats:4222}
      # Pins the bus certificate. Empty means "no CA", which is the plaintext case — core applies the
      # same empty-means-unset rule the poller does. The certificate is one Yagra minted and signed
      # itself, so it is in no container's trust store and this is not optional once TLS is on.
      YAGRA_BUS_CA_FILE: ${YAGRA_BUS_CA_FILE:-}
      # Where core reads the bus certificate back from, so Settings ▸ Pollers can say whether the
      # bus is actually serving the certificate that is stored. Read-only: `bus-cert-init` writes it.
      YAGRA_BUS_TLS_DIR: /etc/nats
      # PostgreSQL connection-pool ceiling for the whole core process — the scheduler sweep, result
      # ingest, the northbound API and the coordinator mirror all draw from this one pool.
      # 🚨 Raise it before running a fleet with many interfaces. Measured 2026-08-30 at 50,000 nodes
      # x 24 ports (ADR-110): the interface upsert rewrites ~1M rows a cycle and held every one of
      # the default 20 connections, so unrelated readers queued behind it — a SELECT over
      # routing_rules returning ZERO rows took 74 seconds, the topology derive took 337s, and core
      # stalled long enough for the bus to drop its pollers. The symptom is never one slow query; it
      # is every query being slow at once. .env.example recommends 50-80 at that size, and
      # PostgreSQL's own max_connections (default 100) has to clear it.
      YAGRA_PG_MAX_CONNECTIONS: ${YAGRA_PG_MAX_CONNECTIONS:-20}
      # How many tasks write metrics to VictoriaMetrics (ADR-110 Inc.2). Default: one per core, at
      # most 4. One task can only have one bulk import in flight, and 84% of that task's time is
      # spent waiting for VictoriaMetrics to answer -- measured at 50,000 nodes x 24 ports, where
      # one writer saturated at 2,500 results/s with its queue pinned. Samples are sharded by node,
      # so a series' order is preserved. The tier's memory bound is DIVIDED among the writers, not
      # repeated, so raising this does not raise what core can hold. Set 1 to get the old
      # single-writer behaviour back, byte for byte.
      YAGRA_VM_WRITERS: ${YAGRA_VM_WRITERS:-}
      # How many poll results the metrics tier may hold while VictoriaMetrics is slow (default
      # 16384, ADR-110 Increment 5). Read yagra_vm_backlog_needed_high_water before raising it: it
      # says how deep an unbounded queue would have gone during the stalls this box actually had.
      # At 24 ports a queued result is ~21 KB, so the memory cost is linear.
      YAGRA_RESULT_QUEUE_CAP: ${YAGRA_RESULT_QUEUE_CAP:-}
      YAGRA_TSDB_URL: http://victoriametrics:8428
      # Event log store (ADR-024): passive events searched from + written to VictoriaLogs;
      # PostgreSQL keeps only alert-linked rows. Unset to keep events entirely in PostgreSQL.
      YAGRA_LOGS_URL: http://victorialogs:9428
      # Flow store (ADR-031, the 5th store — traffic-flow tier). ClickHouse holds edge-aggregated
      # NetFlow/IPFIX records (1-month TTL, loss-tolerant). Set YAGRA_CLICKHOUSE_URL empty in .env
      # to disable flow monitoring (the flow API then 503s; nothing else is affected).
      YAGRA_CLICKHOUSE_URL: ${YAGRA_CLICKHOUSE_URL-http://clickhouse:8123}
      YAGRA_FLOW_RETENTION_DAYS: ${YAGRA_FLOW_RETENTION_DAYS:-30}
      # Retention for ClickHouse's OWN system log tables (ADR-031 Inc.4). "0" leaves `system.*`
      # untouched — use that when YAGRA_CLICKHOUSE_URL points at a ClickHouse this deployment does
      # not own. Read every start; housekeeping on the store, not a policy over Yagra's data.
      YAGRA_CLICKHOUSE_SYSTEM_LOG_RETENTION_DAYS: ${YAGRA_CLICKHOUSE_SYSTEM_LOG_RETENTION_DAYS:-7}
      # Offline IP→ASN enrichment for flow AS (ADR-031). Most non-BGP exporters (incl. our lab USG)
      # send AS=0; core fills those zeros at write time and resolves AS names in the flow top-AS view.
      # The dataset lives in the shared `ipasndata` volume, kept fresh by the `ipasn-updater` sidecar
      # (below) — core itself never reaches the internet. Enrichment is forward-only (existing rows
      # keep AS=0). core hot-reloads the file every YAGRA_IPASN_RELOAD_SECS with NO restart, so a
      # refresh by the updater takes effect on its own. Set YAGRA_IPASN_DB empty in .env to disable.
      YAGRA_IPASN_DB: ${YAGRA_IPASN_DB-/data/ipasn/ip2asn.tsv}
      YAGRA_IPASN_RELOAD_SECS: ${YAGRA_IPASN_RELOAD_SECS:-21600}
      # Persistent KEK (mounted from the kekdata volume) — credentials survive restarts.
      YAGRA_KEK_FILE: /kek/key
      # Where core materializes the WebUI's TLS certificate (ADR-044). The certificate of record is
      # a row in PostgreSQL — the private key envelope-encrypted with the KEK above, the chain in
      # plaintext because a certificate is public by construction. Core writes the pair here as one
      # `server.pem` before it binds its listener, so "core is healthy" means the file exists and
      # `web`'s depends_on below is a real guarantee rather than a coincidence. The web container
      # re-reads it within seconds of a change, so importing a certificate needs no restart.
      YAGRA_TLS_DIR: /var/lib/yagra/tls
      # Host self-metrics (Settings ▸ System Health ▸ Host resources): `root` = container rootfs,
      # `metrics` = the VictoriaMetrics data volume (mounted read-only below). Database growth is
      # tracked via pg_database_size instead (the pgdata dir is 0700 and can't be stat'd).
      YAGRA_DISK_WATCH_PATHS: ${YAGRA_DISK_WATCH_PATHS:-/=root,/hostfs/vm=metrics}
      # Where core exchanges upgrade requests and status with the `yagra-updater` sidecar (ADR-050,
      # Settings ▸ Upgrade). Setting it does NOT enable upgrades: the page reports the mechanism as
      # disabled until the sidecar at the bottom of this file is uncommented and starts reporting.
      # Unset it to remove even the directory.
      YAGRA_UPGRADE_DIR: ${YAGRA_UPGRADE_DIR:-/data/upgrade}
      # Local-auth admin password seeded on first start. Left empty by default: core then
      # generates a one-time random admin password and prints it once in its logs
      # (`docker compose logs core`). Set YAGRA_ADMIN_PASSWORD in .env to choose your own.
      YAGRA_ADMIN_PASSWORD: ${YAGRA_ADMIN_PASSWORD:-}
      # Read-only dashboard exposure: unset/false = viewing requires login (default);
      # set true to serve node/metric/alert reads without authentication.
      YAGRA_PUBLIC_DASHBOARD: ${YAGRA_PUBLIC_DASHBOARD:-false}
      # MCP server (ADR-028): unset/false = /mcp not mounted (default). Set true to expose the
      # read-only AI/MCP tool surface on the API port at /mcp. Auth (an API token from Settings ▸
      # API tokens, or a session token) is always required. See README ▸ "Connecting an AI client".
      YAGRA_ENABLE_MCP: ${YAGRA_ENABLE_MCP:-false}
      # Optional: alert Webhook + SNMP v2c community (left unset = disabled).
      YAGRA_WEBHOOK_URL: ${YAGRA_WEBHOOK_URL:-}
      YAGRA_SNMP_COMMUNITY: ${YAGRA_SNMP_COMMUNITY:-}
      # How long a poller pool must have nodes but no live poller before Yagra alerts on it
      # (ADR-009's self-monitoring blind spot; default 300s). A poller announces its own departure,
      # so an ordinary rolling restart raises the condition instantly — this debounce is what stops
      # that paging anyone. `0` disables the alert; the gauges still publish either way.
      YAGRA_POOL_COVERAGE_ALERT_AFTER_SECS: ${YAGRA_POOL_COVERAGE_ALERT_AFTER_SECS:-}
      # Optional: route Meraki cloud polling to a specific poller pool (default "default").
      # Only relevant once you run pool-scoped remote pollers (docker-compose.poller.yml).
      # YAGRA_MERAKI_POOL: ${YAGRA_MERAKI_POOL:-default}
      # Optional: OpenTelemetry OTLP/HTTP endpoint for distributed tracing (unset = logs only).
      # Point at your collector; set OTEL_TRACES_SAMPLER=parentbased_traceidratio +
      # OTEL_TRACES_SAMPLER_ARG at scale. Both core and poller should use the same collector.
      YAGRA_OTEL_ENDPOINT: ${YAGRA_OTEL_ENDPOINT:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      # Structured-log level (info so KEK/credential/scheduler events are visible).
      RUST_LOG: ${RUST_LOG:-info}
      # Core's own log, on disk as well as on stdout (ADR-045). ON by default, and that is the whole
      # point: `docker logs` needs a shell on this host, which is exactly what a locked-down site
      # does not grant — so without this a panic or an OOM leaves nothing anybody can retrieve. The
      # support bundle at Settings ▸ Support bundle reads these files back over HTTPS, which means a
      # bundle taken AFTER a recovery still carries the run that died.
      # Hourly files, YAGRA_LOG_RETAIN_HOURS of them (48 ≈ two days), pruned automatically. Set
      # YAGRA_LOG_DIR empty in .env to turn it off.
      YAGRA_LOG_DIR: ${YAGRA_LOG_DIR-/var/log/yagra}
      YAGRA_LOG_RETAIN_HOURS: ${YAGRA_LOG_RETAIN_HOURS:-48}
      # Signed session tokens (Core HA active/active session substrate, ADR-016 Increment 2a). Mount
      # a shared 32-byte key (same key on every core in an HA set) so a login on one core is accepted
      # on all cores and survives a restart/failover. Unset ⇒ opaque per-process tokens (today's
      # behavior). Uncomment together with the session-key volume mount below.
      # YAGRA_SESSION_KEY_FILE: /etc/yagra/session/session.key
      # Per-poller credential scoping via Auth Callout (ADR-030, wired up by ADR-065 Inc.7). Core
      # signs each connecting poller a NATS credential scoped to that poller's own subjects, using
      # an account key it generates and keeps sealed in PostgreSQL — there is no key to mount and
      # no issuer to copy anywhere. See docker/nats/nats-server.conf.
      #
      # This one variable is what turns it on, and it is not a switch of its own: the remote-poller
      # switch writes it into `.env` in the same change that puts the bus on TLS, so "the bus is the
      # secured one" and "the callout governs it" are one fact. Empty (the default here) means the
      # plaintext internal bus, and core neither answers callouts nor gates poller registration.
      #
      # 🚨 It was commented out until v0.3.2, which is why the responder had never run in
      # production: core could not see the secret it validates against, so it returned immediately
      # on every deployment there has ever been.
      YAGRA_NATS_POLLER_PASSWORD: ${YAGRA_NATS_POLLER_PASSWORD:-}
      # The NATS account minted poller users join — the same expression `bus-cert-init` above is
      # given, so what core signs for and what `callout.conf` names cannot come apart.
      YAGRA_NATS_CALLOUT_ACCOUNT: ${YAGRA_NATS_CALLOUT_ACCOUNT:-$$G}
      # The id of the poller inside this composition, given to core as well as to the poller —
      # the SAME expression, so the two cannot name different pollers (ADR-065 Inc.8). Core needs
      # its own copy because the updater heartbeat it would otherwise read is a file on a timer:
      # at startup it still names the container compose has just replaced, so adopting from it
      # alone registers a dead id and leaves the live poller invisible. Measured on 192.168.1.211.
      YAGRA_LOCAL_POLLER_ID: ${YAGRA_POLLER_ID:-local}
      # Only for a deployment that mounted an account seed under ADR-030 before Inc.7 existed. It
      # takes precedence over the stored key; nothing new should set it.
      # YAGRA_NATS_CALLOUT_SEED_FILE: /etc/yagra/callout/account.seed
    volumes:
      - kekdata:/kek:ro
      # Read-only view of the metrics data volume so core can statvfs its backing disk for the
      # Host-resources "metrics" trend (capacity only — core never writes here).
      - vmdata:/hostfs/vm:ro
      # The bus certificate (ADR-065) — read-only here. `bus-cert-init` is the only writer, and core
      # reads the materialized file only to answer "is the bus serving what is stored?". It is also
      # where YAGRA_BUS_CA_FILE points once the bus is TLS.
      - buscerts:/etc/nats:ro
      # Offline IP→ASN dataset (ADR-031) — read-only, from the named `ipasndata` volume that the
      # `ipasn-updater` sidecar writes. A named volume persists across redeploys and is untouched by
      # the runner's `git clean` (no host path). If the file is absent core just runs enrichment off
      # and hot-loads it once the updater populates the volume.
      - ipasndata:/data/ipasn:ro
      # The WebUI's TLS certificate (ADR-044) — read-write here, read-only in `web`. Core is the
      # only writer; the volume is a materialization of the PostgreSQL row, not the source of truth.
      # A Kubernetes deployment materializes through a Secret instead and never sees this volume.
      - tlsdata:/var/lib/yagra/tls
      # Core's rotated log files (ADR-045). A named volume, so they outlive the container — a log
      # that dies with the process it was recording is no use for diagnosing why it died.
      - logdata:/var/log/yagra
      # Upgrade hand-off (ADR-050). Read-write: core writes the request file, the `yagra-updater`
      # sidecar writes the status back. A file rather than the database or the bus because core is
      # RESTARTED by the operation it requested — the process that asks is never the process that
      # sees it finish, so progress has to outlive both. Harmless with no sidecar deployed: core
      # then reports the mechanism as disabled and nothing ever reads the directory.
      - upgradedata:/data/upgrade
      # Auth Callout account seed (ADR-030) — mount the SEED file read-only. It is a secret (like the
      # KEK): keep it off env vars and out of the image. Uncomment with the env vars above.
      # - ${YAGRA_CALLOUT_SEED_DIR:-./callout}:/etc/yagra/callout:ro
      # Session signing key (ADR-016 Increment 2a) — mount the shared key read-only (a secret, like
      # the KEK). Every core in an HA set mounts the SAME key. Uncomment with YAGRA_SESSION_KEY_FILE.
      # - ${YAGRA_SESSION_KEY_DIR:-./session}:/etc/yagra/session:ro
    ports:
      # Core's own API port, plaintext. The TLS edge is the web container (ADR-044) and proxies
      # /api/ and /mcp to it over the internal network, so browsers never come here.
      #
      # It stays open on the LAN by default, and that is a sequencing decision rather than an
      # oversight: this port is what keeps machine clients working while the deployment is still on
      # the bootstrap self-signed certificate — Prometheus scrapes, webhook senders, direct API
      # scripts. Closing it in the same upgrade that introduces an untrusted certificate would break
      # all of them at once, with two overlapping causes and nothing to tell them apart.
      #
      # Once those clients are on https://<host>/api/v1 with a certificate they trust, close it:
      #   YAGRA_API_BIND=127.0.0.1
      # in .env leaves it reachable on the box and off the network. Settings ▸ TLS says so too.
      - "${YAGRA_API_BIND:-0.0.0.0}:${YAGRA_API_PORT:-8080}:8080"
    restart: unless-stopped

  # ── Yagra-poller (crates/poller) — stateless poller worker ──
  poller:
    image: ${YAGRA_IMAGE_REPO:-ghcr.io/horryworks}/yagra-poller:${YAGRA_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      nats: { condition: service_started }
      # The shared log volume has to be arranged before this poller tries to write into it.
      log-init: { condition: service_completed_successfully }
    environment:
      # Moves to `tls://poller:<password>@nats:4222` with the bus — see the note on core's
      # YAGRA_BUS_URL above. This co-located poller is the one that stops during the switch.
      YAGRA_BUS_URL: ${YAGRA_POLLER_BUS_URL:-nats://nats:4222}
      YAGRA_BUS_CA_FILE: ${YAGRA_BUS_CA_FILE:-}
      # 🚨 A STABLE id, and it has to be set here rather than left to fall back (ADR-065 Inc.8).
      # Unset, a poller names itself after its container hostname, which Docker invents afresh every
      # time compose recreates the container — so an upgrade, a restart with a changed image tag, or
      # an `up -d` after any edit gives this poller a NEW identity. Two things then go wrong at once,
      # and only on a deployment that accepts remote pollers:
      #   * "Accept remote pollers" turns auto-registration OFF (the bus refuses an id nobody
      #     registered) — but this poller connects on the STATIC `poller` account, which the callout
      #     deliberately bypasses (`auth_users`), so the bus never refuses it. It is neither refused
      #     nor registered: it keeps polling off its Redis liveness and vanishes from Settings ▸
      #     Pollers. Measured on 192.168.1.211, 2026-08-26 — 11 nodes assigned, 389 jobs run, no row.
      #   * every previous container id is left behind as a row that never goes offline-and-away,
      #     so the page shows a fleet of ghosts and not the poller doing the work.
      # `local` because this poller is part of the deployment rather than something discovered. The
      # updater reads this variable before falling back to the hostname (see local_pollers below), so
      # the id core pre-registers and the id the poller claims stay the same one.
      YAGRA_POLLER_ID: ${YAGRA_POLLER_ID:-local}
      # Which pool this poller serves. Absent ⇒ the binary's own default, `default` — so leaving
      # this unset is byte-identical to every deployment before it existed.
      #
      # ⚠️ **It decides where this poller lands the FIRST time core sees it, and nothing after that**
      # (ADR-107 Inc.2). Core owns `pollers.pool` once the inventory row exists, so editing this and
      # recreating the container does *not* move a poller — Settings ▸ Pollers does, immediately and
      # without restarting anything. Setting it to disagree with core is harmless: the value is used
      # for the insert and ignored on every heartbeat after.
      #
      # 💡 It arrived here for the opposite reason, and the story is worth keeping. Under ADR-107
      # Inc.1 the WebUI could only *record* a destination and hand the operator this line to apply —
      # and this composition did not pass the variable at all, so that instruction was inert on the
      # co-located poller: the value sat in .env, reached nothing, and the operator waited for a move
      # that never happened with no error anywhere. Found by running the round trip on
      # 192.168.1.211, 2026-08-28; no test could see it. Inc.2 removed the instruction rather than
      # the trap, which is the better fix, but the line stays because first contact still needs it.
      YAGRA_POLLER_POOL: ${YAGRA_POLLER_POOL:-}
      # On-disk rotated logs (ADR-045 Inc.3), read back by core's support bundle. The pollers/
      # SUBDIRECTORY of core's log volume is load-bearing — core collects by filename prefix, and
      # keeping the two apart on disk means neither collector can sweep up the other's files. Each
      # poller's file carries its YAGRA_POLLER_ID, so a pool sharing this volume never has two
      # processes appending to one hourly file. Set empty in .env to turn it off.
      YAGRA_LOG_DIR: ${YAGRA_POLLER_LOG_DIR-/var/log/yagra/pollers}
      # How many probes this poller runs at once — a bound on IN-FLIGHT probes, not a rate:
      # the polls/s you get is this number divided by how long one probe takes. Measured against
      # the ICMP transport alone (examples/icmp_bench.rs, 40ms RTT): linear up to 512, with 256
      # giving 2,123 polls/s at no reply loss. A whole poller sustains less than that. Read
      # `yagra_poll_cycles_missed_total` AND `yagra_poll_inflight` before changing it: a counter
      # that climbs while the gauge sits below the cap means this poller is being starved of work,
      # not throttled, and raising the number changes nothing. The same budget caps concurrent SNMP
      # table walks, which are much heavier than a ping — lower it for a small deployment.
      YAGRA_MAX_CONCURRENT_POLLS: ${YAGRA_MAX_CONCURRENT_POLLS:-256}
      # Passive-event listeners (syslog / SNMP traps, v1/v2c) — unprivileged container
      # ports, standard host ports mapped below. Set empty in .env to disable.
      YAGRA_SYSLOG_BIND: ${YAGRA_SYSLOG_BIND-0.0.0.0:1514}
      YAGRA_TRAP_BIND: ${YAGRA_TRAP_BIND-0.0.0.0:1162}
      # Optional trap community filter (mismatches dropped; value never logged).
      YAGRA_TRAP_COMMUNITY: ${YAGRA_TRAP_COMMUNITY:-}
      # Edge intake caps (per-source-IP / global token buckets, S8). Defaults match the raised code
      # defaults (200 / 5000 msg/s) — safe well under the measured ~27k/s core+NATS drain ceiling
      # (2026-07-11 load test). Raise per site for chassis-scale syslog/trap storms.
      YAGRA_EVENT_RATE_PER_SOURCE: ${YAGRA_EVENT_RATE_PER_SOURCE:-200}
      YAGRA_EVENT_RATE_GLOBAL: ${YAGRA_EVENT_RATE_GLOBAL:-5000}
      # Flow collector (ADR-031): receive NetFlow v5/v9 / IPFIX, edge-aggregate to top-N/bucket, and
      # publish to core (→ ClickHouse). Set YAGRA_FLOW_BIND empty in .env to disable. Point devices'
      # flow export at this poller's :2055.
      YAGRA_FLOW_BIND: ${YAGRA_FLOW_BIND-0.0.0.0:2055}
      # sFlow v5 (ADR-031 Increment 2): off by default — set YAGRA_SFLOW_BIND=0.0.0.0:6343 in .env to
      # receive sFlow (counts are sampling-rate-scaled estimates; shares the flow buckets/caps).
      YAGRA_SFLOW_BIND: ${YAGRA_SFLOW_BIND-}
      YAGRA_FLOW_BUCKET_SECS: ${YAGRA_FLOW_BUCKET_SECS:-60}
      YAGRA_FLOW_TOP_N: ${YAGRA_FLOW_TOP_N:-500}
      # Optional: OpenTelemetry OTLP/HTTP endpoint (unset = logs only). Same collector as core.
      YAGRA_OTEL_ENDPOINT: ${YAGRA_OTEL_ENDPOINT:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${YAGRA_SYSLOG_PORT:-514}:1514/udp"   # syslog intake
      - "${YAGRA_TRAP_PORT:-162}:1162/udp"     # SNMP trap intake
      - "${YAGRA_FLOW_PORT:-2055}:2055/udp"    # NetFlow v5/v9 / IPFIX flow intake (ADR-031)
      - "${YAGRA_SFLOW_PORT:-6343}:6343/udp"   # sFlow intake (ADR-031 Increment 2; bind via YAGRA_SFLOW_BIND)
    # NOTE: event→node correlation keys on the datagram source IP. If Docker's bridge
    # networking rewrites it on this host, switch the poller to `network_mode: host`.
    volumes:
      # Store-and-forward disk spill (Phase 3). Without it the buffer is memory-only, so a bus
      # outage longer than the in-memory ring drops the oldest results, and a poller restart
      # mid-outage loses everything it was holding.
      - pollerbuf:/var/lib/yagra/buffer
      # The bus certificate this poller pins once the bus is TLS (ADR-065). A remote-site poller
      # gets the same file by hand; this one shares the volume because it is on the same host.
      - buscerts:/etc/nats:ro
      # Shared with core so the support bundle can carry this poller's log — including the last
      # hour of a poller that has since died, which is the case no bus request can ever answer.
      - logdata:/var/log/yagra
    cap_add:
      - NET_RAW        # required for raw-socket ICMP (surge-ping)
    restart: unless-stopped

  # ── Yagra-web (web/) — WebUI, and the deployment's TLS edge ──
  # HTTPS by default on host :443 (ADR-044). The UI/API carries the login password, bearer tokens
  # and (pre-encryption) plaintext device credentials, so this is encrypted out of the box rather
  # than after following a hardening procedure.
  #
  # The certificate starts as a self-signed one core generates on first start — browsers will warn.
  # That is a starting point, not the destination: import your own at Settings ▸ TLS, which takes
  # effect within seconds without restarting anything.
  #
  # Set YAGRA_WEB_TLS=off if something in front of this container already terminates HTTPS (an
  # external reverse proxy or a cloud LB). Then, and only then, this port is plain HTTP again.
  web:
    image: ${YAGRA_IMAGE_REPO:-ghcr.io/horryworks}/yagra-web:${YAGRA_IMAGE_TAG:-latest}
    pull_policy: always
    # Wait for core to actually serve (its image HEALTHCHECK probes /healthz), not just to start —
    # nginx proxies /api to it, so starting before core is ready would 502 the first requests. Since
    # ADR-044 this also carries the certificate: core materializes server.pem *before* it binds its
    # listener, so "core is healthy" implies the file nginx is about to open already exists.
    depends_on:
      core:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    environment:
      # on (default) = terminate TLS here. off = plain HTTP, for an external-proxy deployment.
      YAGRA_WEB_TLS: ${YAGRA_WEB_TLS:-on}
    # nginx runs as uid 101 and the certificate volume is owned by core's uid 10001 with mode 0750,
    # so nginx reads it as a supplementary group member. `group_add` is the whole mechanism — do NOT
    # "simplify" this to `user: "10001:10001"`, which breaks the image: nginx-unprivileged chowns
    # /etc/nginx and /var/cache/nginx to $UID:0 and depends on gid 0 for its own files.
    group_add:
      # core's uid AND gid, both pinned to 10001 in docker/yagra-rust.Dockerfile. The gid is the half
      # that matters here: the bundle is written 0640 owned by that group, so joining any other group
      # lets nginx traverse the directory and still fail to read the file.
      - "10001"
    volumes:
      - tlsdata:/etc/nginx/certs:ro
    ports:
      # Container port is 8080 whether or not TLS is on — only the scheme changes, so nothing here
      # has to track a moving port. The host port is the one that moved: 3000 → 443.
      - "${YAGRA_WEB_PORT:-443}:8080"
    restart: unless-stopped

  # ── Stores (persistent data lives here; preserved across upgrades) ──
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yagra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yagra}
      POSTGRES_DB: yagra
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # ── The bus (ADR-003), and the switch that lets remote sites reach it (ADR-065) ──────────────
  #
  # DEFAULT: plaintext on the internal Docker network, published on loopback only. Nothing that
  # matters crosses a host boundary, so nothing needs encrypting.
  #
  # To accept pollers from REMOTE sites, use **Settings ▸ Pollers ▸ Remote pollers** in the WebUI.
  # Do not hand-edit this service. Everything below is driven by variables the updater sidecar
  # writes into `.env`, and that is the whole design:
  #
  #   * **This file is replaced on every upgrade** with the copy inside the target image (ADR-050
  #     decision 5). Hand edits here do not survive it — and the way they fail is the worst kind:
  #     the central stack keeps working, and every remote poller silently stops connecting. `.env`
  #     IS preserved, so a switch expressed as variables survives.
  #   * **The certificate and this server's configuration come from `bus-cert-init` above**, not
  #     from a bind mount of a git checkout. The previous procedure mounted
  #     `./docker/nats/nats-server.conf`, which is absent from published images: Docker creates an
  #     empty DIRECTORY at a missing bind-mount source, nats is handed a directory as its `-c`
  #     argument, and the bus fails to start.
  #
  # What the switch sets, for a deployment that has to do it from a shell (all in `.env`):
  #   YAGRA_NATS_ARGS=-js -c /etc/nats/nats-server.conf   load the TLS + auth configuration
  #   YAGRA_NATS_BIND=0.0.0.0                             publish the bus port off-host
  #   YAGRA_NATS_CORE_PASSWORD / YAGRA_NATS_POLLER_PASSWORD
  #   YAGRA_CORE_BUS_URL=tls://core:<core pw>@nats:4222
  #   YAGRA_POLLER_BUS_URL=tls://poller:<poller pw>@nats:4222
  #   YAGRA_BUS_CA_FILE=/etc/nats/certs/server-cert.pem
  # Server-wide TLS leaves no plaintext port, which is why the last three are not optional: the
  # co-located core and poller move to `tls://` in the same change.
  #
  # Per-poller credential scoping (ADR-030) comes with it and needs no step of its own: the same
  # `YAGRA_NATS_POLLER_PASSWORD` makes core answer Auth Callout requests, and the account key it
  # signs with is generated on first start and kept sealed in PostgreSQL. A compromised site then
  # reads only its OWN pool's device credentials, not the fleet's. Until v0.3.2 this was four manual
  # steps ending in an edit to nats-server.conf that the next `up` erased, so it had never run.
  nats:
    image: nats:2-alpine
    # `-js` alone = JetStream on a plaintext bus. The switch appends `-c /etc/nats/nats-server.conf`.
    # A string rather than a list because compose substitutes variables into a string and then
    # word-splits it; a list entry would arrive as one argument containing spaces.
    command: ${YAGRA_NATS_ARGS:--js}
    depends_on:
      # The certificate and the configuration have to be on the volume before this reads them. With
      # TLS off it costs one already-satisfied wait; with TLS on it is what stops nats from starting
      # against an empty directory.
      bus-cert-init: { condition: service_completed_successfully }
    environment:
      # Referenced by the shipped configuration. nats-server EXITS on a referenced-and-unset
      # variable (fail-closed — it never starts with an anonymous password), so these carry
      # placeholder defaults that are only ever *used* once the switch has replaced them: with
      # `-c` absent the configuration is not read at all, so the value is inert.
      YAGRA_NATS_CORE_PASSWORD: ${YAGRA_NATS_CORE_PASSWORD:-bus-disabled}
      YAGRA_NATS_POLLER_PASSWORD: ${YAGRA_NATS_POLLER_PASSWORD:-bus-disabled}
      # 🚨 There is deliberately no YAGRA_NATS_CALLOUT_ISSUER here any more (ADR-065 Inc.7). The
      # account public key is written as a literal into `callout.conf` on the bus volume, by the
      # same one-shot and the same run that writes nats-server.conf. Through `.env` it would be one
      # value two files must agree about across an upgrade — and the default above was the EMPTY
      # STRING rather than unset, so a deployment that upgraded into an `auth_callout` block would
      # have handed nats-server an empty issuer to parse and lost the bus.
    # nats runs as uid 1000 and the private key on the bus volume is 0640 owned by core's uid 10001,
    # so it reads the key as a supplementary group member — the same mechanism `web` uses for the
    # WebUI certificate, and for the same reason. See `bus-init` above for who arranges the volume.
    group_add:
      - "10001"
    volumes:
      - buscerts:/etc/nats:ro
    ports:
      # Loopback by default: reachable for a `nats` CLI on this host and off the network. The switch
      # sets YAGRA_NATS_BIND=0.0.0.0, and it does that *together* with TLS + auth — the bus carries
      # plaintext device credentials (ADR-020), so publishing it without them is the one combination
      # that must not be reachable by editing a single variable.
      - "${YAGRA_NATS_BIND:-127.0.0.1}:${YAGRA_NATS_PORT:-4222}:4222"
    restart: unless-stopped

  victoriametrics:
    # Pinned, not `:latest` — this holds the metrics history, and ADR-017 makes "an upgrade must
    # never lose or corrupt data" a top-tier policy. The deploy job pulls on every push to main, so
    # a floating tag would silently roll the storage engine on an unrelated code deploy. Bump this
    # deliberately, with a backup.
    image: victoriametrics/victoria-metrics:v1.148.0
    # Retention (months). This flag is the ONLY way to change it: VictoriaMetrics has no runtime
    # retention API, so Yagra reports this value (read back from /flags) but cannot set it —
    # ADR-040. Edit here, then `up -d victoriametrics` to recreate just this container.
    command: ["--retentionPeriod=12"]
    volumes:
      - vmdata:/victoria-metrics-data
    restart: unless-stopped

  # Event log store — VictoriaLogs (ADR-024): full passive-event firehose for full-text search,
  # 30-day retention. The 90-day must-preserve subset is the alert-linked rows in PostgreSQL.
  victorialogs:
    # Pinned for the same reason as victoriametrics above.
    image: victoriametrics/victoria-logs:v1.52.0
    # As with victoriametrics: this flag is the only way to change retention (no runtime API), so
    # Yagra reports it from /flags but cannot set it (ADR-040).
    command: ["-retentionPeriod=30d", "-storageDataPath=/victoria-logs-data"]
    volumes:
      - vldata:/victoria-logs-data
    restart: unless-stopped

  # Flow store — ClickHouse (ADR-031, the 5th store). Edge-aggregated NetFlow/IPFIX records with a
  # 1-month TTL (loss-tolerant tier). core creates the schema on startup and writes over HTTP :8123.
  # Internal only. I/O + page-cache heavy — split onto a dedicated node at scale (URL change only).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
    # Bound ClickHouse's OWN telemetry (ADR-031 Increment 4). Stock ClickHouse logs at `trace` and
    # gives its nine `system.*_log` tables no TTL, so they grow forever and it burns CPU merging
    # them — measured after a month on one deployment: 49 MiB of flow data against 2.3 GiB /
    # ~693M rows of self-telemetry, ~1/3 of a core, and the top log producers were the merges of
    # those very tables. A feedback loop with nothing bounding it.
    #
    # ⚠️ A `configs:` entry, NOT a named volume mounted at config.d. Docker seeds an empty named
    # volume from whichever container mounts it first, and the image ships
    # `config.d/docker_related_config.xml` — which is what sets `listen_host`. Wiping that leaves
    # ClickHouse listening on loopback only, i.e. the flow store silently unreachable. A `configs:`
    # entry lands one file and leaves the directory alone. It also needs no checkout on the host.
    configs:
      - source: clickhouse-telemetry
        target: /etc/clickhouse-server/config.d/yagra-telemetry.xml
    restart: unless-stopped

  # IP→ASN dataset updater (ADR-031) — keeps the offline enrichment table fresh, entirely in Docker
  # (no host cron / host path). Periodically fetches the public-domain iptoasn.com TSV into the shared
  # `ipasndata` volume with an atomic write; core mounts the same volume read-only and hot-reloads it
  # (YAGRA_IPASN_RELOAD_SECS) with no restart. This container is the ONLY component that reaches the
  # internet for enrichment — core never does. Air-gapped / no enrichment? Remove this service (and
  # unset YAGRA_IPASN_DB on core). Tune cadence via YAGRA_IPASN_REFRESH_SECS (default weekly); it also
  # fetches once on start. $$ escapes keep the shell vars for the container, not compose.
  ipasn-updater:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      YAGRA_IPASN_REFRESH_SECS: ${YAGRA_IPASN_REFRESH_SECS:-604800}
      YAGRA_IPASN_URL: ${YAGRA_IPASN_URL:-https://iptoasn.com/data/ip2asn-combined.tsv.gz}
    volumes:
      - ipasndata:/data/ipasn
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1 || true
        while true; do
          echo "ipasn-updater: fetching $$YAGRA_IPASN_URL"
          if curl -fsSL "$$YAGRA_IPASN_URL" | gunzip > /data/ipasn/ip2asn.tsv.tmp && [ -s /data/ipasn/ip2asn.tsv.tmp ]; then
            mv /data/ipasn/ip2asn.tsv.tmp /data/ipasn/ip2asn.tsv
            echo "ipasn-updater: wrote $$(wc -l < /data/ipasn/ip2asn.tsv) rows"
          else
            echo "ipasn-updater: fetch failed — keeping previous"; rm -f /data/ipasn/ip2asn.tsv.tmp
          fi
          sleep "$$YAGRA_IPASN_REFRESH_SECS"
        done

  # ── Upgrade executor (ADR-050) — ON by default. Read this block before changing it. ────────────
  #
  # This container holds the Docker socket, and therefore root on this host. That is the feature,
  # not a side effect: it is what lets an operator upgrade Yagra from the WebUI on a network with no
  # shell access (ADR-045's production premise). It also creates a path from Yagra's Admin role to
  # host root that does not otherwise exist.
  #
  # What bounds it:
  #   * core does NOT get the socket. Two ADRs rejected that (ADR-040, ADR-044) and this does not
  #     overturn them — it changes who holds it, exactly as `ipasn-updater` above holds the only
  #     outbound network path.
  #   * The image repository is fixed HERE, in the host's environment. It cannot be set over the
  #     API, so no request can name a different registry: an Admin can install a tag we published
  #     and nothing else.
  #   * The only commands are apply and bundle. The request file is `key=value`, every value is
  #     regex-checked before use, and it is never `.`-sourced or eval'd.
  #   * NOTHING IN THE SHARED VOLUME IS EXECUTED, and that is load-bearing. core can write into
  #     that volume — it must, since a request is a file — so anything executable there would be
  #     core's to rewrite, and this runs it as root. The apply procedure is therefore held in a
  #     variable and passed to the throwaway container as an argument. Keep it that way.
  #   * The apply work runs in a THROWAWAY container outside this compose project, because
  #     `docker compose up -d` would otherwise recreate this very container mid-operation.
  #   * `bundle` — installing an uploaded `docker save` archive — is off even though this service is
  #     on, and needs YAGRA_UPGRADE_ALLOW_BUNDLE=1. See the note above the variable.
  #
  # Turning it off. Two ways, and they are NOT equally durable:
  #   * **Settings ▸ Upgrade has a switch.** Stored in PostgreSQL, so it survives upgrades, and it
  #     is the one an operator with no shell can actually reach. Off means no upgrade can be
  #     requested and this container makes no outbound call — but it still holds the socket.
  #   * **Deleting this service** removes the capability structurally. Note that it comes BACK on
  #     the next upgrade: the composition is taken from the target image (ADR-050 decision 5), so a
  #     local deletion is undone by the very mechanism it was meant to remove. A deployment that
  #     wants it gone for good belongs on the command-line upgrade path.
  yagra-updater:
    image: docker:28-cli
    restart: unless-stopped
    # Root, because it must use the socket and chown the hand-off directory. The group only matters
    # if you move the uid off 0 (measured: the socket is root:docker and root reaches it whatever
    # the gid says) — set YAGRA_DOCKER_GID in .env if you do.
    user: "0:${YAGRA_DOCKER_GID:-0}"
    environment:
      # Its own variable, deliberately NOT ${YAGRA_IMAGE_REPO}. Where releases live is not where
      # this deployment's current images came from: a development box pulls SHA-tagged builds from
      # a private registry, and inheriting that pointed the release picker at a registry holding no
      # releases at all (measured on the test server, where /flashdeploy sets it to localhost:5000).
      # Fixed here in the host's environment either way, so no request can name a registry.
      YAGRA_UPGRADE_REPO: ${YAGRA_UPGRADE_REPO:-ghcr.io/horryworks}
      # Daily. The list only fills a picker, so checking more often buys nothing — and a monitoring
      # product should not reach out to a registry more than it needs to. Switching the mechanism
      # off in the WebUI stops this call entirely.
      YAGRA_UPGRADE_CHECK_SECS: ${YAGRA_UPGRADE_CHECK_SECS:-86400}
      # Accept an image archive uploaded through the WebUI (ADR-050 Increment 3). For a site with
      # NO registry reachable at all: the operator runs `docker save` where the images are, and
      # uploads the tar. Set it to 1 only if that is your situation — `docker load` installs
      # whatever the archive contains, including images this file never mentions, so this widens
      # the Admin-to-host-root path from "some published tag of our three images" to "any image".
      # It is deliberately NOT settable from the WebUI: the UI may move within the capability this
      # host granted, never widen it.
      # Everything after the load is unchanged: same backup, same composition swap, same
      # provenance check, and the archive must contain the tag the operator claimed.
      YAGRA_UPGRADE_ALLOW_BUNDLE: ${YAGRA_UPGRADE_ALLOW_BUNDLE:-0}
      # Free space an apply demands before it writes anything (ADR-050 decision 15). 3 GiB by
      # default: a release is roughly 133 MiB of compressed layers that unpack larger, the
      # pre-upgrade backup is a full PostgreSQL dump plus a VictoriaMetrics snapshot beside it, and
      # both land on this host.
      #
      # 🚨 The order is what this fixes, not the arithmetic. The backup runs FIRST, so without this
      # check a host that is already full gets several hundred MB written onto it and *then* fails
      # the pull — Yagra's own recovery step making the condition worse. Measured 2026-09-04 on a
      # GCP test deployment: v0.2.17 → v0.3.0 died at `pull` with a 100% full disk.
      YAGRA_UPGRADE_MIN_FREE_BYTES: ${YAGRA_UPGRADE_MIN_FREE_BYTES:-3221225472}
      # How many releases to keep behind the one being installed (ADR-050 decision 17). Applies to
      # this repository's three images and to the pre-upgrade backup directories; nothing else on
      # the host is touched.
      #
      # 1 is the default because 1 is what the WebUI offers: the Upgrade page's "go back" is a
      # single hop to the release you came from, and that hop must not need a re-download. Going
      # back further is already a manual operation (decision 10) and may re-pull. Raise it on a
      # closed network where a re-pull is impossible; `0` keeps only the release now installed.
      #
      # ⚠️ Never fewer than one backup is kept whatever this says — the newest one is the one this
      # very upgrade just took, and deleting that would remove the only rollback aid for the
      # version now running.
      YAGRA_UPGRADE_KEEP_RELEASES: ${YAGRA_UPGRADE_KEEP_RELEASES:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - upgradedata:/data/upgrade
    command:
      - sh
      - -c
      - |
        set -eu
        D=/data/upgrade
        mkdir -p "$$D/bundle"
        # core runs as uid 10001 and must be able to write the request file and, when archives are
        # allowed, stream one into $$D/bundle. Safe only because nothing here is ever executed.
        chown -R 10001:10001 "$$D" 2>/dev/null || true
        REPO="$${YAGRA_UPGRADE_REPO:-ghcr.io/horryworks}"
        IVL="$${YAGRA_UPGRADE_CHECK_SECS:-86400}"
        ALLOW="$${YAGRA_UPGRADE_ALLOW_BUNDLE:-0}"
        # Read here and handed to the apply container explicitly (ADR-050 Inc.4). Same reason
        # `REPO` is: the throwaway container inherits nothing, so a value this service was
        # configured with has to travel as an argument or it silently becomes the default.
        MINFREE_CFG="$${YAGRA_UPGRADE_MIN_FREE_BYTES:-3221225472}"
        KEEP_CFG="$${YAGRA_UPGRADE_KEEP_RELEASES:-1}"
        SELF="$$(hostname)"
        label() { docker inspect -f "{{index .Config.Labels \"$$1\"}}" "$$SELF" 2>/dev/null || true; }
        PROJ="$$(label com.docker.compose.project)"
        WORKDIR="$$(label com.docker.compose.project.working_dir)"
        : "$${PROJ:=yagra}"

        # The operator's switch. core materialises it here from PostgreSQL, which is the source of
        # truth — so wiping this volume cannot silently re-enable anything, and the setting survives
        # an upgrade. Absent means enabled: that is the column's default, and a fresh volume must
        # not read as paused.
        paused() { [ "$$(sed -n 's/^enabled=//p' "$$D/settings" 2>/dev/null | head -1)" = "0" ]; }

        # The apply procedure. Held in a VARIABLE and passed to the throwaway container as an
        # argument — never written to the shared volume, because core can write there and this is
        # executed as root with the socket. Arguments: <tag> <run-id> <requested-by> [archive].
        # With an archive the images come from `docker load` instead of `docker pull`; every other
        # step is identical, which is the whole design of the offline path.
        APPLY=$$(cat <<'APPLY'
        set -u
        TAG="$$1"; RUN="$$2"; BY="$$3"; BUNDLE="$${4:-}"; D=/data/upgrade
        if [ -n "$$BUNDLE" ]; then CMD=bundle; else CMD=apply; fi
        say() { # <state> <step> <message>
          printf '{"id":"%s","command":"%s","target":"%s","state":"%s","step":"%s","message":"%s","started_at":%s,"finished_at":%s,"requested_by":"%s"}\n' \
            "$$RUN" "$$CMD" "$$TAG" "$$1" "$$2" "$$3" "$$START" "$${FIN:-null}" "$$BY" > "$$D/status.json.tmp"
          mv "$$D/status.json.tmp" "$$D/status.json"
          printf '{"at":%s,"step":"%s","message":"%s"}\n' "$$(date +%s)" "$$2" "$$3" >> "$$D/log.ndjson"
        }
        fail() { FIN=$$(date +%s); say failed "$$1" "$$2"; exit 1; }
        # Make a captured command's output safe to put inside `say`'s one-line JSON (decision 16).
        # `status.json` is written by a single `printf` with no encoder behind it, so a stray quote
        # or newline from Docker would not make the message ugly — it would make the file
        # unparseable, and the Upgrade page reads that file to show what went wrong. Backslashes go
        # for the same reason. The tail is what carries the diagnosis (`no space left on device`,
        # `i/o timeout`, `denied`), so this keeps the END of the output, not the beginning.
        sanitize() { tr -d '"\\' | tr '\n\r\t' '   ' | tail -c 240; }

        # What a SUCCEEDED apply leaves behind, and what it takes away (ADR-050 decision 17).
        #
        # 🚨 Before this, nothing on this host was ever removed. The replaced images keep their
        # `:vX.Y.Z` tags, so they are not dangling and `docker image prune` walks straight past
        # them; the pre-upgrade backup directories accumulate one per attempt, failed attempts
        # included. Measured 2026-09-04 from the published manifests: one release is ~133 MiB of
        # compressed layers and a second release adds ~114 MiB of them, because core and poller
        # share **no** layers between releases (CI moved to per-run hosts and `SOURCE_REF`
        # deliberately busts the cache). That is a monotonically growing disk on a machine whose
        # upgrade path stops working when it fills.
        #
        # Called only after step 5 has confirmed the new core is healthy, and only ever
        # best-effort: an upgrade that has already succeeded must not be reported as failed
        # because tidying up did not.
        #
        # ⚠️ **The history file lives in the volume core can write to, and that is safe only
        # because of how it is used.** It is a KEEP list — the tags actually passed to `docker rmi`
        # come from `docker image ls`, never from this file. So the worst a tampered history can
        # do is preserve an image, never delete one. It is still validated line by line, because
        # a keep list of garbage would preserve nothing.
        cleanup() {
          KEEP=$${YAGRA_UPGRADE_KEEP_RELEASES:-1}
          case "$$KEEP" in ''|*[!0-9]*) KEEP=1 ;; esac
          REL='^v[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}(-[0-9a-zA-Z]{1,16})?$$'
          H="$$D/installed_releases"
          # Most recent first. `$$PREV` is included because a host that has never written this file
          # still knows the one release it is entitled to keep — the one it just came from.
          { echo "$$TAG"; [ -n "$$PREV" ] && echo "$$PREV"; cat "$$H" 2>/dev/null; } \
            | grep -E "$$REL" | awk '!seen[$$0]++' | head -40 > "$$H.tmp" \
            && mv "$$H.tmp" "$$H"
          KEEPLIST=$$(head -n $$((KEEP + 1)) "$$H")
          # Only this repository's three images, only release-shaped tags. Never
          # `docker image prune -a`: a verification box or a test host runs other stacks, and
          # this is not the place to decide anything about them. `latest` is left alone for the
          # same reason — it is the composition's own default tag, and it costs nothing anyway
          # (it names an image some release tag already keeps).
          for i in core poller web; do
            docker image ls --format '{{.Tag}}' "$$REPO/yagra-$$i" 2>/dev/null | grep -E "$$REL" | while read -r t; do
              echo "$$KEEPLIST" | grep -qx "$$t" || docker rmi "$$REPO/yagra-$$i:$$t" >/dev/null 2>&1 || true
            done
          done
          # Backups, newest first. At least one is always kept whatever KEEP says: the newest is
          # the one this very run just took, and it is the only rollback aid for the version now
          # installed. The `case` re-anchors each path to the directory this is allowed to touch —
          # `ls` output is not evidence of where a file is.
          #
          # ⚠️ Sorted by NAME, not by `ls -dt`. `yagra-backup.sh` stamps a fixed-width UTC time
          # into the directory name, so lexical order *is* chronological order — and unlike a
          # modification time it cannot be rewritten by a `cp -r`, a restore rehearsal or a
          # filesystem move, any of which would otherwise make the newest backup look oldest and
          # delete it.
          BK=$$KEEP; [ "$$BK" -lt 1 ] && BK=1
          ls -d "$$WORKDIR"/yagra-backup-* 2>/dev/null | sort -r | tail -n +$$((BK + 1)) | while read -r d; do
            case "$$d" in "$$WORKDIR"/yagra-backup-*) rm -rf "$$d" ;; esac
          done
        }
        START=$$(date +%s); FIN=
        say running start "requested by $$BY"

        # 0. The deployment directory, at the path the HOST knows it by — this container has it
        #    bind-mounted at that same path deliberately, and the reason is step 4. `docker compose
        #    up -d` stamps its own working directory into every container it creates
        #    (com.docker.compose.project.working_dir), and the updater reads that label back to find
        #    this directory next time. Mount it anywhere else and the label records a path that
        #    exists only inside a container that is already gone: the first WebUI upgrade that
        #    recreates the updater poisons every upgrade after it. That was not theory — measured on
        #    the test server 2026-08-12, three consecutive applies died here, all reporting "the
        #    pre-upgrade backup failed", because Docker had helpfully created an empty /project on
        #    the host and the backup script found no stack in it.
        #
        #    **Every deployment coming from v0.2.3 or earlier arrives here exactly once, and that is
        #    unavoidable.** The apply that installs a release is executed by the updater of the
        #    release being replaced, so the fix above cannot apply itself to the upgrade that
        #    delivers it — and because that fix changes this very service definition, compose is
        #    guaranteed to recreate the updater during it, which is precisely what stamps the bad
        #    label. So this message is not an edge case: it is the one every existing operator reads.
        #
        #    Two things about the repair, both learned the hard way (2026-08-12, verified with
        #    `docker compose --dry-run` on the test server):
        #      * `--force-recreate yagra-updater` is REQUIRED. A plain `up -d` recreates core, web
        #        and poller — whose image reference changed — and reports the updater as `Running`,
        #        because its definition is unchanged. But `label()` above inspects `$$SELF`, i.e.
        #        THIS container: the only label that matters is the only one a plain `up -d` leaves
        #        alone. The command therefore succeeds and repairs nothing, which is worse than
        #        failing.
        #      * Do NOT tell the operator to run it from `$$WORKDIR`. That is the poisoned path —
        #        the directory that does not hold the compose file is exactly what got us here.
        #        Name the property ("the directory that holds docker-compose.deploy.yml") instead.
        [ -n "$${WORKDIR:-}" ] && [ -f "$$WORKDIR/docker-compose.deploy.yml" ] \
          || fail start "the compose label this reads names $${WORKDIR:-nothing}, which does not hold this deployment's docker-compose.deploy.yml. On the host, from the directory that does, run: docker compose -p $$PROJ -f docker-compose.deploy.yml up -d --force-recreate yagra-updater — a plain 'up -d' will NOT repair it, because this container's definition is unchanged and compose leaves it running with the stale label"

        # 0b. Enough room to do all of this, checked BEFORE anything is written (ADR-050 decision
        #     15). The order is the whole point: step 1 writes a full PostgreSQL dump and a
        #     VictoriaMetrics snapshot onto this host, and step 2 unpacks three images onto it. A
        #     host that is already full therefore gets several hundred MB written to it and *then*
        #     fails — Yagra's own safety step making the situation worse. Measured 2026-09-04 on a
        #     GCP test deployment: v0.2.17 → v0.3.0 died at `pull` with the disk at 100%.
        #
        #     🚨 **Two filesystems, and they are usually but not always the same one.** The backup
        #     lands in $$WORKDIR — a host directory bind-mounted here, so `df` on it reports the
        #     HOST's filesystem. The images land in Docker's storage, which this container cannot
        #     address by host path; but its own writable layer lives there, so `df /` reports it.
        #     Taking the smaller of the two is what makes this true on a host that separates them.
        #
        #     Deliberately a fixed floor rather than a computed requirement: the size of a release
        #     is not knowable until it has been pulled, which is the thing being protected. The
        #     bundle path solves the same problem the other way (`bundle_space_needed`, twice the
        #     declared archive) because there the size arrives with the request.
        MINFREE=$${YAGRA_UPGRADE_MIN_FREE_BYTES:-3221225472}
        # 🚨 A non-numeric value falls back to the floor rather than reaching the arithmetic below,
        # the same guard `cleanup`'s KEEP carries and for a worse reason. `$$(( ))` resolves a bare
        # word as a variable name, so under `set -u` a `.env` carrying `3g` or a typo does not
        # weaken this check — it aborts the apply script here, BEFORE any `fail`, which leaves
        # `status.json` saying `running` and the Upgrade page waiting on a run that is already gone.
        # Falling back to the default keeps the check ON, which is the safe direction: an operator
        # who meant 3 GiB and wrote `3g` gets what they meant.
        case "$$MINFREE" in ''|*[!0-9]*) MINFREE=3221225472 ;; esac
        # The numeric guard in the awk is what makes "could not measure" distinguishable from
        # "zero free" — a `df` that prints nothing, prints a header only, or wraps a long device
        # name yields no value rather than a 0 that would look like a full disk.
        free_kb() { df -P -k "$$1" 2>/dev/null | awk 'NR==2 && $$4 ~ /^[0-9]+$$/ {print $$4}'; }
        FREE_KB=
        for p in / "$$WORKDIR"; do
          V=$$(free_kb "$$p")
          [ -n "$$V" ] || continue
          { [ -z "$$FREE_KB" ] || [ "$$V" -lt "$$FREE_KB" ]; } && FREE_KB=$$V
        done
        # `0` switches the check off for an operator who knows their host better than this floor
        # does. Anything else is compared in kibibytes, because that is what `df -k` speaks.
        #
        # ⚠️ **An unmeasurable host proceeds.** `df` answering nothing is not evidence of a full
        # disk, and a check that cannot measure must not become the thing that stops every upgrade
        # on that host — that would be a worse failure than the one this exists to prevent. It is
        # said out loud instead, so the run's log carries the fact that nothing was checked.
        if [ -z "$$FREE_KB" ]; then
          say running start "could not measure free disk space on this host; continuing without the check"
        elif [ "$$MINFREE" != "0" ]; then
          NEED_KB=$$((MINFREE / 1024))
          [ "$$FREE_KB" -ge "$$NEED_KB" ] \
            || fail start "not enough free disk space to upgrade safely: $$((FREE_KB / 1024)) MB free, $$((NEED_KB / 1024)) MB needed. Nothing has been written and this deployment is untouched. Free space on the host, then try again — old release images and old yagra-backup-* directories in the deployment directory are the usual candidates. Set YAGRA_UPGRADE_MIN_FREE_BYTES in .env to change the floor, or 0 to skip this check"
        fi

        # The release this host is on right now, read off the running core rather than assumed. It
        # is what decision 17's cleanup keeps, and it has to be captured HERE: after step 4 the
        # container it comes from no longer exists. A tag that does not look like a release (a
        # development build, a digest pin) is dropped rather than trusted — the cleanup would
        # otherwise protect a name it cannot reason about, or worse, pass it to `docker rmi`.
        PREV=$$(docker inspect -f '{{.Config.Image}}' "$$(docker ps -q -f "label=com.docker.compose.project=$$PROJ" -f "label=com.docker.compose.service=core" | head -1)" 2>/dev/null || true)
        PREV=$${PREV##*:}
        echo "$$PREV" | grep -Eq '^v[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}(-[0-9a-zA-Z]{1,16})?$$' || PREV=

        # 1. Back up first, using the procedure of record (ADR-040) rather than a second copy of
        #    it. The script ships inside the RUNNING core image at a root-owned path, so core
        #    cannot alter it and the backup matches the version being replaced. NOTE: this is a
        #    rollback aid, not a disaster-recovery backup — it lands beside the database it protects.
        say running backup "backing up before touching anything"
        CORE_CID=$$(docker ps -q -f "label=com.docker.compose.project=$$PROJ" -f "label=com.docker.compose.service=core" | head -1)
        [ -n "$$CORE_CID" ] || fail backup "cannot find the running core container"
        docker cp "$$CORE_CID:/usr/share/yagra/yagra-backup.sh" /tmp/backup.sh 2>/dev/null \
          || fail backup "this core image ships no backup script; upgrade from the command line"
        ( cd "$$WORKDIR" && sh /tmp/backup.sh ) || fail backup "the pre-upgrade backup failed"

        # 2. Get all three images in place BEFORE anything is stopped, so a bad tag, an
        #    unreachable registry or a corrupt archive costs nothing.
        if [ -n "$$BUNDLE" ]; then
          say running pull "loading images from the uploaded archive"
          [ -f "$$BUNDLE" ] || fail pull "the uploaded archive is gone"
          # Deleted either way, and immediately: it is a gigabyte, the load has just written its
          # contents a second time, and there is no way to inspect a bad archive from the WebUI.
          docker load -i "$$BUNDLE" >/tmp/err 2>&1 || { rm -f "$$BUNDLE"; fail pull "the uploaded archive could not be read as a docker save file: $$(sanitize < /tmp/err)"; }
          rm -f "$$BUNDLE"
          # The operator NAMED a version, and this is what makes the name true. `docker load`
          # restores whatever tags the archive happens to carry, so without this an archive of a
          # different release would either be installed under the label the operator expected or
          # leave the composition pointing at images that are not on the host.
          for i in core poller web; do
            docker image inspect "$$REPO/yagra-$$i:$$TAG" >/dev/null 2>&1 \
              || fail pull "the archive does not contain $$REPO/yagra-$$i:$$TAG"
          done
        else
          say running pull "pulling $$TAG"
          # 🚨 **The output is kept, and that is decision 16.** This used to end in
          # `>/dev/null 2>&1`, so the one line an operator ever saw was "cannot pull
          # yagra-core:vX" — identical whether the disk was full, the daemon had no route to the
          # registry, the credentials were refused or the host's architecture was not published.
          # And the reason was unrecoverable afterwards as well: this procedure runs in a
          # `docker run --rm` container, so its own log is deleted the moment it exits, and
          # `log.ndjson` only ever held the same terse line. Measured 2026-09-04 on a GCP test
          # deployment — diagnosing a full disk needed the operator to reproduce the pull by hand.
          for i in core poller web; do
            docker pull "$$REPO/yagra-$$i:$$TAG" >/tmp/err 2>&1 \
              || fail pull "cannot pull yagra-$$i:$$TAG — $$(sanitize < /tmp/err)"
          done
        fi

        # 3. Take the compose file OUT OF THE TARGET IMAGE (ADR-050 decision 5) so the composition
        #    and the images are always the same version. The host's .env is never touched.
        say running compose "installing the $$TAG composition"
        CID=$$(docker create "$$REPO/yagra-core:$$TAG" 2>/tmp/err) || fail compose "cannot stage the target image: $$(sanitize < /tmp/err)"
        docker cp "$$CID:/usr/share/yagra/docker-compose.deploy.yml" "$$WORKDIR/docker-compose.deploy.yml" \
          || { docker rm "$$CID" >/dev/null 2>&1; fail compose "the target image ships no compose file"; }
        docker rm "$$CID" >/dev/null 2>&1 || true

        # 4. Recreate. Two variables are passed explicitly and both are load-bearing: `-p` because
        #    compose otherwise derives the project from the directory name, forks a second empty
        #    stack and orphans the real volumes; YAGRA_IMAGE_REPO because the composition would
        #    otherwise resolve it from the host's .env, which can name a different registry from
        #    the one these images were just fetched from.
        say running compose "recreating containers"
        ( cd "$$WORKDIR" && YAGRA_IMAGE_REPO="$$REPO" YAGRA_IMAGE_TAG="$$TAG" docker compose -p "$$PROJ" -f docker-compose.deploy.yml up -d ) >/tmp/err 2>&1 \
          || fail compose "docker compose up failed; the previous images are still on this host — $$(sanitize < /tmp/err)"

        # 5. Verify the thing that is actually running — not that a command returned 0. A green
        #    pipeline has shipped a stale binary in this project before (ADR-036), so the check is
        #    the running container's own provenance marker, not the tag we asked for.
        say running verify "waiting for core to come back"
        i=0
        while [ $$i -lt 60 ]; do
          NEW=$$(docker ps -q -f "label=com.docker.compose.project=$$PROJ" -f "label=com.docker.compose.service=core" | head -1)
          if [ -n "$$NEW" ] && docker exec "$$NEW" yagra-core healthcheck >/dev/null 2>&1; then
            REF=$$(docker exec "$$NEW" cat /etc/yagra-source-ref 2>/dev/null || echo unknown)
            PROF=$$(docker exec "$$NEW" cat /etc/yagra-build-profile 2>/dev/null || echo unknown)
            # Reported BEFORE the tidy-up, so the Upgrade page stops saying "working" the moment
            # the upgrade is actually done. Step 6 changes nothing an operator is waiting on.
            FIN=$$(date +%s); say succeeded verify "now running $$TAG ($$PROF, $$REF)"
            # 6. Make room for the next one (decision 17). Best effort, after success only.
            cleanup
            exit 0
          fi
          i=$$((i+1)); sleep 5
        done
        fail verify "core did not become healthy within 5 minutes; it may still be starting"
        APPLY
        )

        # Turn remote-poller acceptance on or off (ADR-065). Rewrites an ALLOW-LISTED set of keys in
        # the host's `.env` and recreates the services that read them.
        #
        # Held in a VARIABLE and passed to a throwaway container as an argument, for the same two
        # reasons APPLY is — and the second one is why this moved out of the updater's own body.
        # Nothing executable may live in the shared volume core can write to; and **the deployment
        # directory is a host path this updater cannot see.** `set_env` wrote into it and the
        # compose call ran from it, out of a container that mounts neither, so the `bus` command was
        # structurally guaranteed to be refused and had never once succeeded since it shipped
        # (measured on 192.168.1.211, 2026-08-25: 202 accepted, then `rejected` at `validate`).
        # The apply below already had the answer — the third `-v` — and only this path lacked it.
        #
        # Arguments: <mode> <run id> <requested by> [core password] [poller password].
        BUS=$$(cat <<'BUS'
        set -u
        MODE="$$1"; RUN="$$2"; BY="$$3"; CPW="$${4:-}"; PPW="$${5:-}"; D=/data/upgrade
        START=$$(date +%s)
        # One writer for both outcomes, because this command has exactly two. `settle_finished_run`
        # on the core that comes back is what turns either into an audit row and closes the
        # maintenance window core opened before the request was written.
        settle() { # <state> <message>
          printf '{"id":"%s","command":"bus","target":null,"state":"%s","step":"compose","message":"%s","started_at":%s,"finished_at":%s,"requested_by":"%s"}\n' \
            "$$RUN" "$$1" "$$2" "$$START" "$$(date +%s)" "$$BY" > "$$D/status.json.tmp"
          mv "$$D/status.json.tmp" "$$D/status.json"
          printf '{"at":%s,"step":"compose","message":"%s"}\n' "$$(date +%s)" "$$2" >> "$$D/log.ndjson"
        }

        # Step 0 of APPLY, for the same reason and with the same repair: the deployment directory is
        # bind-mounted here at the path the HOST knows it by, and everything below addresses it there.
        [ -f "$$WORKDIR/docker-compose.deploy.yml" ] \
          || { settle failed "the compose label this reads names $${WORKDIR:-nothing}, which does not hold this deployment's docker-compose.deploy.yml. On the host, from the directory that does, run: docker compose -p $$PROJ -f docker-compose.deploy.yml up -d --force-recreate yagra-updater — a plain 'up -d' will NOT repair it, because that container's definition is unchanged and compose leaves it running with the stale label"; exit 1; }

        # The allow-list is the security property, not a tidiness measure. core writes the request
        # file, so "write any line into .env" would be "core can set any variable in this
        # composition", which is a wider capability than ADR-051 grants — the whole design there is
        # that core names a value and never a mechanism. Every key written here is spelled out
        # below; nothing from the request file becomes a key.
        # ⚠️ **`cp -p` first, and it is not tidiness.** This file holds POSTGRES_PASSWORD and, three
        # lines below, both bus passwords. `mv` carries the temp file's mode and owner onto it, so
        # without seeding them the rewrite lands whatever this container's umask says — measured
        # 2026-08-25 on 192.168.1.211, the first time this code ever ran: `0600 ubuntu:ubuntu`
        # became `0644 root:root`, i.e. every account on the host could read all three. The `mv`
        # stays regardless: rewriting in place would be non-atomic, and a deployment whose `.env`
        # was truncated mid-write has lost POSTGRES_PASSWORD and does not come back.
        set_env() { # <key> <value>  — replace or append, atomically, preserving mode and owner
          E="$$WORKDIR/.env"
          [ -f "$$E" ] || { : > "$$E"; chmod 600 "$$E"; }
          cp -p "$$E" "$$E.tmp"
          grep -v "^$$1=" "$$E" > "$$E.tmp" 2>/dev/null || true
          [ -n "$$2" ] && printf '%s=%s\n' "$$1" "$$2" >> "$$E.tmp"
          mv "$$E.tmp" "$$E"
        }
        if [ "$$MODE" = "on" ]; then
          set_env YAGRA_NATS_ARGS "-js -c /etc/nats/nats-server.conf"
          set_env YAGRA_NATS_BIND "0.0.0.0"
          set_env YAGRA_NATS_CORE_PASSWORD "$$CPW"
          set_env YAGRA_NATS_POLLER_PASSWORD "$$PPW"
          set_env YAGRA_CORE_BUS_URL "tls://core:$$CPW@nats:4222"
          set_env YAGRA_POLLER_BUS_URL "tls://poller:$$PPW@nats:4222"
          set_env YAGRA_BUS_CA_FILE "/etc/nats/certs/server-cert.pem"
        else
          # Cleared rather than set to a plaintext value: the compose file already carries the
          # right defaults, so removing the line is what returns this deployment to them. Setting
          # them here would be a second copy of those defaults, in a file no upgrade replaces.
          for k in YAGRA_NATS_ARGS YAGRA_NATS_BIND YAGRA_NATS_CORE_PASSWORD \
                   YAGRA_NATS_POLLER_PASSWORD YAGRA_CORE_BUS_URL YAGRA_POLLER_BUS_URL \
                   YAGRA_BUS_CA_FILE; do
            set_env "$$k" ""
          done
        fi

        # The services that read those variables — **and `web`, which does not.**
        #
        # 🚨 `web` is here because nginx resolves `proxy_pass http://core:8080` **once, at startup**,
        # and there is no `resolver` directive to make it look again. Recreating core gives it a new
        # container address, so a `web` left running keeps dialling the old one and answers 502 to
        # every API call — while serving the page itself perfectly. Measured on 192.168.1.211,
        # 2026-08-25: core moved to 172.18.0.6, nginx kept 172.18.0.11, and the operator who had
        # just been told the switch succeeded had a WebUI that could not log in.
        #
        # A `resolver 127.0.0.11` in the nginx configuration would fix the general case, and this
        # does not attempt it: it is the whole request path for every deployment, and this is the
        # only place in the product that recreates core without recreating web (an apply changes
        # every image tag, so compose recreates web there anyway).
        #
        # A bare `up -d` is survivable now that this runs outside the compose project, but it would
        # still restart every store for a change none of them read.
        ( cd "$$WORKDIR" && docker compose -p "$$PROJ" -f docker-compose.deploy.yml up -d bus-init bus-cert-init nats core poller web ) \
          || { settle failed "docker compose up failed; the previous bus settings are still in .env"; exit 1; }
        if [ "$$MODE" = "on" ]; then WHAT=accepted; else WHAT=refused; fi
        settle succeeded "remote pollers are now $$WHAT"
        BUS
        )

        # Poller ids in this updater's own compose project — the ones an apply recreates on its way
        # past, because they are in the same `up -d` (ADR-051). Core cannot work this out for itself:
        # nothing on the bus says which compose project a poller belongs to, so without this it must
        # either warn that a co-located poller "will be left behind" (false on the commonest
        # deployment there is) or refuse a two-release jump over a skew that resolves inside the same
        # run. A poller's id is `YAGRA_POLLER_ID` if set, else its container hostname — so read the
        # env first and fall back, mirroring the poller's own resolution order.
        local_pollers() {
          for c in $$(docker compose -p "$$PROJ" ps -q poller 2>/dev/null); do
            PID=$$(docker inspect -f '{{range .Config.Env}}{{if eq (index (split . "=") 0) "YAGRA_POLLER_ID"}}{{index (split . "=") 1}}{{end}}{{end}}' "$$c" 2>/dev/null)
            [ -z "$$PID" ] && PID=$$(docker inspect -f '{{.Config.Hostname}}' "$$c" 2>/dev/null)
            [ -n "$$PID" ] && printf '"%s",' "$$PID"
          done | sed 's/,$$//'
        }

        # The heartbeat is how core learns what this updater will do: `allow_bundle` and `paused`
        # are reported, never assumed, so the capability is declared by the container that holds
        # the socket rather than inferred by the one that does not. It keeps beating while paused —
        # "switched off" and "died" must not look the same on the page.
        heartbeat() {
          if [ "$$ALLOW" = "1" ]; then AB=true; else AB=false; fi
          if paused; then PS=true; else PS=false; fi
          LP=$$(local_pollers)
          printf '{"written_at":%s,"repo":"%s","check_interval_secs":%s,"allow_bundle":%s,"paused":%s,"local_pollers":[%s]}\n' "$$(date +%s)" "$$REPO" "$$IVL" "$$AB" "$$PS" "$$LP" > "$$D/current.json.tmp"
          mv "$$D/current.json.tmp" "$$D/current.json"
        }

        # Best effort by design: an air-gapped site has no registry to list, and the operator can
        # still name a tag by hand. A failure here is reported, never fatal.
        list_releases() {
          NAME="$${REPO#*/}/yagra-core"
          TOK=$$(wget -qO- "https://ghcr.io/token?scope=repository:$$NAME:pull&service=ghcr.io" 2>/dev/null \
                 | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          # `n=1000` is load-bearing, not tidiness. The default page is 100 tags and this repository
          # publishes an immutable :<sha> tag with every release, so the version tags are a small
          # minority of the list and GHCR's ordering pushes them off the first page. Measured
          # 2026-08-11: the default page yielded exactly ONE version tag — v0.1.0, the oldest — so
          # the picker offered a single downgrade to the first release ever published. With n=1000
          # the same request returns all 26.
          TAGS=$$(wget -qO- --header="Authorization: Bearer $$TOK" "https://ghcr.io/v2/$$NAME/tags/list?n=1000" 2>/dev/null \
                  | tr ',' '\n' | sed -n 's/.*"\(v[0-9][0-9.]*[0-9a-z-]*\)".*/\1/p' | sort -Vr | head -20)
          if [ -z "$$TAGS" ]; then
            printf '{"written_at":%s,"releases":[],"error":"could not reach the registry"}\n' "$$(date +%s)" > "$$D/available.json.tmp"
          else
            ITEMS=$$(for t in $$TAGS; do printf '{"tag":"%s","core_digest":null},' "$$t"; done | sed 's/,$$//')
            printf '{"written_at":%s,"releases":[%s],"error":null}\n' "$$(date +%s)" "$$ITEMS" > "$$D/available.json.tmp"
          fi
          mv "$$D/available.json.tmp" "$$D/available.json"
        }

        # Read one field out of the request file WITHOUT sourcing it. Sourcing would turn write
        # access to this volume into code execution.
        field() { sed -n "s/^$$1=//p" "$$D/request" | head -1; }

        # Only ever called with a command this script recognised, so nothing unvalidated from the
        # request file is interpolated into the JSON.
        reject() {
          printf '{"id":"%s","command":"%s","target":null,"state":"rejected","step":"validate","message":"%s","started_at":%s,"finished_at":%s,"requested_by":null}\n' \
            "$${1:-unknown}" "$${CMDSAFE:-unknown}" "$$2" "$$(date +%s)" "$$(date +%s)" > "$$D/status.json.tmp"
          mv "$$D/status.json.tmp" "$$D/status.json"
        }

        handle() {
          SCHEMA=$$(field schema); ID=$$(field id); CMD=$$(field command)
          TAG=$$(field tag); BY=$$(field requested_by)
          BUSMODE=$$(field bus_mode)
          BUSCPW=$$(field bus_core_password); BUSPPW=$$(field bus_poller_password)
          rm -f "$$D/request"
          CMDSAFE=unknown; BUNDLE=
          # An upgrade replaces core but NOT this container, so a new core paired with an old
          # updater is structural. Refuse clearly rather than half-executing a misread request.
          [ "$$SCHEMA" = "1" ] || { reject "$$ID" "this updater is older than the core that made the request; update it by hand"; return; }
          # Checked before anything uses it — an archive's path is built from it below.
          echo "$$ID" | grep -Eq '^[0-9a-f-]{36}$$' || { reject unknown "malformed run id"; return; }
          # The command set, mirroring `Command::as_str()` in crates/yagra-core/src/upgrade.rs;
          # `every_command_is_accepted_by_the_sidecar` pins the two lists to each other. Anything
          # else is refused BY NAME, which is what lets core gain a command without a schema bump.
          case "$$CMD" in
            apply)
              CMDSAFE=apply
              ;;
            bundle)
              CMDSAFE=bundle
              [ "$$ALLOW" = "1" ] || { reject "$$ID" "this deployment does not accept uploaded image archives"; return; }
              BUNDLE="$$D/bundle/$$ID.tar"
              [ -f "$$BUNDLE" ] || { reject "$$ID" "the uploaded archive is missing"; return; }
              ;;
            # Re-read the registry now instead of waiting out the interval, and return: it names no
            # release, starts no container and touches nothing this deployment runs.
            #
            # It deliberately writes NO status.json, on any path including refusal. That file means
            # "a run", and three things read it: the Upgrade page's "last run" card, the 409 that
            # stops a second apply, and core's settle_finished_run -- which would CLAIM it, write an
            # `upgrade succeeded` audit row for an upgrade that never happened, and close a
            # maintenance window it never opened. The observable is available.json's written_at,
            # which is what the page watches. Refusal is core's to report: it answers 503 while the
            # switch is off, so reaching the branch below means a race with the toggle.
            # Remote-poller acceptance (ADR-065). It installs no image and names no release, so it
            # skips the tag check below and returns from here — but unlike `refresh` it DOES write
            # a status.json, because core is restarted by it and the operator needs the same "what
            # happened to my click" record an upgrade leaves. `settle_finished_run` claims it on the
            # way back up, which is what closes the maintenance window core opened.
            bus)
              CMDSAFE=bus
              if paused; then reject "$$ID" "the upgrade mechanism is switched off in Settings ▸ Upgrade"; return; fi
              [ -n "$$WORKDIR" ] || { reject "$$ID" "cannot locate the compose project directory"; return; }
              # Every field re-checked here, not only in core: this container reads the file as root,
              # and a request file is the one thing core can write into the shared volume. The
              # directory itself is checked inside BUS instead, because only that container can see
              # it — asking here is what made this command answer `rejected` every time.
              case "$$BUSMODE" in on|off) ;; *) reject "$$ID" "unsupported bus mode"; return ;; esac
              # 🚨 The leading letter is load-bearing, not cosmetic. This value is substituted into
              # `nats-server.conf` as `password: $$YAGRA_NATS_POLLER_PASSWORD`, and nats-server
              # PARSES what it substitutes: a digit-leading value starts a number and refuses to
              # start the server, an all-digit one crashes it on a type assertion. Refusing it here
              # costs the operator a retry; installing it costs them the bus.
              if [ "$$BUSMODE" = "on" ]; then
                for pw in "$$BUSCPW" "$$BUSPPW"; do
                  echo "$$pw" | grep -Eq '^[A-Za-z][A-Za-z0-9]{15,63}$$' \
                    || { reject "$$ID" "malformed bus password"; return; }
                done
              fi
              echo "$$BY" | grep -Eq '^[0-9A-Za-z._@-]{1,64}$$' || BY=unknown
              # Written here rather than in BUS so a container that never starts still leaves a run
              # behind — which `reject` below then overwrites with the reason.
              printf '{"id":"%s","command":"bus","target":null,"state":"running","step":"compose","message":"reconfiguring the bus","started_at":%s,"finished_at":null,"requested_by":"%s"}\n' \
                "$$ID" "$$(date +%s)" "$$BY" > "$$D/status.json.tmp"
              mv "$$D/status.json.tmp" "$$D/status.json"
              # The same three mounts the apply below needs, for the same reasons — and the third is
              # the whole fix. See the note above BUS.
              docker run --rm -d --name "yagra-bus-$$ID" \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "$${PROJ}_upgradedata:/data/upgrade" \
                -v "$$WORKDIR:$$WORKDIR" \
                -e "PROJ=$$PROJ" -e "WORKDIR=$$WORKDIR" \
                docker:28-cli sh -c "$$BUS" yagra-bus "$$BUSMODE" "$$ID" "$$BY" "$$BUSCPW" "$$BUSPPW" >/dev/null \
                || reject "$$ID" "could not start the bus-change container"
              return
              ;;
            refresh)
              if paused; then echo "refresh ignored: the mechanism is switched off" >&2; return; fi
              list_releases
              # Restart the interval's clock: a manual check is a check, and re-fetching five
              # seconds later on the old schedule would be a second call to the registry for the
              # same answer.
              LAST=$$(date +%s)
              return
              ;;
            *) reject "$$ID" "unsupported command"; return ;;
          esac
          # Defence in depth: core refuses to write a request at all while the switch is off, so
          # reaching here means either a race with the toggle or something else writing the volume.
          if paused; then reject "$$ID" "the upgrade mechanism is switched off in Settings ▸ Upgrade"; return; fi
          echo "$$TAG" | grep -Eq '^v[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}(-[0-9a-zA-Z]{1,16})?$$' \
            || { reject "$$ID" "not a release tag"; return; }
          echo "$$BY" | grep -Eq '^[0-9A-Za-z._@-]{1,64}$$' || BY=unknown
          [ -n "$$WORKDIR" ] || { reject "$$ID" "cannot locate the compose project directory"; return; }
          # Detached, outside this compose project, so `up -d --remove-orphans` cannot kill the
          # work — including when it recreates this very container. The procedure travels as an
          # argument; there is no script on disk for anything to tamper with.
          #
          # The deployment directory is mounted at ITS OWN PATH, not at a tidy /project. Everything
          # that container runs `docker compose` for lands a working_dir label on the host's
          # containers, and this very line reads that label back next time — so a container-local
          # mount point becomes a host path that does not exist. See step 0 of APPLY.
          docker run --rm -d --name "yagra-upgrade-$$ID" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$${PROJ}_upgradedata:/data/upgrade" \
            -v "$$WORKDIR:$$WORKDIR" \
            -e "REPO=$$REPO" -e "PROJ=$$PROJ" -e "WORKDIR=$$WORKDIR" \
            -e "YAGRA_UPGRADE_MIN_FREE_BYTES=$$MINFREE_CFG" -e "YAGRA_UPGRADE_KEEP_RELEASES=$$KEEP_CFG" \
            docker:28-cli sh -c "$$APPLY" yagra-upgrade "$$TAG" "$$ID" "$$BY" "$$BUNDLE" >/dev/null \
            || reject "$$ID" "could not start the upgrade container"
        }

        # WAS starts at 1 so the first unpaused pass fetches immediately; after that the list is
        # refreshed on the interval, and again the moment the operator switches the mechanism back
        # on — otherwise the picker would stay empty until the next daily check.
        WAS=1; LAST=0
        heartbeat
        while true; do
          if [ -f "$$D/request" ]; then handle; fi
          NOW=$$(date +%s)
          if paused; then
            WAS=1
          else
            if [ "$$WAS" != "0" ] || [ $$((NOW - LAST)) -ge "$$IVL" ]; then list_releases; LAST=$$NOW; fi
            WAS=0
          fi
          # A short beat keeps the request file responsive; the registry check keeps its own clock.
          sleep 5
          heartbeat
        done

# ── ClickHouse self-telemetry (ADR-031 Increment 4) ─────────────────────────────────────────────
# Two knobs, and each fixes a different half of the same measured problem.
#
#   <logger><level>  Stock is `trace`. In one hour that produced 22,112 Trace + 10,500 Debug rows
#                    in `system.text_log`, and the top producers were the merges of the system log
#                    tables themselves — logging about the work of storing the logs. `information`
#                    keeps startup, shutdown and schema messages, which are the ones an operator
#                    actually reads in `docker logs`.
#   <ttl>            Stock is none, on all nine `system.*_log` tables. They grow forever.
#
# `asynchronous_metrics_update_period_s` is here for the same reason at a different scale: at the
# default of 1s that table had accumulated **640 million rows** in 33 days. Nothing in Yagra reads
# `system.asynchronous_metrics`, so a minute is plenty.
#
# ⚠️ **The 7 here is only what a brand-new table is born with.** ClickHouse applies a config `<ttl>`
# at CREATE time and never afterwards, so on any existing volume this file changes nothing — that
# is what `YAGRA_CLICKHOUSE_SYSTEM_LOG_RETENTION_DAYS` and core's startup `ALTER` are for, and core
# is the authority if the two ever disagree. Set that variable to `0` on a ClickHouse Yagra does
# not own; then this file is the only bound, and it applies to new tables only.
configs:
  clickhouse-telemetry:
    content: |
      <clickhouse>
          <logger><level>information</level></logger>
          <asynchronous_metrics_update_period_s>60</asynchronous_metrics_update_period_s>
          <asynchronous_metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></asynchronous_metric_log>
          <metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></metric_log>
          <text_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></text_log>
          <trace_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></trace_log>
          <query_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_log>
          <query_views_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_views_log>
          <part_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></part_log>
          <processors_profile_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></processors_profile_log>
          <error_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></error_log>
      </clickhouse>

volumes:
  pgdata:
  vmdata:
  vldata:
  ipasndata:  # offline IP→ASN dataset (ADR-031) — written by ipasn-updater, read by core
  chdata:    # ClickHouse flow store (ADR-031)
  kekdata:   # persistent key-encryption key (see kek-init) — credentials survive restarts
  pollerbuf: # store-and-forward result buffer (Phase 3) — survives poller restarts
  buscerts:  # bus TLS certificate + the NATS server configuration (ADR-065). Written by
             # bus-cert-init, read by nats/core/poller. Like tlsdata it is a materialization of a
             # PostgreSQL row, not the source of truth: deleting it is safe and the next `up`
             # rewrites it. See bus-init for who arranges its ownership.
  tlsdata:   # WebUI TLS certificate (ADR-044) — core writes it, web reads it; see tls-init.
             # A cache of the PostgreSQL row, not the source of truth: deleting it is safe and
             # core rewrites it on the next start.
  logdata:   # core's rotated log files (ADR-045), read back by the support bundle. Bounded by
             # YAGRA_LOG_RETAIN_HOURS hourly files; deleting it costs only the retained history.
             # Also mounted by the poller, which writes into the pollers/ subdirectory (Inc.3) —
             # one volume, two writers, kept apart by path so neither collector sees the other's.
  upgradedata: # upgrade request/status hand-off between core and the yagra-updater sidecar
             # (ADR-050). Holds no configuration and no secret — deleting it loses only the record
             # of the last run. It exists even with the sidecar commented out, which costs nothing
             # and means enabling the sidecar later needs no change to core.
