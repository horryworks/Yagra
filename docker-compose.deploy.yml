  #       IVL="$${YAGRA_UPGRADE_CHECK_SECS:-21600}"
  #       SELF="$$(hostname)"
  #       label() { docker inspect -f "{{index .Config.Labels \"$$1\"}}" "$$SELF" 2>/dev/null || true; }
  #       PROJ="$$(label com.docker.compose.project)"
  #       WORKDIR="$$(label com.docker.compose.project.working_dir)"
  #       : "$${PROJ:=yagra}"
  #
  #       # The apply procedure, written out once so the throwaway container can run it and so an
  #       # operator can read it here. Arguments: <tag> <run-id> <requested-by>.
  #       cat > "$$D/bin/apply.sh" <<'APPLY'
