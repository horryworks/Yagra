# Yagra — remote-site poller (standalone).
#
# Run this on a machine AT a remote site to poll that site's devices locally and stream
# results back to the central Yagra core over the NATS bus. Unlike docker-compose.yml /
# docker-compose.deploy.yml (which run the whole stack), this file runs ONLY a poller
# and connects out to a central core's bus.
#
# ── If this came in a site bundle, read README.txt beside it ────────────────────────
# The central deployment builds that bundle at Settings ▸ Pollers ▸ "Issue token &
# download": one .tar.gz holding this file, a `.env` carrying the site's id, pool and
# bus token, `certs/server-cert.pem` for it to pin, and a README. Unpack it and run
#
#   docker compose -f docker-compose.poller.yml up -d
#
# The README is the instructions for a site; everything below is what this file itself
# does, so the two do not have to be kept in step.
#
# ── If you are holding this file on its own ─────────────────────────────────────────
# Ask the central operator for a bundle rather than assembling one. The bus carries
# PLAINTEXT device credentials (ADR-020), so it is TLS-authenticated before it leaves
# the host, and the certificate and the per-site token only exist centrally. Turning
# that on is one switch there — Settings ▸ Pollers ▸ "Accept remote pollers" — and not
# a hand-edited nats-server.conf: an in-place upgrade reinstalls the composition from
# the target image, so a hand edit lasts until the next one.
#
# ── Three env vars are REQUIRED (compose errors out if unset) ───────────────────────
# The bundle's `.env` sets all three:
#   YAGRA_BUS_URL     — tls://<poller-id>:<token>@<core-host>:4222
#   YAGRA_POLLER_ID   — stable identity for this poller (e.g. edge-tokyo-1)
#   YAGRA_POLLER_POOL — pool this poller serves; nodes are assigned to pollers by pool
#
# ── One optional variable decides whether this poller upgrades itself ───────────────
# COMPOSE_PROFILES=self-upgrade  turns on the `yagra-poller-updater` service at the
# bottom of this file, so a single press of Settings ▸ Upgrade centrally replaces this
# poller too (ADR-051). The site bundle writes it for you; the checkbox on the issuing
# dialog is ON by default. Empty the value to switch it off — and switch it off THERE,
# in `.env`, not by editing this file: an apply reinstalls this file from the target
# image, so an edit here lasts until the next upgrade. Read the block beside the service
# for what enabling it grants (short version: a container here holds the Docker socket).
#
# Pin/rollback the image with YAGRA_IMAGE_TAG; point it at a mirror of your own with
# YAGRA_IMAGE_REPO. The defaults are `latest` from ghcr.io/horryworks — the latest
# stable release, since remote pollers only ever run published releases.
#
# That means a remote poller can be a release behind (or ahead of) a central core running an
# unreleased build, so the usual N/N-1 bus-compatibility rules are doing real work here: new
# message fields must be `#[serde(default)]`, and a new capability must be advertised in the
# heartbeat before core relies on it. Pin an explicit `v<version>` if you need the two ends
# locked together during an upgrade.

name: yagra-poller

services:
  poller:
    image: ${YAGRA_IMAGE_REPO:-ghcr.io/horryworks}/yagra-poller:${YAGRA_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # Host networking (no bridge): passive syslog/trap correlation keys on the datagram
    # SOURCE IP (bridge NAT would rewrite it), and raw-socket ICMP wants the host's
    # interfaces directly. Because of this, no `ports:` mapping is used or needed.
    network_mode: host
    cap_add:
      - NET_RAW        # raw-socket ICMP (surge-ping) — granted to this poller only
    environment:
      # ── Required ──────────────────────────────────────────────────────────────────
      # Central bus URL. A remote site crosses a trust boundary ⇒ TLS + auth mandatory.
      # The username is this site's own poller id when it has been issued a token (what the
      # bundle writes), and the shared `poller` account when it has not:
      #   tls://<poller-id>:<token>@<core-host-or-ip>:4222
      #   tls://poller:<YAGRA_NATS_POLLER_PASSWORD>@<core-host-or-ip>:4222
      YAGRA_BUS_URL: ${YAGRA_BUS_URL:?set YAGRA_BUS_URL, e.g. tls://poller:PASSWORD@core.example.com:4222}
      # Stable, human-meaningful identity (shown on the Pollers page, sanitized for the
      # NATS subject). Keep it UNIQUE per poller so two pollers never share an assignment.
      YAGRA_POLLER_ID: ${YAGRA_POLLER_ID:?set YAGRA_POLLER_ID, e.g. edge-tokyo-1}
      # Pool this poller serves — core assigns nodes to pollers by pool (ADR-009).
      YAGRA_POLLER_POOL: ${YAGRA_POLLER_POOL:?set YAGRA_POLLER_POOL, e.g. tokyo}
      # On-disk rotated logs (ADR-045). Two consumers, and both need this set:
      #   * you, on this box — the only record of a run that has already ended, since `docker logs`
      #     needs a shell here;
      #   * the central support bundle — core asks this poller for a window of these files over the
      #     bus and carries the answer under logs/remote/ (ADR-045 Inc.4). **Unset this and the
      #     poller stops advertising `log-ship`, so core does not ask and the bundle records this
      #     site by name as unrepresented.** That is the honest outcome, not a silent one.
      # Before sending, the poller scans these files for the device credentials it currently holds
      # and refuses the whole reply on a match — core's own scan cannot see a device community.
      YAGRA_LOG_DIR: ${YAGRA_LOG_DIR-/var/log/yagra}
      # ── TLS ───────────────────────────────────────────────────────────────────────
      # CA (or self-signed server) cert that signs the NATS server cert, mounted from
      # ./certs below. Required whenever YAGRA_BUS_URL is tls:// with a private CA.
      YAGRA_BUS_CA_FILE: ${YAGRA_BUS_CA_FILE:-/etc/yagra/certs/server-cert.pem}
      # ── Passive event listeners (optional; unset either line to disable) ───────────
      # With host networking the container binds the host port directly. This poller
      # runs NON-ROOT (file-cap NET_RAW only), so it CANNOT bind :514/:162 (<1024). Use
      # high ports and redirect on the host firewall (e.g. iptables REDIRECT 514→1514),
      # or point devices straight at the high ports below.
      YAGRA_SYSLOG_BIND: ${YAGRA_SYSLOG_BIND:-0.0.0.0:1514}
      YAGRA_TRAP_BIND: ${YAGRA_TRAP_BIND:-0.0.0.0:1162}
      # Optional trap community filter (mismatches dropped; value never logged).
      YAGRA_TRAP_COMMUNITY: ${YAGRA_TRAP_COMMUNITY:-}
      # Edge intake caps (per-source-IP / global token buckets, S8) — match the raised code
      # defaults (200 / 5000 msg/s). Raise for a site with chassis-scale syslog/trap volume.
      YAGRA_EVENT_RATE_PER_SOURCE: ${YAGRA_EVENT_RATE_PER_SOURCE:-200}
      YAGRA_EVENT_RATE_GLOBAL: ${YAGRA_EVENT_RATE_GLOBAL:-5000}
      # ── Flow collector (ADR-031; optional) ─────────────────────────────────────────
      # Receive this site's NetFlow v5/v9 / IPFIX, edge-aggregate to top-N/bucket, and
      # publish to core (→ ClickHouse). With host networking the container binds the host
      # port directly (:2055), so point this site's devices' flow export at this poller.
      # Set YAGRA_FLOW_BIND empty to disable. sFlow is off unless YAGRA_SFLOW_BIND=:6343.
      # NOTE: on a secured remote bus with Auth Callout on (ADR-030), the poller's scoped
      # credential must allow publishing `yagra.flows` — granted in yagra-authz's allow-list
      # (and in the static `poller` account in docker/nats/nats-server.conf) so flow batches
      # aren't rejected. Older core/nats configs without that grant will drop remote flow.
      YAGRA_FLOW_BIND: ${YAGRA_FLOW_BIND-0.0.0.0:2055}
      YAGRA_SFLOW_BIND: ${YAGRA_SFLOW_BIND-}
      YAGRA_FLOW_BUCKET_SECS: ${YAGRA_FLOW_BUCKET_SECS:-60}
      YAGRA_FLOW_TOP_N: ${YAGRA_FLOW_TOP_N:-500}
      # ── Distributed tracing (optional) ─────────────────────────────────────────────
      # Export this remote poller's poll spans to a central OTLP collector (reachable from
      # the site — its own endpoint/TLS, separate from the NATS bus). Unset = logs only.
      # At scale, sample: OTEL_TRACES_SAMPLER=parentbased_traceidratio, ..._ARG=0.01.
      # YAGRA_OTEL_ENDPOINT: ${YAGRA_OTEL_ENDPOINT:-}
      RUST_LOG: ${RUST_LOG:-info}
      # ── Store-and-forward (Phase 3) ────────────────────────────────────────────────
      # If the WAN to core drops, this poller keeps polling locally and buffers results,
      # then bulk-replays them on reconnect so history has no hole (alerts are NOT
      # backfilled — they resume from "now"). ON by default; the buffer is bounded
      # (drop-oldest) and spills to the volume below so it survives a restart. The
      # defaults suit a small box; raise the caps for a busy site, or set =off to disable.
      YAGRA_STORE_FORWARD: ${YAGRA_STORE_FORWARD:-on}
      YAGRA_STORE_FORWARD_MEM_MAX: ${YAGRA_STORE_FORWARD_MEM_MAX:-20000}
      YAGRA_STORE_FORWARD_DISK_MAX_MB: ${YAGRA_STORE_FORWARD_DISK_MAX_MB:-512}
      YAGRA_STORE_FORWARD_MAX_AGE_SECS: ${YAGRA_STORE_FORWARD_MAX_AGE_SECS:-86400}
      YAGRA_STORE_FORWARD_DISK_FREE_FLOOR_MB: ${YAGRA_STORE_FORWARD_DISK_FREE_FLOOR_MB:-1024}
      # ── Self-upgrade (ADR-051 Inc.4) ──────────────────────────────────────────────
      # The hand-off directory this poller writes an upgrade request into. Set
      # UNCONDITIONALLY — the `yagra-poller-updater` service below is the optional half.
      # With no sidecar there is no `current.json`, so the poller does NOT advertise
      # `self-upgrade` and core never sends it a command (heartbeat.rs::self_upgrade_cap
      # checks that file's freshness, not just this variable). Writing it here costs
      # nothing and keeps the volume reference below valid either way.
      YAGRA_UPGRADE_DIR: ${YAGRA_UPGRADE_DIR:-/data/upgrade}
    volumes:
      # CA / server cert for the TLS bus (read-only). The site bundle unpacks it to
      # ./certs/server-cert.pem, which is what YAGRA_BUS_CA_FILE defaults to above.
      - ${YAGRA_CERT_DIR:-./certs}:/etc/yagra/certs:ro
      # Store-and-forward spill (Phase 3) — persists the result buffer across restarts.
      - pollerbuf:/var/lib/yagra/buffer
      # Rotated log files, so a run that crashed leaves a trace on this box (ADR-045).
      - pollerlogs:/var/log/yagra
      # Hand-off with the site updater (ADR-051). The poller only ever WRITES here.
      - upgradedata:/data/upgrade

  # ── Site updater (ADR-051) — shipped, and switched on from `.env` ──────────────────
  #
  # Lets a single press of Settings ▸ Upgrade at the central deployment replace this poller
  # too. Core sends the release tag over the bus, the poller writes it into the shared
  # volume, and this container — the only one here holding the Docker socket — installs it.
  #
  # HOW TO TURN IT OFF, AND WHY THE SWITCH IS IN `.env` (ADR-051 Inc.4, decision 15).
  # `COMPOSE_PROFILES` decides whether this service exists at all. The site bundle writes
  # `COMPOSE_PROFILES=self-upgrade` into `.env`; empty that value (or delete the line) and
  # compose stops creating this container entirely — nothing here mounts the Docker socket.
  #
  #   COMPOSE_PROFILES=              # off: no container here holds the Docker socket
  #   COMPOSE_PROFILES=self-upgrade  # on  (what the site bundle writes by default)
  #
  # ⚠️ Do NOT switch it off by deleting this block. An apply reinstalls this file from the
  # target image (the same rule as centrally, ADR-050 decision 5), so a local edit lasts
  # only until the next upgrade. `.env` is the one file no upgrade replaces — which is
  # exactly why the switch lives there and not here.
  #
  # WHAT IT GRANTS, stated plainly. The Docker socket is host root: anything that can write
  # to it can start a privileged container. Three things bound that, and all three are
  # load-bearing rather than reassuring: this container listens on NO network (its only
  # input is the `request` file the poller writes); a command carries a TAG and never a
  # repository, so the worst a forged one achieves is installing a published Yagra poller
  # release; and the upgrade subject is subscribe-only in BOTH bus allow-lists
  # (`yagra-authz` and `docker/nats/nats-server.conf`), so one site can never order an
  # upgrade at another. What is NOT bounded: whoever controls core can move every site.
  yagra-poller-updater:
    image: docker:28-cli
    profiles: ["self-upgrade"]
    restart: unless-stopped
    # uid 0 so it can drive the socket; `YAGRA_DOCKER_GID` matches the host's docker group.
    user: "0:${YAGRA_DOCKER_GID:-0}"
    environment:
      # Fixed HERE, never over the API or the bus: a command can name a tag, never a
      # repository. The worst a forged command can do is install a published Yagra poller
      # release — a downgrade or a restart, not arbitrary code.
      YAGRA_UPGRADE_REPO: ${YAGRA_UPGRADE_REPO:-ghcr.io/horryworks}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - upgradedata:/data/upgrade
      # The site's deployment directory, mounted at THE PATH THE HOST KNOWS IT BY — not at a
      # tidy /project, and that is the whole of ADR-051 Inc.5 decision 20. `docker compose`
      # resolves a relative bind source against ITS OWN working directory and hands the result
      # to the daemon as a HOST path, which Docker then creates empty rather than failing. Run
      # from a container-local mount point, the poller's `./certs` therefore became an empty
      # /certs on the host: the replacement poller started, could not read its CA, and never
      # reached the bus — while `up -d` exited 0 and this script reported success (measured on
      # 192.168.1.212, 2026-08-27). The same reasoning stamps a working_dir label naming a path
      # that exists only inside a container which is already gone. Mounting it at its own name
      # makes the two spellings the same string, so neither can be wrong. The central updater
      # passes `-v "$WORKDIR:$WORKDIR"` to its throwaway containers for exactly this reason.
      - ${PWD}:${PWD}
    command:
      - sh
      - -c
      - |
        set -eu
        D=/data/upgrade
        mkdir -p "$$D" && chown -R 10002:10002 "$$D"
        REPO="$${YAGRA_UPGRADE_REPO:-ghcr.io/horryworks}"
        PROJ=yagra-poller
        # Where this site lives, as the HOST spells it. `docker compose up -d` stamps its own
        # working directory onto every container it creates, so reading that label back is the
        # one way to learn a host path from inside a container without being told. Read once:
        # this container is not recreated by an apply (see `up -d poller` below), so the value
        # cannot change under us — and when it is wrong it is wrong from the first command,
        # which is where `handle()` refuses.
        SELF="$$(hostname)"
        label() { docker inspect -f "{{index .Config.Labels \"$$1\"}}" "$$SELF" 2>/dev/null || true; }
        WORKDIR="$$(label com.docker.compose.project.working_dir)"
        # NOTHING IN THE SHARED VOLUME IS EXECUTED. The poller writes data there and this
        # container reads it; the script itself lives in this file and is passed as an
        # argument, so a writable volume can never become a writable script (ADR-050).
        say() {
          printf '{"id":"%s","command":"%s","target":"%s","state":"%s","step":"%s","message":"%s","started_at":%s,"finished_at":%s}\n' \
            "$$1" "$$2" "$$3" "$$4" "$$5" "$$6" "$$7" "$$8" > "$$D/status.json.tmp"
          mv "$$D/status.json.tmp" "$$D/status.json"
        }
        heartbeat() {
          printf '{"written_at":%s,"repo":"%s","check_interval_secs":5,"allow_bundle":false,"paused":false}\n' \
            "$$(date +%s)" "$$REPO" > "$$D/current.json.tmp"
          mv "$$D/current.json.tmp" "$$D/current.json"
        }
        field() { sed -n "s/^$$1=//p" "$$D/request" | head -1; }
        handle() {
          SCHEMA=$$(field schema); ID=$$(field id); CMD=$$(field command)
          TAG=$$(field tag); BY=$$(field requested_by)
          rm -f "$$D/request"
          [ "$$SCHEMA" = "1" ] || return 0
          echo "$$ID" | grep -Eq '^[0-9a-f-]{36}$$' || return 0
          # Checked again here even though the poller checked it: this side is what pastes
          # the value into a `docker` invocation, so it does not get to assume.
          echo "$$TAG" | grep -Eq '^v[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}(-[0-9a-zA-Z]{1,16})?$$' || return 0
          echo "$$BY" | grep -Eq '^[0-9A-Za-z._@-]{1,64}$$' || BY=unknown
          NOW=$$(date +%s)
          # The deployment directory, at the path the HOST knows it by. Everything below
          # addresses this site through it — the composition is written there and compose is
          # run from there — so a relative bind source in this file resolves to the same host
          # path the operator sees. When the label names a directory that does not hold this
          # site's compose file, this container was created somewhere else, and an `up -d`
          # from here would run against a directory Docker helpfully created empty. Refuse and
          # name the repair rather than half-executing. The central updater has read this label
          # since 2026-08-12, where three consecutive applies died reporting a failed backup;
          # its absence here is what emptied a site's certificates on 2026-08-27.
          if [ -z "$${WORKDIR:-}" ] || [ ! -f "$$WORKDIR/docker-compose.poller.yml" ]; then
            say "$$ID" "$$CMD" "$$TAG" failed start "the compose label this reads names $${WORKDIR:-nothing}, which does not hold this site's docker-compose.poller.yml; on this host, from the directory that does, run: docker compose -p $$PROJ -f docker-compose.poller.yml up -d --force-recreate yagra-poller-updater" "$$NOW" "$$(date +%s)"
            return 0
          fi
          case "$$CMD" in
            prefetch)
              # Pull while the poller keeps running. A WAN pull is minutes; the outage is
              # only the recreate, so splitting them is what keeps a single-poller site's
              # gap to seconds (ADR-051 decision 13).
              say "$$ID" prefetch "$$TAG" running pull "fetching $$TAG" "$$NOW" null
              if docker pull "$$REPO/yagra-poller:$$TAG" >/dev/null 2>&1; then
                say "$$ID" prefetch "$$TAG" succeeded pull "fetched $$TAG" "$$NOW" "$$(date +%s)"
              else
                say "$$ID" prefetch "$$TAG" failed pull "could not fetch $$TAG" "$$NOW" "$$(date +%s)"
              fi
              ;;
            apply)
              say "$$ID" apply "$$TAG" running pull "fetching $$TAG" "$$NOW" null
              docker pull "$$REPO/yagra-poller:$$TAG" >/dev/null 2>&1 || true
              # The composition comes out of the image being installed, not from what is on
              # this host — the same rule as centrally, so a site cannot drift into a file
              # the release never shipped with.
              say "$$ID" apply "$$TAG" running compose "installing $$TAG" "$$NOW" null
              C=$$(docker create "$$REPO/yagra-poller:$$TAG" true 2>/dev/null) || C=""
              if [ -n "$$C" ]; then
                docker cp "$$C:/usr/share/yagra/docker-compose.poller.yml" "$$WORKDIR/" 2>/dev/null || true
                docker rm -f "$$C" >/dev/null 2>&1 || true
              fi
              # The bind a wrong working directory silently empties, checked BEFORE anything is
              # recreated. Docker creates a missing bind source as an empty directory instead of
              # failing, so the poller would start, find no CA, and never reach the bus — while
              # `up -d` exits 0 and the line below would report success. Checked for CONTENT
              # rather than existence, because an empty directory exists. Only checked when it
              # resolves inside this deployment directory: an operator who pointed
              # YAGRA_CERT_DIR elsewhere has a path this container cannot see, and refusing on
              # a path we cannot read would be worse than not looking.
              CERTS=$$(sed -n 's/^YAGRA_CERT_DIR=//p' "$$WORKDIR/.env" 2>/dev/null | head -1)
              [ -n "$$CERTS" ] || CERTS="$$WORKDIR/certs"
              case "$$CERTS" in
                "$$WORKDIR"/*)
                  if [ -z "$$(ls -A "$$CERTS" 2>/dev/null)" ]; then
                    say "$$ID" apply "$$TAG" failed compose "$$CERTS holds no certificate, so the replacement poller would start with nothing to trust the bus with; restore this site's certs directory, or re-issue its bundle from Settings > Pollers, before upgrading" "$$NOW" "$$(date +%s)"
                    return 0
                  fi
                  ;;
              esac
              # Run from the HOST's own spelling of this directory, never from a mount point —
              # see the volume comment above. `poller` is NAMED, and that is not tidiness
              # either: a bare `up -d` includes THIS service, so the container running this
              # script would recreate itself mid-apply and never write the result. Naming it has
              # one cost, the same one centrally — a changed updater definition is not picked up
              # here, so an operator recreates it by hand at the site.
              # `-p` is not optional: without it compose derives the project from the directory
              # name, forks a second empty stack and orphans `pollerbuf`.
              if ( cd "$$WORKDIR" && YAGRA_IMAGE_TAG="$$TAG" docker compose -p "$$PROJ" -f docker-compose.poller.yml up -d poller ); then
                say "$$ID" apply "$$TAG" succeeded verify "now running $$TAG" "$$NOW" "$$(date +%s)"
              else
                say "$$ID" apply "$$TAG" failed compose "could not recreate the poller" "$$NOW" "$$(date +%s)"
              fi
              ;;
            *) return 0 ;;
          esac
        }
        heartbeat
        while true; do
          [ -f "$$D/request" ] && handle
          sleep 5
          heartbeat
        done

volumes:
  pollerbuf:   # store-and-forward result buffer (Phase 3)
  pollerlogs:  # this poller's rotated log files (ADR-045). Read here by you, and sent to core on
               # request for the central support bundle (Inc.4) — core cannot mount this disk, so
               # the bus is the only crossing. A run that has already ended is readable here only.
  upgradedata: # poller ⇄ site-updater hand-off (ADR-051). The poller writes, the updater reads.
               # Present whether or not the updater is enabled; an unread request is inert.
