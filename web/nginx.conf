# Production nginx for the WebUI image. Serves the SPA and proxies /api to Yagra-core
# (service name `core` on the compose network), so the browser's relative `/api/v1`
# calls reach the backend. SSE needs buffering off and a long read timeout.
#
# Listens on 8080, not 80: the image runs rootless (nginx-unprivileged, uid 101), which cannot
# bind a privileged port. The compose files map this container port to the host (default host :3000).
#
# ── TLS (security.md: "TLS everywhere for the northbound API") ────────────────────────────────
# The login password, bearer tokens, and — before server-side envelope encryption — the plaintext
# device credentials submitted at Settings ▸ Credentials all cross this connection. It MUST be
# encrypted before the WebUI/API port is reachable off a trusted LAN. Two supported patterns:
#
#   1. RECOMMENDED — terminate TLS at an external reverse proxy (Caddy/Traefik/nginx, or a cloud
#      LB) in front of this container, and publish only that proxy. The proxy speaks HTTPS to the
#      browser and plain HTTP to this container over a private network. Nothing here changes.
#   2. Terminate TLS in this container — uncomment the `server { listen 8443 ssl; … }` block below,
#      mount a cert+key into /etc/nginx/certs (e.g. `- ./certs:/etc/nginx/certs:ro`), and map the
#      container's 8443 to a host port. 8443 is unprivileged, so the rootless image can bind it.
#
# Either way, once TLS is fronting the UI, do NOT also expose the core API port (:8080) or the
# plain-HTTP web port directly to an untrusted network.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;          # stream SSE immediately
        proxy_read_timeout 1h;        # keep SSE connections open
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA client-side routing fallback
    }
}

# ── Opt-in in-container TLS (pattern 2 above) ─────────────────────────────────────────────────
# Uncomment and mount a cert (server.crt) + key (server.key) at /etc/nginx/certs. Redirect the
# plain-HTTP listener to HTTPS by adding `return 301 https://$host$request_uri;` to the :8080
# server, or drop the :8080 block entirely if you only want HTTPS.
