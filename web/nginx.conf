# Production nginx for the WebUI image. Serves the SPA and proxies /api to Yagra-core
# (service name `core` on the compose network), so the browser's relative `/api/v1`
# calls reach the backend. SSE needs buffering off and a long read timeout.
#
# It also owns the SPA's cache policy, which is an upgrade concern rather than a performance one:
# every image replaces the whole document root, so a browser holding a pre-upgrade index.html asks
# for hashed assets that no longer exist. See the `location` blocks below.
#
# Listens on 8080, not 80: the image runs rootless (nginx-unprivileged, uid 101), which cannot
# bind a privileged port. The compose files map this container port to the host (default host :3000).
#
# ── TLS (security.md: "TLS everywhere for the northbound API") ────────────────────────────────
# The login password, bearer tokens, and — before server-side envelope encryption — the plaintext
# device credentials submitted at Settings ▸ Credentials all cross this connection. It MUST be
# encrypted before the WebUI/API port is reachable off a trusted LAN. Two supported patterns:
#
#   1. RECOMMENDED — terminate TLS at an external reverse proxy (Caddy/Traefik/nginx, or a cloud
#      LB) in front of this container, and publish only that proxy. The proxy speaks HTTPS to the
#      browser and plain HTTP to this container over a private network. Nothing here changes.
#   2. Terminate TLS in this container — uncomment the `server { listen 8443 ssl; … }` block below,
#      mount a cert+key into /etc/nginx/certs (e.g. `- ./certs:/etc/nginx/certs:ro`), and map the
#      container's 8443 to a host port. 8443 is unprivileged, so the rootless image can bind it.
#
# Either way, once TLS is fronting the UI, do NOT also expose the core API port (:8080) or the
# plain-HTTP web port directly to an untrusted network.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;          # stream SSE immediately
        proxy_read_timeout 1h;        # keep SSE connections open
    }

    # Hashed build assets. Vite emits /assets/<name>-<hash>.<ext>, so the filename changes whenever
    # the content does and the file is safe to cache forever.
    #
    # `=404` instead of the SPA fallback below is the load-bearing part: a request for a hashed asset
    # that does not exist means the client is holding a stale index.html naming a bundle this image
    # no longer contains. Falling through to index.html answers a .js request with text/html, which
    # the browser rejects on MIME grounds — a blank page with nothing in it saying why. A 404 is the
    # honest answer and is what a chunk-load error handler can act on.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA client-side routing fallback
    }

    # The SPA entry point is the one file whose URL never changes, and it is what names the current
    # hashed bundle — so it must never be used without revalidating. With no Cache-Control at all
    # (the previous state) browsers apply heuristic freshness (RFC 9111 §4.2.2, commonly 10% of the
    # age since Last-Modified), so a long-lived index.html can be served from cache for hours after
    # an upgrade and ask for asset hashes that are gone. `no-cache` means revalidate, not "don't
    # store": the ETag still yields a 304, so this costs one conditional request per load.
    #
    # Reached by internal redirect for every deep link too (`try_files … /index.html` and the `index`
    # directive both re-run location matching), so client-side routes get the header as well.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

