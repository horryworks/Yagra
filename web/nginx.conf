# Production nginx for the WebUI image. Serves the SPA and proxies /api to Yagra-core
# (service name `core` on the compose network), so the browser's relative `/api/v1`
# calls reach the backend. SSE needs buffering off and a long read timeout.
#
# Listens on 8080, not 80: the image runs rootless (nginx-unprivileged, uid 101), which cannot
# bind a privileged port. The compose files map this container port to the host (default host :3000).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;          # stream SSE immediately
        proxy_read_timeout 1h;        # keep SSE connections open
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA client-side routing fallback
    }
}
