# Production nginx for the WebUI image. Serves the SPA and proxies /api and /mcp to Yagra-core
# (service name `core` on the compose network), so the browser's relative `/api/v1` calls reach the
# backend. SSE needs buffering off and a long read timeout.
#
# It also owns the SPA's cache policy, which is an upgrade concern rather than a performance one:
# every image replaces the whole document root, so a browser holding a pre-upgrade index.html asks
# for hashed assets that no longer exist. See the `location` blocks below.
#
# ── TLS is the default now (ADR-044) ──────────────────────────────────────────────────────────
# The login password, bearer tokens, and — before server-side envelope encryption — the plaintext
# device credentials submitted at Settings ▸ Credentials all cross this connection. Until ADR-044
# this file terminated no TLS and carried a *commented-out* `listen 8443 ssl` block instead; nobody
# uncommented it for a year, which is why the secure configuration is now the one you get by doing
# nothing.
#
# **There is exactly one `server` block, and that is deliberate.** The listener differs between the
# TLS and plaintext modes by three directives, so only those are rendered — into
# /etc/nginx/yagra-listen.conf, by docker-entrypoint.d/40-yagra-tls.sh. A second `server` block
# would duplicate the cache rules below, and per .claude/rules/extensibility.md §2 that is an
# untested mirror whose drift shows up as a blank page after an upgrade — the exact failure those
# rules were written to stop.
#
# **The container port stays 8080 in both modes.** Only the scheme on it changes, so the compose
# mapping, EXPOSE, and any k8s manifest are mode-independent and nobody has to reason about a
# container port that moves. The host port defaults to 443 (YAGRA_WEB_PORT).
#
# Set YAGRA_WEB_TLS=off to serve plaintext here instead — the supported shape when an external
# reverse proxy (Caddy/Traefik, or a cloud LB) already terminates HTTPS in front of this container.
server {
    # listen + ssl_certificate/ssl_certificate_key, or a bare plaintext listen. Rendered at startup.
    include /etc/nginx/yagra-listen.conf;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;          # stream SSE immediately
        proxy_read_timeout 1h;        # keep SSE connections open
    }

    # The MCP tool surface (ADR-028), so an AI client reaches it over the same TLS edge as the UI
    # instead of core's plaintext port. Exact-match `=`, not a prefix: /metrics is unauthenticated
    # and must not become reachable here by a prefix that grew.
    #
    # ⚠️ YAGRA_MCP_ALLOWED_HOSTS is rmcp's DNS-rebinding guard and it sees the Host set below. A
    # deployment that pinned it to `10.0.0.5:8080` will reject a client dialling
    # `https://yagra.example.com/mcp` until that name is added — see .env.example.
    location = /mcp {
        proxy_pass http://core:8080/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;          # Streamable HTTP — same reasoning as SSE above
        proxy_read_timeout 1h;
    }

    # Hashed build assets. Vite emits /assets/<name>-<hash>.<ext>, so the filename changes whenever
    # the content does and the file is safe to cache forever.
    #
    # `=404` instead of the SPA fallback below is the load-bearing part: a request for a hashed asset
    # that does not exist means the client is holding a stale index.html naming a bundle this image
    # no longer contains. Falling through to index.html answers a .js request with text/html, which
    # the browser rejects on MIME grounds — a blank page with nothing in it saying why. A 404 is the
    # honest answer and is what a chunk-load error handler can act on.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA client-side routing fallback
    }

    # The SPA entry point is the one file whose URL never changes, and it is what names the current
    # hashed bundle — so it must never be used without revalidating. With no Cache-Control at all
    # (the previous state) browsers apply heuristic freshness (RFC 9111 §4.2.2, commonly 10% of the
    # age since Last-Modified), so a long-lived index.html can be served from cache for hours after
    # an upgrade and ask for asset hashes that are gone. `no-cache` means revalidate, not "don't
    # store": the ETag still yields a 304, so this costs one conditional request per load.
    #
    # Reached by internal redirect for every deep link too (`try_files … /index.html` and the `index`
    # directive both re-run location matching), so client-side routes get the header as well.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
