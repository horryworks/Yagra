# Security response headers (ADR-211), included by web/nginx.conf.
#
# 🚨 **Included in three places, not one, and that is the point of this file.** nginx drops every
# `add_header` it would inherit from `server` as soon as a `location` declares one of its own
# (`add_header_inherit` only arrived in 1.29.3). `/assets/` and `= /index.html` each set
# Cache-Control, so a header written once at `server` level would reach the proxied API and miss
# the JS bundle and the page itself — the two responses a browser actually enforces CSP on.
#
# `always` on every line: without it nginx adds a header only to 2xx/3xx, so a 401 or a 404 would
# go out bare.
#
# HSTS is deliberately absent (ADR-044, ADR-211 decision 3): the default certificate is the
# self-signed one core generates, and HSTS removes the browser's "proceed anyway", locking an
# operator out of their own WebUI.

add_header X-Content-Type-Options "nosniff" always;

# Report-Only does not enforce `frame-ancestors`, so framing is refused here instead.
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "same-origin" always;

# Report-Only: violations are logged to the browser console and nothing is blocked. Enforcing it is
# the next increment, once the screens have been walked with it on.
# `style-src 'unsafe-inline'` is for the report viewer: it shows server-rendered HTML in a `srcdoc`
# iframe, which inherits this policy, and that HTML styles itself inline.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
