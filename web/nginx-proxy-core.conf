# The proxy directives every location that forwards to Yagra-core needs, in one place.
#
# Included by the `/api/`, `/api/v1/auth/` and `/mcp` blocks in nginx.conf. It holds
# everything EXCEPT `proxy_pass`, because that differs per location (`/mcp` rewrites the
# path, the two API blocks do not) — and because a `proxy_pass` here would make the
# include silently decide where a request goes, which is the one thing each block should
# state for itself.
#
# ⚠️ **It exists because there are three copies, not two.** ADR-133 added the auth block
# so that endpoint could opt out of gzip (BREACH), and a third verbatim copy of these five
# lines is what `extensibility.md` §3 refuses. A directive added here reaches all three; a
# directive that must differ belongs in the block, beside its reason.
#
# `proxy_buffering off` + the long read timeout are for SSE (`/api/v1/stream/*`) and the
# MCP Streamable HTTP transport: both hold a connection open and must not be buffered.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_buffering off;
proxy_read_timeout 1h;
