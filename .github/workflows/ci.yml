# Continuous integration: validate the workspace on every **pull request** and every **v* tag**.
# Pushes to `main` are deliberately NOT a trigger — see the long note above `on:` below. The
# `images` job builds the Docker images so build breakage — including the Dockerfile's pinned Rust
# version (MSRV) — is caught here. It publishes to GHCR on a **v* release tag only**: development
# builds never reach the registry at all (see the tag-computation step). CI does NOT deploy: see
# the note where the `deploy` job used to be, at the bottom of this file.
#
# Everything runs on GITHUB-HOSTED runners. It used to run on self-hosted runners (label
# `yagra-build`) on the build host, to avoid Actions-minute billing — which is free for a public
# repository anyway, and was never worth what it cost once the repository went public:
#
#   A `pull_request` run uses the workflow file **from the pull request**, not from `main`. So a
#   fork could delete the fork-PR guard below (or add a second workflow file naming the
#   `yagra-build` label) and run arbitrary code on the build host — a machine that sits on the same
#   LAN as the test server, holds the GHCR login, and carries a persistent cargo/BuildKit cache that
#   the next `v*` release build would compile against. Poisoning that cache ships a backdoored image
#   to GHCR with every job green. Nothing written in this file can prevent that, because the
#   attacker supplies this file.
#
# The runners were therefore deregistered from the repository: a malicious `runs-on: self-hosted`
# now matches no runner and the job simply times out without executing. That property is structural
# — it survives someone relaxing a setting or editing this file.
#
# Accepted cost, measured on the first hosted run (2026-08-09, `ci-fast`, nothing published):
# **11m09s → 28m14s** against the comparable self-hosted run. Where it went, per job:
#
#     compose   0m13s → 0m08s     frontend  1m16s → 1m16s     backend   7m56s → 10m48s
#     img/core  1m51s → 13m49s    img/poller 0m21s → 1m22s    img/web   0m46s → 2m01s
#
# `img/core` is the whole story. `Swatinem/rust-cache` and the BuildKit GHA cache carry what they
# can, but **no cache backend exports the Dockerfile's `RUN --mount=type=cache` cargo directories**,
# so the image build recompiles the workspace every run and that ~14 min is a floor, not a cold-start
# cost that later runs recover. `img/poller` staying at 1m22s is the `max-parallel: 1` design
# working — it imported `core`'s shared `build` stage instead of compiling again.
#
# **A release tag is slower still and always was**: v0.1.19…v0.2.0 ran 24m51s–33m47s on self-hosted
# (v0.2.0: 29m48s), because a tag builds `release` rather than `ci-fast` and pushes to GHCR. Expect
# that to grow by roughly what `img/core` grew here. Do not quote "~10 minutes" for a release; that
# figure only ever described a `ci-fast` branch build.
#
# That is the price of not having a build machine inside the network reachable from a stranger's
# pull request.

name: ci

# **There is deliberately no `branches: [main]` trigger.** It was removed because it was pure
# contention with no gate behind it: `/flashdeploy` ships every main push to the test server, does
# not wait for CI's verdict, and runs its own fmt/clippy/build/test on this same host — so a main
# push started a second full compile of the same commit on the same box, competing for the CPU and
# the shared BuildKit/cargo caches with the deploy that was already underway. Every job it ran was
# something the flash path had already run locally, and the `images` job was a verbatim repeat of
# the three images `/flashdeploy` had just built.
#
# What still gates what:
#   * `/flashdeploy`'s local guard (fmt, clippy, the OpenAPI contract, web tests) gates the ship,
#     and its asynchronous pass (`cargo clippy --all-targets` + `cargo test --workspace`) reports
#     after the deploy — the same verdict this workflow used to give, minus the queue.
#   * `pull_request` still runs everything, for contributions that do not come through the flash path.
#   * `v*` still runs everything and is the only thing that publishes to GHCR.
#
# Accepted cost: a push to `main` that does NOT come from `/flashdeploy` (a `/docs` commit, a hand
# edit) gets no automatic check. `/docs` and `/release` both run `/verify` first, which is why that
# was judged acceptable rather than papered over with a `[skip ci]` convention.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Serialise runs of the same commit. The original reason is gone — the self-hosted runners shared
# one `~/.cargo`/`~/.rustup` and one dockerd, and concurrent builds corrupted that shared home —
# because hosted runners are isolated per job. What is left is the GHA cache: two runs of the same
# commit would write the same `Swatinem/rust-cache` and BuildKit scopes at once, which wastes a full
# cold build and can evict the entry the other run is about to read.
#
# **`cancel-in-progress` must stay `false`.** A release fires one run, but a re-run or a
# `workflow_dispatch` racing the `v*` tag would otherwise cancel the run that publishes to GHCR.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# **Fork pull requests do not run these jobs.** Yagra is not accepting pull requests
# (`CONTRIBUTING.md`, and `no-pull-requests.yml` closes them), so building one is wasted work. The
# guard below limits these jobs to PRs whose head is a branch of this repository, which is the
# maintainer's own feature-branch → main flow. Tags and `workflow_dispatch` are unaffected.
# `images` needs all three jobs, so it skips with them.
#
# **This guard is not a security control, and must never be treated as one.** A `pull_request` run
# executes the workflow file from the pull request, so a fork can delete these three `if:` lines in
# the same PR they are meant to stop. It saves wasted minutes; it does not keep anyone out. What
# keeps a stranger's code off the build host is that the build host is no longer registered as a
# runner for this repository — see the note at the top of this file.
jobs:
  backend:
    name: backend (rust)
    # See the note above `jobs:` — fork PRs are not built.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Enable the mold linker (S2) for the clippy/test build. The hosted image has passwordless sudo
      # and a new enough `cc`, so this normally succeeds — but it stays best-effort and non-fatal: if
      # mold can't be installed or `cc` won't accept `-fuse-ld=mold` (gcc < 12), we leave RUSTFLAGS
      # unset and fall back to the default linker rather than failing the job. Set before rust-cache
      # so the cache key is consistent across runs (no restore/save key drift).
      - name: Enable mold linker (best-effort)
        run: |
          if ! command -v mold >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends mold || true
          fi
          probe="$(mktemp)"
          if command -v mold >/dev/null 2>&1 && printf 'int main(){return 0;}\n' | cc -fuse-ld=mold -xc - -o "$probe" 2>/dev/null; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold enabled: $(mold --version | head -1)"
          else
            echo "mold unavailable — using default linker"
          fi
          rm -f "$probe"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  frontend:
    name: frontend (web)
    # See the note above `jobs:` — fork PRs are not built.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # ADR-035: the API types and client are generated from `src/api/openapi.json`, which the Rust
      # `backend` job separately proves is current. Regenerating here and demanding no diff is what
      # closes the second half of the chain — otherwise a committed document could describe one
      # contract while the checked-in TypeScript still describes the previous one, which is the
      # hand-maintained mirror this replaced, one file along.
      - name: API types match the OpenAPI document
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # Compose files are configuration nothing else parses: `docker compose up` on a deployed machine
  # was the first thing that ever read them, so a typo surfaced as a failed deploy. ADR-044 touches
  # all four at once (a new service, a new volume, changed ports), which is what finally made this
  # worth a job. Seconds to run, and it gates `images` because a stack that cannot be composed is
  # not worth building.
  compose:
    name: compose files parse
    # See the note above `jobs:` — fork PRs are not built.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate every composition
        run: |
          set -e
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.deploy.yml config -q
          # An overlay, not a standalone file — it has no stores of its own.
          docker compose -f docker-compose.yml -f docker-compose.ha.yml config -q
          # The remote-poller file uses ${VAR:?...} required-variable syntax so a misconfigured
          # poller fails loudly at `up` rather than silently dialling nothing. That makes `config`
          # fail here without values, so supply throwaway ones — we are checking the YAML, not the
          # deployment.
          YAGRA_BUS_URL=tls://poller:x@example.invalid:4222 \
          YAGRA_POLLER_ID=ci \
          YAGRA_POLLER_POOL=ci \
            docker compose -f docker-compose.poller.yml config -q
          docker compose -f docker-compose.registry.yml config -q

  images:
    name: docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    permissions:
      contents: read
      # `permissions` cannot be conditional, so this grant is declared for every ref. What actually
      # gates registry access is the login step below, which runs on a v* tag only.
      packages: write          # push to GHCR on a v* release tag
    strategy:
      # **`max-parallel: 1` is load-bearing, for a different reason than it used to be.** It once
      # stopped concurrent builds contending on the self-hosted host's single dockerd. Now every
      # matrix entry gets its own hosted machine, and the serialisation is what lets `poller` reuse
      # `core`'s work: both target the same yagra-rust.Dockerfile and share the `build` stage that
      # runs `cargo build --bin core --bin poller`, so `core` compiles the workspace, exports that
      # stage to the `rust` BuildKit cache scope, and `poller` imports it and only assembles its
      # runtime layer. Run them in parallel and the workspace is compiled twice from cold.
      max-parallel: 1
      matrix:
        include:
          - { name: core, context: ., dockerfile: docker/yagra-rust.Dockerfile, target: core, cache_scope: rust }
          - { name: poller, context: ., dockerfile: docker/yagra-rust.Dockerfile, target: poller, cache_scope: rust }
          - { name: web, context: ./web, dockerfile: docker/web.Dockerfile, target: "", cache_scope: web }
    steps:
      - uses: actions/checkout@v6
      # The hosted image ships toolchains this build never uses, and a release-profile Rust build
      # plus the wkhtmltopdf layer is the kind of thing that runs a hosted runner out of disk
      # halfway through. Reclaiming these costs seconds and buys ~20 GB.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      # The default `docker-container` driver, NOT `driver: docker`. On the self-hosted host the
      # latter was correct: it used the host's persistent BuildKit, so `RUN --mount=type=cache`
      # storage (the compiled cargo `target/` + registry) survived between runs. On a hosted runner
      # there is no persistent host BuildKit to inherit — the machine is new every job — so that
      # driver would give up layer caching for nothing. The container driver can import/export the
      # GHA cache instead, which is the only cache that crosses runs here.
      - uses: docker/setup-buildx-action@v4
      # Publish to GHCR on a v* release tag ONLY. PRs build without pushing: development builds
      # reach the test server through `/flashdeploy`'s private registry and never appear in GHCR,
      # so the package list is the release history and nothing else.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image tags.
      #
      # PR — one FIXED local tag. Nothing is pushed and nothing is loaded into a daemon, so on a
      # hosted runner this is only a label on a build that dies with the machine; the job's value is
      # that the Dockerfile still builds. (Under the self-hosted scheme it mattered more: a
      # per-commit tag piled images up in the shared daemon, reaching 363 images / 13 GB.) Keep the
      # name free of a registry host so it cannot be pushed anywhere by accident.
      #
      # v* tag — the release. `:v<version>` is what consumers pin, `:<sha>` is that release's
      # immutable reference, and `:latest` means THE LATEST STABLE RELEASE, so it moves only when
      # the version has no pre-release suffix. That test is what stops `/release-beta` from
      # hijacking `:latest` (`v0.2.0-beta1` and `v0.2.0-rc1` both contain a `-`).
      #
      # Known and accepted: `:latest` follows the most recently pushed stable tag, not the highest
      # version — a hotfix `v0.1.20` cut after `v0.2.0` moves it backwards. Pin `:v<version>` if
      # that matters.
      - name: Compute image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:${{ github.ref_name }}"
              echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:${{ github.sha }}"
              if [[ "${{ github.ref_name }}" != *-* ]]; then
                echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:latest"
              fi
            else
              echo "yagra-${{ matrix.name }}:ci"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Compile profile for the Rust images (the web image takes no profile). Only a real release
      # (`/release` → v* tag → :v<version>) is built fully optimized; PR validation builds use the
      # fast-compile `ci-fast` profile so the dev cycle stays short. `/flashdeploy` builds its own
      # `ci-fast` binaries outside CI. See [profile.ci-fast] in Cargo.toml.
      #
      # The profile is also baked into the image as `/etc/yagra-build-profile`, because a release
      # and a flash build of the same commit are different binaries that write the *same*
      # `/etc/yagra-source-ref` — without the profile marker, re-flashing a released commit would
      # silently downgrade the test server with every provenance check still green.
      #
      # `SOURCE_REF` is the cache-bust. It changes every commit, and the Dockerfile *uses* it before
      # `COPY . .` — an unused ARG does not affect the cache at all, since Docker invalidates at an
      # ARG's first use rather than its definition. Without it, BuildKit has been observed reporting
      # `COPY . .` as CACHED against a changed context, which ships the previous commit's binary
      # with every job green (2026-07-31; see the comment in yagra-rust.Dockerfile). The cargo
      # `target/` cache mount is not part of the layer cache and survives this, so builds stay
      # incremental.
      - name: Build arguments
        id: buildargs
        run: |
          {
            echo "list<<EOF"
            echo "SOURCE_REF=${{ github.sha }}"
            if [[ -n "${{ matrix.target }}" ]]; then
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                echo "CARGO_PROFILE=release"
              else
                echo "CARGO_PROFILE=ci-fast"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # core/poller share yagra-rust.Dockerfile and select a stage; web has no target (last stage).
          target: ${{ matrix.target }}
          # SOURCE_REF for all three; CARGO_PROFILE for the Rust targets only. See the step above.
          build-args: ${{ steps.buildargs.outputs.list }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.tags.outputs.list }}
          # `mode=max` exports intermediate stages, not just the final image — that is what makes the
          # shared `build` stage available to `poller` after `core` has produced it (see the
          # `max-parallel` note). `core` and `poller` therefore share one scope; `web` is a different
          # Dockerfile and gets its own so the two do not evict each other out of the repository's
          # 10 GB Actions cache.
          #
          # This does NOT restore the Dockerfile's `RUN --mount=type=cache` cargo directories — no
          # cache backend exports cache mounts. Layers are reused; the compile is not. A cold cargo
          # build per release is the accepted cost of moving off the self-hosted host.
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  # There is deliberately no `deploy` job. CI's responsibility ends at publishing the images;
  # deployment to the test server is an explicit act, run from a workstation over SSH by the
  # `/deploy` command. Three reasons this was split out:
  #
  #   1. A deploy job means the target host runs a GitHub-controlled agent. For a public
  #      repository that is a standing inbound path into a private network.
  #   2. Every push to `main` rewrote a live environment, whether or not that was the intent.
  #   3. The deploy procedure was only reachable through CI, so a broken pipeline meant no
  #      deploy and no rollback either.
  #
  # Server-side configuration (`YAGRA_ENABLE_MCP`, `POSTGRES_PASSWORD`, …) now lives in
  # `~/yagra-deploy/.env` on the test server rather than in Actions secrets/variables.
