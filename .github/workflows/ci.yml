# Continuous integration: validate the workspace on every **pull request** and every **v* tag**.
# Pushes to `main` are deliberately NOT a trigger — see the long note above `on:` below. The
# `images` job builds the Docker images so build breakage — including the Dockerfile's pinned Rust
# version (MSRV) — is caught here. It publishes to GHCR on a **v* release tag only**: development
# builds never reach the registry at all (see the tag-computation step). CI does NOT deploy: see
# the note where the `deploy` job used to be, at the bottom of this file.
#
# Compute runs on SELF-HOSTED runners (label `yagra-build`) to avoid GitHub-hosted Actions-minute
# billing — the repo and images (GHCR) stay on GitHub, only the execution is local. A runner host
# needs: rustup, Node (setup-node fetches it), and Docker + buildx. See the runner setup notes if a
# job fails with a missing toolchain.

name: ci

# **There is deliberately no `branches: [main]` trigger.** It was removed because it was pure
# contention with no gate behind it: `/flashdeploy` ships every main push to the test server, does
# not wait for CI's verdict, and runs its own fmt/clippy/build/test on this same host — so a main
# push started a second full compile of the same commit on the same box, competing for the CPU and
# the shared BuildKit/cargo caches with the deploy that was already underway. Every job it ran was
# something the flash path had already run locally, and the `images` job was a verbatim repeat of
# the three images `/flashdeploy` had just built.
#
# What still gates what:
#   * `/flashdeploy`'s local guard (fmt, clippy, the OpenAPI contract, web tests) gates the ship,
#     and its asynchronous pass (`cargo clippy --all-targets` + `cargo test --workspace`) reports
#     after the deploy — the same verdict this workflow used to give, minus the queue.
#   * `pull_request` still runs everything, for contributions that do not come through the flash path.
#   * `v*` still runs everything and is the only thing that publishes to GHCR.
#
# Accepted cost: a push to `main` that does NOT come from `/flashdeploy` (a `/docs` commit, a hand
# edit) gets no automatic check. `/docs` and `/release` both run `/verify` first, which is why that
# was judged acceptable rather than papered over with a `[skip ci]` convention.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The self-hosted runners share one `~/.cargo` / `~/.rustup` (and one dockerd), so two concurrent
# cargo builds race on that shared home: registry/target files vanish mid-compile ("No such file or
# directory", rustc "never executed"). Serialise same-commit runs rather than letting them contend.
# `cancel-in-progress: false` keeps both — neither run is dropped.
#
# This used to matter most for a release, which fired two runs at once (the `main` push and the
# `v*` tag push) against the same `github.sha`. With the `main` trigger gone a release fires one
# run, so this now only covers a re-run or a `workflow_dispatch` racing a tag. Keep it: it costs
# nothing and the failure it prevents is a corrupted shared cargo home, not a wasted run.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# **Fork pull requests do not run these jobs.** Yagra is not accepting pull requests
# (`CONTRIBUTING.md`, and `no-pull-requests.yml` closes them), so building one is wasted work — but
# the real reason is the runners: every job below is self-hosted on the build host, and a
# `pull_request` run from a fork would execute that fork's code there. The guard below limits these
# jobs to PRs whose head is a branch of this repository, which is the maintainer's own
# feature-branch → main flow. Tags and `workflow_dispatch` are unaffected.
#
# This is belt and braces alongside GitHub's "require approval for fork pull requests" setting: the
# setting can be relaxed in the UI without anyone re-reading this file, and the guard cannot.
# `images` needs all three jobs, so it skips with them.
jobs:
  backend:
    name: backend (rust)
    # See the note above `jobs:` — fork PRs are not built.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, yagra-build]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Enable the mold linker (S2) for the host clippy/test build. Best-effort and non-fatal: if mold
      # can't be installed (no passwordless sudo) or `cc` is too old to accept `-fuse-ld=mold` (gcc <
      # 12), we leave RUSTFLAGS unset and fall back to the default linker — the build still runs. Set
      # before rust-cache so the cache key is consistent across runs (no restore/save key drift).
      - name: Enable mold linker (best-effort)
        run: |
          if ! command -v mold >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends mold || true
          fi
          probe="$(mktemp)"
          if command -v mold >/dev/null 2>&1 && printf 'int main(){return 0;}\n' | cc -fuse-ld=mold -xc - -o "$probe" 2>/dev/null; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold enabled: $(mold --version | head -1)"
          else
            echo "mold unavailable — using default linker"
          fi
          rm -f "$probe"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  frontend:
    name: frontend (web)
    # See the note above `jobs:` — fork PRs are not built.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, yagra-build]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # ADR-035: the API types and client are generated from `src/api/openapi.json`, which the Rust
      # `backend` job separately proves is current. Regenerating here and demanding no diff is what
      # closes the second half of the chain — otherwise a committed document could describe one
      # contract while the checked-in TypeScript still describes the previous one, which is the
      # hand-maintained mirror this replaced, one file along.
      - name: API types match the OpenAPI document
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # Compose files are configuration nothing else parses: `docker compose up` on a deployed machine
  # was the first thing that ever read them, so a typo surfaced as a failed deploy. ADR-044 touches
  # all four at once (a new service, a new volume, changed ports), which is what finally made this
  # worth a job. Seconds to run, and it gates `images` because a stack that cannot be composed is
  # not worth building.
  compose:
    name: compose files parse
    # See the note above `jobs:` — fork PRs are not built.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, yagra-build]
    steps:
      - uses: actions/checkout@v6
      - name: Validate every composition
        run: |
          set -e
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.deploy.yml config -q
          # An overlay, not a standalone file — it has no stores of its own.
          docker compose -f docker-compose.yml -f docker-compose.ha.yml config -q
          # The remote-poller file uses ${VAR:?...} required-variable syntax so a misconfigured
          # poller fails loudly at `up` rather than silently dialling nothing. That makes `config`
          # fail here without values, so supply throwaway ones — we are checking the YAML, not the
          # deployment.
          YAGRA_BUS_URL=tls://poller:x@example.invalid:4222 \
          YAGRA_POLLER_ID=ci \
          YAGRA_POLLER_POOL=ci \
            docker compose -f docker-compose.poller.yml config -q
          docker compose -f docker-compose.registry.yml config -q

  images:
    name: docker image
    runs-on: [self-hosted, linux, yagra-build]
    needs: [backend, frontend, compose]
    permissions:
      contents: read
      # `permissions` cannot be conditional, so this grant is declared for every ref. What actually
      # gates registry access is the login step below, which runs on a v* tag only.
      packages: write          # push to GHCR on a v* release tag
    strategy:
      # One docker build at a time: the self-hosted runners share a single dockerd, so concurrent
      # image builds contend on it (and earlier hung on the GHA cache). backend/frontend still
      # parallelise across runners — only this matrix is serialised. Serialisation also lets `poller`
      # reuse `core`'s cached build stage: both target the same yagra-rust.Dockerfile, so the shared
      # `cargo build --bin core --bin poller` runs once (during `core`) and `poller` just assembles
      # its runtime layer.
      max-parallel: 1
      matrix:
        include:
          - { name: core, context: ., dockerfile: docker/yagra-rust.Dockerfile, target: core }
          - { name: poller, context: ., dockerfile: docker/yagra-rust.Dockerfile, target: poller }
          - { name: web, context: ./web, dockerfile: docker/web.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v6
      # Use the host dockerd's built-in BuildKit (`driver: docker`), not an ephemeral
      # docker-container builder. The container builder is torn down after each run, discarding its
      # `RUN --mount=type=cache` storage (the compiled cargo `target/` + registry) — so every image
      # build started cold. The host BuildKit persists on the self-hosted runner, so those cache
      # mounts survive between runs and dependency compilation is reused across builds.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      # Publish to GHCR on a v* release tag ONLY. PRs build without pushing: development builds
      # reach the test server through `/flashdeploy`'s private registry and never appear in GHCR,
      # so the package list is the release history and nothing else.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image tags.
      #
      # PR — one FIXED local tag, overwritten every run. Nothing is pushed, so a per-commit tag
      # would only pile images up in the shared runner daemon that nothing ever consumes (it
      # reached 363 images / 13 GB under the old scheme). The name carries no registry host, so it
      # cannot be pushed anywhere by accident.
      #
      # v* tag — the release. `:v<version>` is what consumers pin, `:<sha>` is that release's
      # immutable reference, and `:latest` means THE LATEST STABLE RELEASE, so it moves only when
      # the version has no pre-release suffix. That test is what stops `/release-beta` from
      # hijacking `:latest` (`v0.2.0-beta1` and `v0.2.0-rc1` both contain a `-`).
      #
      # Known and accepted: `:latest` follows the most recently pushed stable tag, not the highest
      # version — a hotfix `v0.1.20` cut after `v0.2.0` moves it backwards. Pin `:v<version>` if
      # that matters.
      - name: Compute image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:${{ github.ref_name }}"
              echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:${{ github.sha }}"
              if [[ "${{ github.ref_name }}" != *-* ]]; then
                echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:latest"
              fi
            else
              echo "yagra-${{ matrix.name }}:ci"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Compile profile for the Rust images (the web image takes no profile). Only a real release
      # (`/release` → v* tag → :v<version>) is built fully optimized; PR validation builds use the
      # fast-compile `ci-fast` profile so the dev cycle stays short. `/flashdeploy` builds its own
      # `ci-fast` binaries outside CI. See [profile.ci-fast] in Cargo.toml.
      #
      # The profile is also baked into the image as `/etc/yagra-build-profile`, because a release
      # and a flash build of the same commit are different binaries that write the *same*
      # `/etc/yagra-source-ref` — without the profile marker, re-flashing a released commit would
      # silently downgrade the test server with every provenance check still green.
      #
      # `SOURCE_REF` is the cache-bust. It changes every commit, and the Dockerfile *uses* it before
      # `COPY . .` — an unused ARG does not affect the cache at all, since Docker invalidates at an
      # ARG's first use rather than its definition. Without it, BuildKit has been observed reporting
      # `COPY . .` as CACHED against a changed context, which ships the previous commit's binary
      # with every job green (2026-07-31; see the comment in yagra-rust.Dockerfile). The cargo
      # `target/` cache mount is not part of the layer cache and survives this, so builds stay
      # incremental.
      - name: Build arguments
        id: buildargs
        run: |
          {
            echo "list<<EOF"
            echo "SOURCE_REF=${{ github.sha }}"
            if [[ -n "${{ matrix.target }}" ]]; then
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                echo "CARGO_PROFILE=release"
              else
                echo "CARGO_PROFILE=ci-fast"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # core/poller share yagra-rust.Dockerfile and select a stage; web has no target (last stage).
          target: ${{ matrix.target }}
          # SOURCE_REF for all three; CARGO_PROFILE for the Rust targets only. See the step above.
          build-args: ${{ steps.buildargs.outputs.list }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.tags.outputs.list }}
          # No type=gha cache: on the persistent self-hosted runner the local docker layer cache is
          # reused anyway, and the GHA cache service was hanging the build (stuck importing, no CPU).

  # There is deliberately no `deploy` job. CI's responsibility ends at publishing the images;
  # deployment to the test server is an explicit act, run from a workstation over SSH by the
  # `/deploy` command. Three reasons this was split out:
  #
  #   1. A deploy job means the target host runs a GitHub-controlled agent. For a public
  #      repository that is a standing inbound path into a private network.
  #   2. Every push to `main` rewrote a live environment, whether or not that was the intent.
  #   3. The deploy procedure was only reachable through CI, so a broken pipeline meant no
  #      deploy and no rollback either.
  #
  # Server-side configuration (`YAGRA_ENABLE_MCP`, `POSTGRES_PASSWORD`, …) now lives in
  # `~/yagra-deploy/.env` on the test server rather than in Actions secrets/variables.
