# Continuous integration: validate the workspace on every push / PR. The `images` job builds the
# Docker images (pushing to GHCR only on main) so build breakage — including the Dockerfile's pinned
# Rust version (MSRV) — is caught here; `deploy` publishes to the test server on main.
#
# Compute runs on SELF-HOSTED runners (label `yagra-build` for build/test/images, `yagra-test` for
# deploy) to avoid GitHub-hosted Actions-minute billing — the repo, images (GHCR) and deploy stay on
# GitHub, only the execution is local. A runner host needs: rustup, Node (setup-node fetches it),
# and Docker + buildx. See the runner setup notes if a job fails with a missing toolchain.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A release fires two runs at once — the `main` push and the `v*` tag push — and both point at the
# same commit, so they share `github.sha`. The self-hosted runners share one `~/.cargo` / `~/.rustup`
# (and one dockerd), so two concurrent cargo builds race on that shared home: registry/target files
# vanish mid-compile ("No such file or directory", rustc "never executed"). Serialise same-commit
# runs so the tag run waits for the main run instead of contending. `cancel-in-progress: false`
# keeps both — neither run is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  backend:
    name: backend (rust)
    runs-on: [self-hosted, linux, yagra-build]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Enable the mold linker (S2) for the host clippy/test build. Best-effort and non-fatal: if mold
      # can't be installed (no passwordless sudo) or `cc` is too old to accept `-fuse-ld=mold` (gcc <
      # 12), we leave RUSTFLAGS unset and fall back to the default linker — the build still runs. Set
      # before rust-cache so the cache key is consistent across runs (no restore/save key drift).
      - name: Enable mold linker (best-effort)
        run: |
          if ! command -v mold >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends mold || true
          fi
          probe="$(mktemp)"
          if command -v mold >/dev/null 2>&1 && printf 'int main(){return 0;}\n' | cc -fuse-ld=mold -xc - -o "$probe" 2>/dev/null; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold enabled: $(mold --version | head -1)"
          else
            echo "mold unavailable — using default linker"
          fi
          rm -f "$probe"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  frontend:
    name: frontend (web)
    runs-on: [self-hosted, linux, yagra-build]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  images:
    name: docker image
    runs-on: [self-hosted, linux, yagra-build]
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write          # push to GHCR on main
    strategy:
      # One docker build at a time: the self-hosted runners share a single dockerd, so concurrent
      # image builds contend on it (and earlier hung on the GHA cache). backend/frontend still
      # parallelise across runners — only this matrix is serialised. Serialisation also lets `poller`
      # reuse `core`'s cached build stage: both target the same yagra-rust.Dockerfile, so the shared
      # `cargo build --bin core --bin poller` runs once (during `core`) and `poller` just assembles
      # its runtime layer.
      max-parallel: 1
      matrix:
        include:
          - { name: core, context: ., dockerfile: docker/yagra-rust.Dockerfile, target: core }
          - { name: poller, context: ., dockerfile: docker/yagra-rust.Dockerfile, target: poller }
          - { name: web, context: ./web, dockerfile: docker/web.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v6
      # Use the host dockerd's built-in BuildKit (`driver: docker`), not an ephemeral
      # docker-container builder. The container builder is torn down after each run, discarding its
      # `RUN --mount=type=cache` storage (the compiled cargo `target/` + registry) — so every image
      # build started cold. The host BuildKit persists on the self-hosted runner, so those cache
      # mounts survive between runs and dependency compilation is reused across builds.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      # Publish to GHCR on main and on a v* release tag; PRs build without pushing.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image tags: always the immutable :<sha>. :latest moves only on a main push (the
      # test-server channel) — never on a tag, so a beta/rc tag can't hijack :latest. On a
      # v* git tag, publish the version tag (e.g. :v0.1.0) so a release is pullable by it.
      - name: Compute image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:${{ github.sha }}"
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:latest"
            fi
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "ghcr.io/horryworks/yagra-${{ matrix.name }}:${{ github.ref_name }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Compile profile for the Rust images (ignored by the web image). Only a real release (`/release`
      # → v* tag → :v<version>) is built fully optimized; every other build — a `/flashdeploy` main
      # push (:latest, the test-server channel) and PR validation builds — uses the fast-compile
      # `ci-fast` profile so the dev cycle stays short. See [profile.ci-fast] in Cargo.toml.
      - name: Select cargo profile
        id: profile
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "cargo=release" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=ci-fast" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # core/poller share yagra-rust.Dockerfile and select a stage; web has no target (last stage).
          target: ${{ matrix.target }}
          # Pass the compile profile only to the Rust images (empty target ⇒ web ⇒ no build-arg).
          build-args: ${{ matrix.target != '' && format('CARGO_PROFILE={0}', steps.profile.outputs.cargo) || '' }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.tags.outputs.list }}
          # No type=gha cache: on the persistent self-hosted runner the local docker layer cache is
          # reused anyway, and the GHA cache service was hanging the build (stuck importing, no CPU).

  deploy:
    name: deploy to test server
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, yagra-test]
    permissions:
      contents: read
      packages: read           # pull from GHCR
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull & deploy (latest)
        env:
          YAGRA_IMAGE_TAG: latest
          # Optional override; empty secret falls back to the compose default.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # MCP server (ADR-028): toggled by the `YAGRA_ENABLE_MCP` repo variable (unset ⇒ empty ⇒
          # compose default `false`). The test server is the MCP validation channel; flip the variable
          # to turn it off without a code change.
          YAGRA_ENABLE_MCP: ${{ vars.YAGRA_ENABLE_MCP }}
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans
      - name: Reclaim disk
        if: always()
        run: docker image prune -f
