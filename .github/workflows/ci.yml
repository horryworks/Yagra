# Continuous integration: validate the workspace on every **pull request** and every **v* tag**.
# Pushes to `main` are deliberately NOT a trigger — see the long note above `on:` below.
#
# Shape (ADR-152): the tests and the three image builds run SIDE BY SIDE, and nothing is published
# until every one of them is green. `images-rust` and `images-web` each build into an OCI archive and
# upload it as an artifact; `publish` is the only job holding `packages: write`, and it copies the
# three archives to GHCR on a v* release tag. On a PR or a manual dispatch the same `publish` job
# copies them to a throwaway registry inside the job instead, so the publishing steps themselves run
# on every PR rather than for the first time during a release. CI does NOT deploy: see the note at
# the bottom of this file.
#
# Before ADR-152 the four stages were strictly serial (v0.3.21: backend 10m35s, then core 14m23s,
# then poller 1m47s, then web 1m42s — 28m33s), and each image was pushed the moment it built, so a
# web failure left core and poller already published under `:latest`.
#
# Everything runs on GITHUB-HOSTED runners. It used to run on self-hosted runners (label
# `yagra-build`) on the build host, to avoid Actions-minute billing — which is free for a public
# repository anyway, and was never worth what it cost once the repository went public:
#
#   A `pull_request` run uses the workflow file **from the pull request**, not from `main`. So a
#   fork could delete the fork-PR guard below (or add a second workflow file naming the
#   `yagra-build` label) and run arbitrary code on the build host — a machine that answered on
#   the LAN's SSH ports, whose dockerd a workflow step can drive as root, and which carries a
#   persistent cargo/BuildKit cache that the next `v*` release build compiles against.
#   **Poisoning that cache ships a backdoored image to GHCR with every job green** — the same
#   failure shape as the stale-layer incident, except deliberate. Nothing written in this file can
#   prevent it, because the attacker supplies this file.
#
#   What the host did NOT hold is a registry credential: `~/.docker/config.json` was checked for
#   both the login user and root and has no auth entries. Publishing is CI's, with `GITHUB_TOKEN`;
#   `/flashdeploy` pushes to an unauthenticated LAN registry. The risk here is cache poisoning and
#   network adjacency, not credential theft — do not "fix" this by hunting for secrets to remove.
#
# The runners were therefore deregistered from the repository: a malicious `runs-on: self-hosted`
# now matches no runner and the job simply times out without executing. That property is structural
# — it survives someone relaxing a setting or editing this file.
#
# Accepted cost, measured on the first hosted run (2026-08-09, `ci-fast`, nothing published):
# **11m09s → 28m14s** against the comparable self-hosted run. Where it went, per job:
#
#     compose   0m13s → 0m08s     frontend  1m16s → 1m16s     backend   7m56s → 10m48s
#     img/core  1m51s → 13m49s    img/poller 0m21s → 1m22s    img/web   0m46s → 2m01s
#
# `img/core` is the whole story. `Swatinem/rust-cache` and the BuildKit GHA cache carry what they
# can, but **no cache backend exports the Dockerfile's `RUN --mount=type=cache` cargo directories**,
# so the image build recompiles the workspace every run and that ~14 min is a floor, not a cold-start
# cost that later runs recover. ADR-152 does not shrink it; it stops the tests being added on top.
#
# That is the price of not having a build machine inside the network reachable from a stranger's
# pull request.

name: ci

# **There is deliberately no `branches: [main]` trigger.** It was removed because it was pure
# contention with no gate behind it: `/flashdeploy` ships every main push to the verification boxes,
# does not wait for CI's verdict, and runs its own fmt/clippy/build/test — so a main push started a
# second full compile of the same commit that gated nothing.
#
# What still gates what:
#   * `/flashdeploy`'s local guard (fmt, clippy, the OpenAPI contract, web tests) gates the ship,
#     and its asynchronous pass (`scripts/flash-verify.sh`) reports after the deploy.
#   * `pull_request` still runs everything, for contributions that do not come through the flash path.
#   * `v*` still runs everything and is the only thing that publishes to GHCR.
#
# Accepted cost: a push to `main` that does NOT come from `/flashdeploy` (a `/docs` commit, a hand
# edit) gets no automatic check. `/docs` and `/release` both expect `/verify` to have run first,
# which is why that was judged acceptable rather than papered over with a `[skip ci]` convention.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Serialise runs of the same commit. Two runs of the same commit would write the same
# `Swatinem/rust-cache` and BuildKit scopes at once, which wastes a full cold build and can evict the
# entry the other run is about to read.
#
# **`cancel-in-progress` must stay `false`.** A release fires one run, but a re-run or a
# `workflow_dispatch` racing the `v*` tag would otherwise cancel the run that publishes to GHCR.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# **Fork pull requests do not run these jobs.** Yagra is not accepting pull requests
# (`CONTRIBUTING.md`, and `no-pull-requests.yml` closes them), so building one is wasted work. The
# guard below limits every job to PRs whose head is a branch of this repository, which is the
# maintainer's own feature-branch → main flow. Tags and `workflow_dispatch` are unaffected. Since
# ADR-152 the image jobs no longer `need` the tests, so each carries the guard itself.
#
# **This guard is not a security control, and must never be treated as one.** A `pull_request` run
# executes the workflow file from the pull request, so a fork can delete these `if:` lines in the
# same PR they are meant to stop. It saves wasted minutes; it does not keep anyone out. What keeps a
# stranger's code off the build host is that the build host is no longer registered as a runner for
# this repository — see the note at the top of this file.
#
# **Every job has a `timeout-minutes`.** Without one a job runs to GitHub's six-hour ceiling: v0.2.15's
# tag run did exactly that when `apt-get update` hung inside the mold step, and a `cancelled` run
# publishes nothing. ⚠️ A timeout added here does not reach a tag that already exists — a tag run
# reads the workflow file as it was at that tag.
jobs:
  backend:
    name: backend (rust)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The database tests (ADR-114) need a running PostgreSQL, not a compile-time one: the workspace
    # has no `sqlx::query!` macros and no `.sqlx` directory, so the *build* still needs nothing.
    # `#[sqlx::test]` creates one throwaway database per test from this server, which is why the
    # account is the image's superuser — it must be able to CREATE DATABASE.
    #
    # Pinned to the same image every deployment runs (`docker-compose.yml`). A test suite passing
    # against a different major than production is a weaker statement than it looks.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Enable the mold linker (S2) for the clippy/test build. The hosted image has passwordless sudo
      # and a new enough `cc`, so this normally succeeds — but it stays best-effort and non-fatal: if
      # mold can't be installed or `cc` won't accept `-fuse-ld=mold` (gcc < 12), we leave RUSTFLAGS
      # unset and fall back to the default linker rather than failing the job. Set before rust-cache
      # so the cache key is consistent across runs (no restore/save key drift).
      #
      # 🚨 `|| true` covers a failing apt, not a HANGING one — a hang returns no exit code at all.
      # That is what the step timeout is for (v0.2.15: six hours, then `cancelled`).
      - name: Enable mold linker (best-effort)
        timeout-minutes: 10
        run: |
          if ! command -v mold >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends mold || true
          fi
          probe="$(mktemp)"
          if command -v mold >/dev/null 2>&1 && printf 'int main(){return 0;}\n' | cc -fuse-ld=mold -xc - -o "$probe" 2>/dev/null; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold enabled: $(mold --version | head -1)"
          else
            echo "mold unavailable — using default linker"
          fi
          rm -f "$probe"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # 🚨 A SECOND command, and it is not a duplicate of the one above.
      #
      # The database tests carry `#[ignore]` so that `cargo test` on a machine with no PostgreSQL
      # stays green (ADR-114) — which means the run above skips them. This is the run that does not.
      #
      # ⚠️ `--all-targets` is load-bearing. `--include-ignored` also un-ignores doctests written as
      # ```ignore, which are illustrative snippets that were never meant to compile;
      # `yagra-common/src/srcread.rs` holds one that fails immediately. `--all-targets` covers
      # lib/bin/test targets and excludes doctests, so the step above remains the one that runs them.
      - name: Test (database)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --workspace --all-targets -- --include-ignored

  frontend:
    name: frontend (web)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # ADR-035: the API types and client are generated from `src/api/openapi.json`, which the Rust
      # `backend` job separately proves is current. Regenerating here and demanding no diff is what
      # closes the second half of the chain — otherwise a committed document could describe one
      # contract while the checked-in TypeScript still describes the previous one, which is the
      # hand-maintained mirror this replaced, one file along.
      - name: API types match the OpenAPI document
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # Compose files are configuration nothing else parses: `docker compose up` on a deployed machine
  # was the first thing that ever read them, so a typo surfaced as a failed deploy. Seconds to run,
  # and `publish` needs it because a stack that cannot be composed is not worth publishing.
  compose:
    name: compose files parse
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate every composition
        run: |
          set -e
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.deploy.yml config -q
          # An overlay, not a standalone file — it has no stores of its own.
          docker compose -f docker-compose.yml -f docker-compose.ha.yml config -q
          # The remote-poller file uses ${VAR:?...} required-variable syntax so a misconfigured
          # poller fails loudly at `up` rather than silently dialling nothing. That makes `config`
          # fail here without values, so supply throwaway ones — we are checking the YAML, not the
          # deployment.
          YAGRA_BUS_URL=tls://poller:x@example.invalid:4222 \
          YAGRA_POLLER_ID=ci \
          YAGRA_POLLER_POOL=ci \
            docker compose -f docker-compose.poller.yml config -q
          docker compose -f docker-compose.registry.yml config -q

  # The two Rust images. **No `needs`** (ADR-152): the compile starts at the same moment as the
  # tests instead of after them, because `publish` is what waits for both.
  #
  # **`max-parallel: 1` is load-bearing.** Every matrix entry gets its own hosted machine, and the
  # serialisation is what lets `poller` reuse `core`'s work: both target the same
  # yagra-rust.Dockerfile and share the `build` stage that runs
  # `cargo build --bin yagra-core --bin yagra-poller`, so `core` compiles the workspace, exports that
  # stage to the `rust` GHA cache scope, and `poller` imports it and only assembles its runtime layer.
  # Run them in parallel and the workspace is compiled twice from cold.
  images-rust:
    name: docker image (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # core's cold `release` compile is ~15 min; poller is ~2 min unless the GHA cache was evicted,
    # in which case it compiles cold too.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { name: core, target: core }
          - { name: poller, target: poller }
    steps:
      - uses: actions/checkout@v6
      # The hosted image ships toolchains this build never uses, and a release-profile Rust build
      # plus the wkhtmltopdf layer is the kind of thing that runs a hosted runner out of disk
      # halfway through. Reclaiming these costs seconds and buys ~20 GB.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: ./.github/actions/build-image
        with:
          name: ${{ matrix.name }}
          context: .
          dockerfile: docker/yagra-rust.Dockerfile
          target: ${{ matrix.target }}
          cache-scope: rust

  # A different Dockerfile with its own cache scope, so it waits for nothing — before ADR-152 it sat
  # in the Rust matrix and queued behind both Rust images.
  images-web:
    name: docker image (web)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-image
        with:
          name: web
          context: ./web
          dockerfile: docker/web.Dockerfile
          cache-scope: web

  # The ONLY job that writes to a registry, and it runs only when the tests and all three builds are
  # green (ADR-152). That is what makes a partial release impossible: before, each matrix entry
  # pushed as soon as it built, so a failing `web` left `core` and `poller` already under `:latest`,
  # and every default `docker compose up` pulled a mixed stack.
  #
  # **It runs on every event; only the destination changes.** A v* tag publishes to GHCR — and so
  # does a `workflow_dispatch` on a tag ref, which is the documented recovery when a tag push
  # produced no run at all, because the test is on `github.ref`, not on the event name. Anything
  # else copies to the throwaway `registry:2` service below. The steps between the two are
  # identical, so a PR exercises the same copy and the same digest check a release depends on.
  #
  # GHCR holds releases and nothing else (ADR-036): `:v<version>` is what consumers pin, `:<sha>` is
  # that release's immutable reference, and `:latest` means THE LATEST STABLE RELEASE, so it moves
  # only when the version has no pre-release suffix — that test is what stops `/release-beta` from
  # hijacking `:latest` (`v0.2.0-beta1` and `v0.2.0-rc1` both contain a `-`). Known and accepted:
  # `:latest` follows the most recently pushed stable tag, not the highest version.
  publish:
    name: publish images
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [backend, frontend, compose, images-rust, images-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # `permissions` cannot be conditional, so this is declared for every ref. What actually gates
      # registry access is the login step, which runs on a v* tag only.
      packages: write
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      # All three, before the first byte goes anywhere.
      - name: All three archives are here
        run: |
          set -euo pipefail
          for n in core poller web; do
            test -s "$RUNNER_TEMP/images/yagra-$n.tar" || { echo "::error::yagra-$n.tar is missing"; exit 1; }
          done
          ls -l "$RUNNER_TEMP/images"

      - name: Destination and tags
        id: dest
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            registry=ghcr.io/horryworks
            tls=true
            # Immutable tags first, `latest` last: if anything fails mid-copy, the tag that every
            # default install pulls is the one that has not moved yet.
            tags="$REF_NAME $SHA"
            if [[ "$REF_NAME" != *-* ]]; then
              tags="$tags latest"
            fi
          else
            registry=localhost:5000/horryworks
            tls=false
            # The same three-tag shape a stable release has, so the digest check below is exercised.
            tags="ci $SHA latest"
          fi
          {
            echo "registry=$registry"
            echo "tls=$tls"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "publishing to $registry as: $tags"

      - name: Wait for the throwaway registry
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/v2/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::the registry service did not answer in 30 s"
          exit 1

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin

      # `--all` keeps the whole OCI index (the image and its provenance attestation) and
      # `--preserve-digests` refuses to re-encode anything, so the digest a consumer pins is the one
      # buildx produced. Tags are the outer loop so every image gets `:v<version>` before any image
      # gets `:latest`. A second copy of the same archive uploads no blobs — only the manifest.
      - name: Copy the archives
        env:
          REGISTRY: ${{ steps.dest.outputs.registry }}
          TLS: ${{ steps.dest.outputs.tls }}
          TAGS: ${{ steps.dest.outputs.tags }}
        run: |
          set -euo pipefail
          for t in $TAGS; do
            for n in core poller web; do
              echo "== yagra-$n:$t"
              skopeo copy --all --preserve-digests --dest-tls-verify="$TLS" \
                "oci-archive:$RUNNER_TEMP/images/yagra-$n.tar" "docker://$REGISTRY/yagra-$n:$t"
            done
          done

      # The registry, asked directly: every tag of an image must name the exact index the archive
      # holds. This is where "`:latest` did not move" or "a copy re-encoded the image" is caught,
      # instead of by whoever pulls it. `/release` Step 6 still checks `:latest` from outside.
      - name: Every tag names the digest that was built
        env:
          REGISTRY: ${{ steps.dest.outputs.registry }}
          TLS: ${{ steps.dest.outputs.tls }}
          TAGS: ${{ steps.dest.outputs.tags }}
        run: |
          set -euo pipefail
          for n in core poller web; do
            want=$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/images/yagra-$n.tar" | sha256sum | cut -d' ' -f1)
            echo "yagra-$n built   sha256:$want"
            for t in $TAGS; do
              got=$(skopeo inspect --raw --tls-verify="$TLS" "docker://$REGISTRY/yagra-$n:$t" | sha256sum | cut -d' ' -f1)
              echo "yagra-$n:$t sha256:$got"
              if [[ "$got" != "$want" ]]; then
                echo "::error::yagra-$n:$t is sha256:$got, but the archive that was built is sha256:$want"
                exit 1
              fi
            done
          done

  # There is deliberately no `deploy` job. CI's responsibility ends at publishing the images; every
  # deployment upgrades itself from Settings ▸ Upgrade in its own WebUI (ADR-050). Two reasons this
  # stays out of CI:
  #
  #   1. A deploy job means the target host runs a GitHub-controlled agent. For a public
  #      repository that is a standing inbound path into a private network.
  #   2. Every push would rewrite a live environment, whether or not that was the intent.
  #
  # (`/deploy`, the workstation command that once did this over SSH, was retired on 2026-09-06 with
  # its only target, the test server.)
