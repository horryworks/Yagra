# Continuous integration: validate the workspace on every push / PR. No deploy, no
# registry push — that is `deploy-test.yml`'s job. The `images` job builds the Docker
# images (without pushing) so build breakage — including the Dockerfile's pinned Rust
# version (MSRV) — is caught here, even though images are only published on deploy.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  frontend:
    name: frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  images:
    name: docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write          # push to GHCR on main
    strategy:
      matrix:
        include:
          - { name: core, context: ., dockerfile: docker/yagra-core.Dockerfile }
          - { name: poller, context: ., dockerfile: docker/yagra-poller.Dockerfile }
          - { name: web, context: ./web, dockerfile: docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Publish to GHCR only on main; PRs build without pushing.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/horryworks/yagra-${{ matrix.name }}:latest
            ghcr.io/horryworks/yagra-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

  deploy:
    name: deploy to test server
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, yagra-test]
    permissions:
      contents: read
      packages: read           # pull from GHCR
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull & deploy (latest)
        env:
          YAGRA_IMAGE_TAG: latest
          # Optional override; empty secret falls back to the compose default.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans
      - name: Reclaim disk
        if: always()
        run: docker image prune -f
